name: Validate PR (Scratch Org)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
    paths:
      - "packages/**"
      - "sfdx-project.json"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/pr.yml"

# One validation run per PR at a time. A new push cancels the run still going, so quick
# pushes never hold every scratch org slot at once. A label event runs no tests, so it has
# its own group and never cancels a real run.
concurrency:
  group: pr-${{ github.event.pull_request.number }}-${{ github.event.action == 'labeled' && 'label' || 'run' }}
  cancel-in-progress: true

jobs:
  quality-check:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment & Scanner
        uses: rdbumstead/setup-salesforce-action@v2
        with:
          node_version: "22"
          skip_auth: "true"
          install_scanner: "true"

      - name: Install Dependencies
        run: npm ci

      - name: Run Quality Gates
        run: |
          npm run scan:secrets
          npm run test:unit
          npm run docs:verify

      # Fails the PR when a comment, description or help text under packages/, or a line of
      # the docs, README.md or STATUS.md, names an internal planning reference. The script
      # skips the generated API pages in docs/api/oas. The gate's own tests run first.
      - name: Check Internal References
        run: |
          node --test scripts/check-internal-refs.test.js
          node scripts/check-internal-refs.js packages docs README.md STATUS.md

      # Fails the PR when the live smoke test's route list no longer matches the site: a
      # component the smoke expects that its page no longer places, or a page it skips.
      # Reads files only, so it needs no browser and no org.
      - name: Check Smoke Routes
        run: |
          node --test scripts/check-smoke-routes.test.js
          node scripts/check-smoke-routes.js

      # The API Lab's Postman collection is generated from the PAPI spec. A spec change that did
      # not regenerate it fails the PR. The converter is installed outside package.json. The
      # probe sends the deploy's exact request body to Postman with a key that cannot be valid,
      # so a body Postman's firewall would refuse fails here instead of after the merge.
      - name: Postman Collection Is Current
        run: |
          node --test scripts/build-postman-collection.test.js
          npm install --prefix "$RUNNER_TEMP/o2p" --no-save --no-audit --no-fund openapi-to-postmanv2@6.4.0
          OPENAPI_TO_POSTMAN_DIR="$RUNNER_TEMP/o2p/node_modules/openapi-to-postmanv2" node scripts/build-postman-collection.js --check
          node scripts/postman-sync.js probe

      # Draws every Mermaid block in the docs as a light and a dark SVG, the same way the deploy
      # does, so a diagram that will not render fails the PR. Its tests fail the PR when a block
      # has no alt sentence. The CLI is installed outside package.json and uses the runner's Chrome.
      - name: Render Mermaid Diagrams
        run: |
          node --test scripts/render-mermaid.test.js
          PUPPETEER_SKIP_DOWNLOAD=1 npm install --prefix "$RUNNER_TEMP/mmd" --no-save --no-audit --no-fund @mermaid-js/mermaid-cli@12.0.0 puppeteer@25.16.0
          MERMAID_CLI_DIR="$RUNNER_TEMP/mmd" PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome)" node scripts/render-mermaid.js

      - name: Run Salesforce Code Analyzer
        run: |
          npm run scan

  scratch-org-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Salesforce & Tools
        uses: rdbumstead/setup-salesforce-action@v2
        with:
          node_version: "22"
          jwt_key: ${{ secrets.SFDX_JWT_KEY }}
          client_id: ${{ secrets.SFDX_CLIENT_ID }}
          username: ${{ secrets.SFDX_USERNAME }}
          is_dev_hub: "true"
          install_delta: "true"
          alias: "portfolio"

      # The setup action deletes its JWT key file when its login step ends, but the CLI
      # needs the Dev Hub key again to log in to a new scratch org after signup. Without
      # it the create fails after the org exists. Log in to the Dev Hub again with a key
      # file that lives until the last step of this job.
      - name: Restore Dev Hub Key
        env:
          SFDX_JWT_KEY: ${{ secrets.SFDX_JWT_KEY }}
          SFDX_CLIENT_ID: ${{ secrets.SFDX_CLIENT_ID }}
          SFDX_USERNAME: ${{ secrets.SFDX_USERNAME }}
        run: |
          KEY_FILE="$RUNNER_TEMP/devhub.key"
          printf '%s\n' "$SFDX_JWT_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          sf org login jwt --client-id "$SFDX_CLIENT_ID" --jwt-key-file "$KEY_FILE" --username "$SFDX_USERNAME" --instance-url https://login.salesforce.com --alias portfolio --set-default-dev-hub --json \
            | jq '{status, orgId: .result.orgId, message}'

      # The AI definition, because the Agentforce cover letter code and its prompt template do not
      # deploy to an org without the generative AI features.
      - name: Create Scratch Org
        id: create_org
        run: |
          echo "CREATE_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
          set +e
          sf org create scratch --target-dev-hub portfolio --definition-file config/project-scratch-def-ai.json --alias ci-org --duration-days 1 --set-default --no-ancestors --wait 30 --json > scratch_info.json
          EXIT_CODE=$?
          set -e
          echo "CREATE_FINISHED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

          ORG_ID=$(jq -r '.result.orgId // empty' scratch_info.json 2>/dev/null || true)
          if [ $EXIT_CODE -eq 0 ] && [ -n "$ORG_ID" ]; then
             echo "Scratch Org created: $ORG_ID"
             echo "SCRATCH_ORG_ID=$ORG_ID" >> $GITHUB_ENV
             echo "ORG_TYPE=scratch" >> $GITHUB_ENV
          else
             echo "Scratch Org creation failed (exit $EXIT_CODE). Switching to Fallback Mode."
             jq -r '"  \(.name // "UnknownError"): \(.message // "no message")"' scratch_info.json 2>/dev/null || head -c 2000 scratch_info.json
             echo "ORG_TYPE=fallback" >> $GITHUB_ENV
          fi

      - name: Deploy & Test (Scratch Mode - FULL)
        if: env.ORG_TYPE == 'scratch'
        run: |
          # An org from the AI definition creates its own sfdc_aiplanner_service_permset at signup,
          # which source tracking reports as a conflict with ours. The org is thrown away after this
          # run, so the source version simply wins.
          sf project deploy start --source-dir packages --target-org ci-org --ignore-conflicts --wait 30

          # Production's site guest already holds Portfolio_Guest. Give the scratch guest the same,
          # so guest test classes running in parallel never race to assign it themselves.
          GUEST_ID=$(sf data query --target-org ci-org --query "SELECT GuestUserId FROM Site WHERE Name = 'Portfolio1'" --json | jq -r '.result.records[0].GuestUserId // empty')
          GUEST_USERNAME=$(sf data query --target-org ci-org --query "SELECT Username FROM User WHERE Id = '$GUEST_ID'" --json | jq -r '.result.records[0].Username // empty')
          if [ -z "$GUEST_USERNAME" ]; then
            echo "No guest user found for the Portfolio1 site."
            exit 1
          fi
          sf org assign permset --name Portfolio_Guest --on-behalf-of "$GUEST_USERNAME" --target-org ci-org --json | jq '{status, successes: .result.successes, failures: .result.failures}'

          # The gate fails the PR on any failed test or org wide coverage under 90%.
          sf apex run test --target-org ci-org --test-level RunLocalTests --code-coverage --wait 30 --json > apex-tests.json || true
          node scripts/coverage-gate.js --file apex-tests.json --min 90

      # Validates the PR's delta against production, check only, with the local tests, signed
      # in as the same user the fallback step below uses. A component or a test that fails
      # only in production then stops the PR before the merge. It deploys nothing. In fallback
      # mode the fallback step already runs this check, so this step runs in scratch mode only.
      - name: Validate Delta Against Production (Check Only)
        id: prod_validate
        if: env.ORG_TYPE == 'scratch'
        run: |
          mkdir -p prod-delta
          sf sgd source delta --to "HEAD" --from "origin/${{ github.base_ref }}" --output-dir prod-delta --source-dir packages --generate-delta --ignore .forceignore

          DESTRUCTIVE=()
          if [ -s prod-delta/destructiveChanges/destructiveChanges.xml ] && grep -q "<types>" prod-delta/destructiveChanges/destructiveChanges.xml; then
             DESTRUCTIVE=(--post-destructive-changes prod-delta/destructiveChanges/destructiveChanges.xml)
          fi
          if ! grep -q "<types>" prod-delta/package/package.xml && [ ${#DESTRUCTIVE[@]} -eq 0 ]; then
             echo "No metadata changes against production. Nothing to validate."
             echo "**Production check only validation**: no metadata changes" >> $GITHUB_STEP_SUMMARY
             exit 0
          fi

          set +e
          sf project deploy start --target-org portfolio --manifest prod-delta/package/package.xml "${DESTRUCTIVE[@]}" --dry-run --test-level RunLocalTests --wait 60 --json > prod-validate.json
          set -e

          # The CLI can lose track of a deploy that is still running, for example when Salesforce
          # answers a status poll with QUERY_TIMEOUT. The result then has no final status but the
          # deploy goes on, so read it again by its id before calling it a failure.
          DEPLOY_ID=$(jq -r '(.result // .data // {}).id // empty' prod-validate.json)
          STATUS=$(jq -r '(.result // .data // {}).status // "Unknown"' prod-validate.json)
          for ATTEMPT in 1 2 3; do
            case "$STATUS" in Succeeded|Failed|Canceled|SucceededPartial) break ;; esac
            [ -z "$DEPLOY_ID" ] && break
            jq -r '.message // empty' prod-validate.json
            echo "Deploy $DEPLOY_ID has no final status ($STATUS). Reading it again by id, attempt $ATTEMPT of 3."
            sleep 30
            set +e
            sf project deploy report --job-id "$DEPLOY_ID" --target-org portfolio --wait 60 --json > prod-validate.json
            set -e
            STATUS=$(jq -r '(.result // .data // {}).status // "Unknown"' prod-validate.json)
          done

          STATUS=$(jq -r '(.result // .data // {}).status // "Unknown"' prod-validate.json)
          CHECK_ONLY=$(jq -r '(.result // .data // {}).checkOnly // "unknown"' prod-validate.json)
          echo "Production check only validation: status $STATUS, checkOnly $CHECK_ONLY, id $(jq -r '(.result // .data // {}).id // "none"' prod-validate.json)"
          jq -r '[(.result // .data // {}).details.componentFailures] | flatten | map(select(. != null)) | .[] | "component failure: \(.componentType) \(.fullName): \(.problem)"' prod-validate.json
          jq -r '[(.result // .data // {}).details.runTestResult.failures] | flatten | map(select(. != null)) | .[] | "test failure: \(.name).\(.methodName): \(.message)"' prod-validate.json
          echo "Tests run: $(jq -r '(.result // .data // {}).numberTestsCompleted // 0' prod-validate.json), failed: $(jq -r '(.result // .data // {}).numberTestErrors // 0' prod-validate.json)"
          echo "**Production check only validation**: $STATUS" >> $GITHUB_STEP_SUMMARY

          if [ "$STATUS" != "Succeeded" ]; then
             jq -r '.message // empty' prod-validate.json
             echo "::error::The PR's delta does not validate against production."
             exit 1
          fi

      # Shadow mode for GlassOps, the governance CLI I am building to deploy this site later.
      # After the check above has run, pass or fail, GlassOps plans and validates the same delta
      # against production, check only, and the two results are compared by component and test
      # name. Built from a pinned commit, never a branch or tag. It never blocks the PR. The check
      # after it does, if anything other than a check only deploy reached production.
      - name: Checkout GlassOps (Shadow)
        id: glassops_src
        if: ${{ !cancelled() && env.ORG_TYPE == 'scratch' && (steps.prod_validate.outcome == 'success' || steps.prod_validate.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: glassops-platform/glassops
          ref: 20459158b4f16da4cddc816ac7c1d695177af196
          path: glassops-src
          persist-credentials: false

      # The container runs as root, so .glassops/ is root owned. Later steps read it and never
      # write into it.
      - name: GlassOps Shadow Validate (Non Blocking)
        id: glassops_shadow
        if: ${{ !cancelled() && steps.glassops_src.outcome == 'success' }}
        continue-on-error: true
        env:
          SFDX_JWT_KEY: ${{ secrets.SFDX_JWT_KEY }}
          SFDX_CLIENT_ID: ${{ secrets.SFDX_CLIENT_ID }}
          SFDX_USERNAME: ${{ secrets.SFDX_USERNAME }}
          SF_PORTFOLIO_ORG_ID: ${{ secrets.SF_PORTFOLIO_ORG_ID }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # The guard's expected org Id comes from a secret, never from a login result, or the
          # guard would compare the org with itself.
          if [ -z "$SF_PORTFOLIO_ORG_ID" ]; then
             echo "::warning::The SF_PORTFOLIO_ORG_ID secret is not set. The GlassOps shadow run is skipped."
             exit 0
          fi
          docker build -q -t glassops:shadow glassops-src > /dev/null

          # Quoted, so the runner leaves the names alone. GlassOps reads them from its own environment.
          cat > "$RUNNER_TEMP/glassops-shadow.yaml" <<'EOF'
          version: 1
          provider: salesforce
          targets:
            prod:
              id: $SF_PORTFOLIO_ORG_ID
              tier: prod
              auth: { method: jwt, username: $SFDX_USERNAME, client_id: $SFDX_CLIENT_ID, key: $SFDX_JWT_KEY }
          salesforce:
            test_level: { prod: RunLocalTests }
          EOF

          # Bounds the window the blocking check below searches for a real deploy.
          echo "GLASSOPS_SHADOW_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          G=(docker run --rm -e SFDX_JWT_KEY -e SFDX_CLIENT_ID -e SFDX_USERNAME -e SF_PORTFOLIO_ORG_ID
             -v "$GITHUB_WORKSPACE:/work" -v "$RUNNER_TEMP/glassops-shadow.yaml:/cfg/glassops.yaml:ro" -w /work glassops:shadow)
          set +e
          "${G[@]}" plan --config /cfg/glassops.yaml --from "origin/$BASE_REF" --to HEAD --ci local
          PLAN_EXIT=$?
          VALIDATE_EXIT=none
          if [ $PLAN_EXIT -eq 0 ]; then
             "${G[@]}" validate --target prod --config /cfg/glassops.yaml --ci local
             VALIDATE_EXIT=$?
          fi
          set -e
          echo "GLASSOPS_SHADOW_END=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

          # Exit 0 is a pass, 1 a validate that ran and failed, 2 a tool, login, guard or check only error.
          if [ $PLAN_EXIT -ne 0 ] || [ "$VALIDATE_EXIT" = "2" ] || [ ! -f .glassops/results/validate.json ]; then
             echo "::warning::GlassOps did not finish: plan exit $PLAN_EXIT, validate exit $VALIDATE_EXIT."
             echo "**GlassOps shadow validate**: did not finish (plan exit $PLAN_EXIT, validate exit $VALIDATE_EXIT)" >> $GITHUB_STEP_SUMMARY
             exit 1
          fi
          THEIRS=$(jq -r '.status' .glassops/results/validate.json)

          # The check above reads the failures from its own deploy start body, which can hold only
          # the deploy Id when it fails. Deploy report gives the full details for the comparison.
          OUR_ID=$(jq -r '(.result // .data // {}) | (.id // .deployId // empty)' prod-validate.json 2>/dev/null || true)
          OURS=empty
          : > ours.txt
          if [ -n "$OUR_ID" ]; then
             sf project deploy report --job-id "$OUR_ID" --target-org portfolio --json > prod-report.json || true
             case "$(jq -r '(.result // .data // {}).status // empty' prod-report.json)" in
                Succeeded) OURS=pass ;;
                Failed) OURS=fail ;;
                *) OURS=error ;;
             esac
             jq -r '(.result // .data // {}).details as $d
               | ([$d.componentFailures] | flatten | map(select(. != null)) | .[] | "\(.componentType) \(.fullName)"),
                 ([$d.runTestResult.failures] | flatten | map(select(. != null)) | .[] | "\(.name).\(.methodName)")' prod-report.json | sort -u > ours.txt
          fi
          jq -r '.checks[]? | select(.name | startswith("problem.")) | .detail // "" | select(contains(": ")) | split(": ")[0]' .glassops/results/validate.json | sort -u > theirs.txt

          ONLY_OURS=$(comm -23 ours.txt theirs.txt)
          ONLY_THEIRS=$(comm -13 ours.txt theirs.txt)
          echo "Check above: $OURS. GlassOps: $THEIRS, deploy $(jq -r '.facts["salesforce.deploy_id"] // "none"' .glassops/results/validate.json), tests $(jq -r '.facts["salesforce.tests_total"] // 0' .glassops/results/validate.json), failed $(jq -r '.facts["salesforce.tests_failed"] // 0' .glassops/results/validate.json)."
          [ -n "$ONLY_OURS" ] && echo "Failed only in the check above:" && echo "$ONLY_OURS"
          [ -n "$ONLY_THEIRS" ] && echo "Failed only in GlassOps:" && echo "$ONLY_THEIRS"
          if [ "$OURS" = "$THEIRS" ] && [ -z "$ONLY_OURS" ] && [ -z "$ONLY_THEIRS" ]; then
             echo "**GlassOps shadow validate**: $THEIRS, matches the check above" >> $GITHUB_STEP_SUMMARY
          else
             echo "::warning::GlassOps and the check above disagree. See this step's log."
             echo "**GlassOps shadow validate**: $THEIRS, the check above was $OURS. They disagree" >> $GITHUB_STEP_SUMMARY
             exit 1
          fi

      # Blocking. Fails the PR if any deploy to production that is not check only started while
      # GlassOps ran, under any Id, including one GlassOps never reported. deploy.yml signs in as
      # the same user, so a merge to main that deploys inside the window trips this too. Read the
      # listed Id in Setup, Deployment Status, before you rerun.
      - name: Check GlassOps Deployed Nothing
        if: ${{ always() && env.GLASSOPS_SHADOW_START != '' }}
        run: |
          END=${GLASSOPS_SHADOW_END:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
          # A busy org can time the query out, so try it three times before giving up.
          for ATTEMPT in 1 2 3; do
            sf data query --use-tooling-api --target-org portfolio --json \
              --query "SELECT Id, Status, CreatedDate FROM DeployRequest WHERE CheckOnly = false AND CreatedDate >= $GLASSOPS_SHADOW_START AND CreatedDate <= $END" > shadow-deploys.json || true
            COUNT=$(jq -r '.result.totalSize // empty' shadow-deploys.json)
            [ -n "$COUNT" ] && break
            echo "DeployRequest could not be read, attempt $ATTEMPT of 3."
            sleep 30
          done
          COUNT=$(jq -r '.result.totalSize // empty' shadow-deploys.json)
          if [ -z "$COUNT" ]; then
             jq -r '.message // empty' shadow-deploys.json
             echo "::error::Could not read DeployRequest, so a real deploy by GlassOps cannot be ruled out."
             exit 1
          fi
          if [ "$COUNT" != "0" ]; then
             jq -r '.result.records[] | "real deploy: \(.Id) \(.Status) \(.CreatedDate)"' shadow-deploys.json
             echo "::error::A deploy that was not check only reached production while GlassOps ran."
             exit 1
          fi

          GID=$(jq -r '.facts["salesforce.deploy_id"] // empty' .glassops/results/validate.json 2>/dev/null || true)
          if [ -n "$GID" ]; then
             if ! [[ "$GID" =~ ^0Af[A-Za-z0-9]{12,15}$ ]]; then
                echo "::error::GlassOps reported a deploy Id that is not a DeployRequest Id: $GID"
                exit 1
             fi
             CHECK_ONLY=$(sf data query --use-tooling-api --target-org portfolio --json --query "SELECT CheckOnly FROM DeployRequest WHERE Id = '$GID'" | jq -r '.result.records[0].CheckOnly // empty')
             if [ "$CHECK_ONLY" != "true" ]; then
                echo "::error::GlassOps deploy $GID is not check only in production (CheckOnly '$CHECK_ONLY')."
                exit 1
             fi
          fi
          echo "Production shows no real deploy from $GLASSOPS_SHADOW_START to $END. GlassOps deploy ${GID:-none} is check only."

      - name: Deploy & Test (Fallback Mode - DELTA)
        if: env.ORG_TYPE == 'fallback'
        run: |
          mkdir -p changed
          sf sgd source delta --to "HEAD" --from "origin/${{ github.base_ref }}" --output changed --source packages --generate-delta --ignore .forceignore

          if [ -s changed/package/package.xml ] && grep -q "<types>" changed/package/package.xml; then
             echo "Validating Delta changes against Production..."
             sf project deploy start --target-org portfolio --manifest changed/package/package.xml --dry-run --test-level RunLocalTests --wait 30
          else
             echo "No metadata changes detected. Skipping validation."
          fi

      - name: Provide Instant Access (If Label Applied)
        if: env.ORG_TYPE == 'scratch' && contains(github.event.pull_request.labels.*.name, 'debug:keep-org')
        run: |
          cat scratch_info.json | jq -r .result.authFields.sfdxAuthUrl > auth_url.txt
          AUTH_URL=$(cat auth_url.txt)

          echo "### UAT Environment Ready" >> $GITHUB_STEP_SUMMARY
          echo "> **Status:** Org preserved for 24 hours." >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "echo '${AUTH_URL}' > uat_auth.txt" >> $GITHUB_STEP_SUMMARY
          echo "sf org login sfdx-url -f uat_auth.txt --set-alias pr-${{ github.event.number }}-uat" >> $GITHUB_STEP_SUMMARY
          echo "sf org open -o pr-${{ github.event.number }}-uat" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      # Runs whenever a create was attempted, so a signup whose create command failed
      # afterwards is still removed. Without an org Id from the CLI, the org is found on
      # the Dev Hub: a 1 day Active signup created while this job's create was running.
      - name: Delete Scratch Org
        if: always() && env.CREATE_STARTED != '' && !contains(github.event.pull_request.labels.*.name, 'debug:keep-org')
        run: |
          if [ -n "$SCRATCH_ORG_ID" ] && sf org delete scratch --target-org ci-org --no-prompt; then
             exit 0
          fi

          WINDOW_END=${CREATE_FINISHED:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
          ORPHANS=$(sf data query --target-org portfolio --json \
            --query "SELECT ScratchOrg FROM ScratchOrgInfo WHERE CreatedDate >= $CREATE_STARTED AND CreatedDate <= $WINDOW_END AND DurationDays = 1 AND Status = 'Active'" \
            | jq -r '.result.records[].ScratchOrg // empty')
          if [ -z "$ORPHANS" ]; then
             echo "No scratch org from this run is left on the Dev Hub."
             exit 0
          fi
          for ORG in $ORPHANS; do
             echo "Deleting scratch org $ORG through the Dev Hub."
             sf data delete record --target-org portfolio --sobject ActiveScratchOrg --where "ScratchOrg='$ORG'" \
               || echo "::warning::Could not delete scratch org $ORG. It expires in 1 day."
          done

      - name: Remove Dev Hub Key
        if: always()
        run: rm -f "$RUNNER_TEMP/devhub.key"

  pr-status:
    if: always()
    needs: [quality-check, scratch-org-test]
    runs-on: ubuntu-latest
    steps:
      - name: Generate PR Summary
        run: |
          echo "## PR Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          FAILED=false

          if [ "${{ needs.quality-check.result }}" = "success" ]; then
             echo "**Quality Gates**: Passed" >> $GITHUB_STEP_SUMMARY
          else
             echo "**Quality Gates**: Failed" >> $GITHUB_STEP_SUMMARY
             FAILED=true
          fi

          if [ "${{ needs.scratch-org-test.result }}" = "success" ]; then
             echo "**Scratch Org Deployment**: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.scratch-org-test.result }}" = "skipped" ]; then
             echo "**Scratch Org Deployment**: Skipped" >> $GITHUB_STEP_SUMMARY
          else
             echo "**Scratch Org Deployment**: Failed" >> $GITHUB_STEP_SUMMARY
             FAILED=true
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$FAILED" = true ]; then
             exit 1
          fi
