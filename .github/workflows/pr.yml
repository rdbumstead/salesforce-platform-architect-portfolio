name: Validate PR (Scratch Org)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
    paths:
      - "packages/**"
      - "sfdx-project.json"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/pr.yml"
      - ".github/glassops/pr.yaml"
      - ".github/glassops/scratch.yaml"

# One validation run per PR at a time. A new push cancels the run still going, so quick
# pushes never hold every scratch org slot at once. A label event runs no tests, so it has
# its own group and never cancels a real run.
concurrency:
  group: pr-${{ github.event.pull_request.number }}-${{ github.event.action == 'labeled' && 'label' || 'run' }}
  cancel-in-progress: true

# The GitHub token only reads the repository. Validation uses the Salesforce secrets.
permissions:
  contents: read

env:
  # GlassOps v1.0.2, pinned by digest and never by tag. The same image as deploy.yml.
  GLASSOPS_IMAGE: ghcr.io/glassops-platform/glassops@sha256:c13ed90912405491d5ed86a4bd3616fc659d7e46a92c043bc2bfcfe028907393
  GLASSOPS_CONFIG: .github/glassops/pr.yaml

jobs:
  quality-check:
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment & Scanner
        uses: rdbumstead/setup-salesforce-action@v2
        with:
          node_version: "26"
          skip_auth: "true"
          install_scanner: "true"

      - name: Install Dependencies
        run: npm ci

      - name: Run Quality Gates
        run: |
          npm run scan:secrets
          npm run test:unit
          node --test scripts/count-test-groups.test.js
          node scripts/count-test-groups.js --check
          npm run docs:verify

      # The API budget scripts keep a reserve of production's daily API requests for the
      # public site. Their tests run here so a change to them cannot reach main untested.
      - name: API Budget Scripts
        run: |
          node --test scripts/api-reserve.test.js
          node --test scripts/export-needs-production.test.js

      # Fails the PR when a comment, description or help text under packages/, or a line of
      # the docs, README.md or STATUS.md, names an internal planning reference. The script
      # skips the generated API pages in docs/api/oas. The gate's own tests run first.
      - name: Check Internal References
        run: |
          node --test scripts/check-internal-refs.test.js
          node scripts/check-internal-refs.js packages docs README.md STATUS.md

      # Fails the PR when the guides, ADRs, README.md or STATUS.md use a build status word other
      # than Live, In progress and Designed, or an ADR has no Decision and Build lines. The
      # generated API pages in docs/api are not read. The gate's own tests run first.
      - name: Check Build Status Words
        run: |
          node --test scripts/check-build-status.test.js
          node scripts/check-build-status.js

      # Fails the PR when the live smoke test's route list no longer matches the site: a
      # component the smoke expects that its page no longer places, or a page it skips.
      # Reads files only, so it needs no browser and no org.
      - name: Check Smoke Routes
        run: |
          node --test scripts/check-smoke-routes.test.js
          node scripts/check-smoke-routes.js

      # The API Lab's Postman collection is generated from the PAPI spec. A spec change that did
      # not regenerate it fails the PR. The converter is the pinned dev dependency npm ci already
      # installed. The probe sends the deploy's exact request body to Postman with a key that
      # cannot be valid, so a body Postman's firewall would refuse fails here instead of after
      # the merge.
      - name: Postman Collection Is Current
        run: |
          node --test scripts/build-postman-collection.test.js
          node scripts/build-postman-collection.js --check
          node scripts/postman-sync.js probe

      # Draws every Mermaid block in the docs as a light and a dark SVG, the same way the deploy
      # does, so a diagram that will not render fails the PR. Its tests fail the PR when a block
      # has no alt sentence. The CLI is installed outside package.json and uses the runner's Chrome.
      - name: Render Mermaid Diagrams
        run: |
          node --test scripts/render-mermaid.test.js
          PUPPETEER_SKIP_DOWNLOAD=1 npm install --prefix "$RUNNER_TEMP/mmd" --no-save --no-audit --no-fund @mermaid-js/mermaid-cli@12.0.0 puppeteer@25.16.0
          MERMAID_CLI_DIR="$RUNNER_TEMP/mmd" PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome)" node scripts/render-mermaid.js

      - name: Run Salesforce Code Analyzer
        run: |
          npm run scan

      # Warns, and never fails, on a tracked source file over 1,000 lines. Each one shows as a
      # warning on the PR. Generated, vendored and data files are skipped. The script's own test
      # runs first.
      - name: Long File Warning
        run: |
          node --test scripts/check-file-length.test.js
          node scripts/check-file-length.js

  scratch-org-test:
    runs-on: ubuntu-latest
    # The longest recent run took 39 minutes, and the sf waits inside add up to more than an
    # hour, so the cap leaves room for a slow scratch org.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Salesforce & Tools
        uses: rdbumstead/setup-salesforce-action@v2
        with:
          node_version: "26"
          jwt_key: ${{ secrets.SFDX_JWT_KEY }}
          client_id: ${{ secrets.SFDX_CLIENT_ID }}
          username: ${{ secrets.SFDX_USERNAME }}
          is_dev_hub: "true"
          install_delta: "true"
          alias: "portfolio"

      # The setup action deletes its JWT key file when its login step ends, but the CLI
      # needs the Dev Hub key again to log in to a new scratch org after signup. Without
      # it the create fails after the org exists. Log in to the Dev Hub again with a key
      # file that lives until the last step of this job.
      - name: Restore Dev Hub Key
        env:
          SFDX_JWT_KEY: ${{ secrets.SFDX_JWT_KEY }}
          SFDX_CLIENT_ID: ${{ secrets.SFDX_CLIENT_ID }}
          SFDX_USERNAME: ${{ secrets.SFDX_USERNAME }}
        run: |
          KEY_FILE="$RUNNER_TEMP/devhub.key"
          printf '%s\n' "$SFDX_JWT_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          sf org login jwt --client-id "$SFDX_CLIENT_ID" --jwt-key-file "$KEY_FILE" --username "$SFDX_USERNAME" --instance-url https://login.salesforce.com --alias portfolio --set-default-dev-hub --json \
            | jq '{status, orgId: .result.orgId, message}'

      # The AI definition, because the Agentforce cover letter code and its prompt template do not
      # deploy to an org without the generative AI features.
      # Production is the Dev Hub and serves the public site. Stop before creating a scratch org
      # when less than 40% of its daily API requests are left or no scratch org is left today,
      # so the public site keeps the rest. Rerun the check once requests free up.
      - name: Check the API Reserve
        run: node scripts/api-reserve.js --target-org portfolio --need-scratch-org --label "PR validation"

      - name: Create Scratch Org
        id: create_org
        run: |
          echo "CREATE_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
          set +e
          sf org create scratch --target-dev-hub portfolio --definition-file config/project-scratch-def-ai.json --alias ci-org --duration-days 1 --set-default --no-ancestors --wait 30 --json > scratch_info.json
          EXIT_CODE=$?
          set -e
          echo "CREATE_FINISHED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

          ORG_ID=$(jq -r '.result.orgId // empty' scratch_info.json 2>/dev/null || true)
          if [ $EXIT_CODE -eq 0 ] && [ -n "$ORG_ID" ]; then
             echo "Scratch Org created: $ORG_ID"
             echo "SCRATCH_ORG_ID=$ORG_ID" >> $GITHUB_ENV
             echo "ORG_TYPE=scratch" >> $GITHUB_ENV
          else
             echo "Scratch Org creation failed (exit $EXIT_CODE). Switching to Fallback Mode."
             jq -r '"  \(.name // "UnknownError"): \(.message // "no message")"' scratch_info.json 2>/dev/null || head -c 2000 scratch_info.json
             echo "ORG_TYPE=fallback" >> $GITHUB_ENV
          fi

      - name: Deploy & Test (Scratch Mode - FULL)
        if: env.ORG_TYPE == 'scratch'
        run: |
          # An org from the AI definition creates its own sfdc_aiplanner_service_permset at signup,
          # which source tracking reports as a conflict with ours. The org is thrown away after this
          # run, so the source version simply wins.
          sf project deploy start --source-dir packages --target-org ci-org --ignore-conflicts --wait 30

          # Production's site guest already holds Portfolio_Guest. Give the scratch guest the same,
          # so guest test classes running in parallel never race to assign it themselves.
          GUEST_ID=$(sf data query --target-org ci-org --query "SELECT GuestUserId FROM Site WHERE Name = 'Portfolio1'" --json | jq -r '.result.records[0].GuestUserId // empty')
          GUEST_USERNAME=$(sf data query --target-org ci-org --query "SELECT Username FROM User WHERE Id = '$GUEST_ID'" --json | jq -r '.result.records[0].Username // empty')
          if [ -z "$GUEST_USERNAME" ]; then
            echo "No guest user found for the Portfolio1 site."
            exit 1
          fi
          sf org assign permset --name Portfolio_Guest --on-behalf-of "$GUEST_USERNAME" --target-org ci-org --json | jq '{status, successes: .result.successes, failures: .result.failures}'

          # The gate fails the PR on any failed test or org wide coverage under 90%.
          sf apex run test --target-org ci-org --test-level RunLocalTests --code-coverage --wait 30 --json > apex-tests.json || true
          node scripts/coverage-gate.js --file apex-tests.json --min 90

      # Validates the PR's delta against production, check only, through GlassOps, the tool that
      # makes the production deploy after the merge (ADR-044). It plans the delta against
      # origin/<base> and validates it with the relevant tests (RunRelevantTests, a beta test
      # level, set in .github/glassops/pr.yaml), the ones Salesforce picks from the delta and
      # what depends on it. That takes two to three minutes where every local test took about
      # ten. Each changed class and trigger must still reach 75% coverage from those tests. The
      # scratch job above still runs every local test on every PR, and the deploy runs them all
      # again after the merge, so a test outside the relevant set is still caught. A component,
      # or a relevant test, that fails only in production stops the PR before the merge.
      # GlassOps validates check only by construction and exits 2 if production reports anything
      # else. There is no gate here, so no PERMIT and no PERMIT key. In fallback mode the
      # fallback step runs this check with every local test, because there it is the only test
      # run the PR gets, so this step runs in scratch mode only. The container runs as root, so
      # .glassops/ is root owned. Later steps never write to it.
      - name: Validate Delta Against Production (GlassOps, Check Only)
        id: prod_validate
        if: env.ORG_TYPE == 'scratch'
        env:
          SFDX_JWT_KEY: ${{ secrets.SFDX_JWT_KEY }}
          SFDX_CLIENT_ID: ${{ secrets.SFDX_CLIENT_ID }}
          SFDX_USERNAME: ${{ secrets.SFDX_USERNAME }}
          SF_PORTFOLIO_ORG_ID: ${{ secrets.SF_PORTFOLIO_ORG_ID }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # The guard's expected org Id comes from a secret, never from a login result, or the
          # guard would compare the org with itself.
          if [ -z "$SF_PORTFOLIO_ORG_ID" ]; then
             echo "::error::The SF_PORTFOLIO_ORG_ID secret is not set, so GlassOps cannot check that it reached production."
             exit 1
          fi
          G=(docker run --rm -e SFDX_JWT_KEY -e SFDX_CLIENT_ID -e SFDX_USERNAME -e SF_PORTFOLIO_ORG_ID
             -v "$GITHUB_WORKSPACE:/work" -w /work "$GLASSOPS_IMAGE")

          set +e
          "${G[@]}" plan --config "$GLASSOPS_CONFIG" --from "origin/$BASE_REF" --to HEAD --ci local
          PLAN_EXIT=$?
          VALIDATE_EXIT=none
          if [ $PLAN_EXIT -eq 0 ]; then
             "${G[@]}" validate --target prod --config "$GLASSOPS_CONFIG" --ci local
             VALIDATE_EXIT=$?
          fi
          "${G[@]}" report --config "$GLASSOPS_CONFIG" --ci local --summary .glassops/summary.md > /dev/null
          set -e
          [ -f .glassops/summary.md ] && cat .glassops/summary.md >> $GITHUB_STEP_SUMMARY

          if [ $PLAN_EXIT -ne 0 ] || [ ! -f .glassops/results/validate.json ]; then
             echo "::error::GlassOps did not finish: plan exit $PLAN_EXIT, validate exit $VALIDATE_EXIT."
             exit 1
          fi
          STATUS=$(jq -r '.status' .glassops/results/validate.json)
          if [ "$STATUS" = "empty" ]; then
             echo "No metadata changes against production. Nothing to validate."
             echo "**Production check only validation**: no metadata changes" >> $GITHUB_STEP_SUMMARY
             exit 0
          fi
          jq -r '"Production check only validation: status \(.status), deploy \(.facts["salesforce.deploy_id"] // "none"), test level \(.facts["validate.test_level"] // "default"), tests \(.facts["salesforce.tests_total"] // 0), failed \(.facts["salesforce.tests_failed"] // 0)"' .glassops/results/validate.json
          jq -r '.checks[]? | select(.name | startswith("problem.")) | "problem: \(.detail // "")"' .glassops/results/validate.json
          echo "**Production check only validation**: $STATUS" >> $GITHUB_STEP_SUMMARY

          # Exit 0 is a pass, 1 a validate that ran and failed, 2 a tool, login, guard or check only error.
          if [ "$VALIDATE_EXIT" != "0" ]; then
             echo "::error::The PR's delta does not validate against production (GlassOps exit $VALIDATE_EXIT)."
             exit 1
          fi

      - name: Deploy & Test (Fallback Mode - DELTA)
        if: env.ORG_TYPE == 'fallback'
        run: |
          mkdir -p changed
          sf sgd source delta --to "HEAD" --from "origin/${{ github.base_ref }}" --output changed --source packages --generate-delta --ignore .forceignore

          if [ -s changed/package/package.xml ] && grep -q "<types>" changed/package/package.xml; then
             echo "Validating Delta changes against Production..."
             sf project deploy start --target-org portfolio --manifest changed/package/package.xml --dry-run --test-level RunLocalTests --wait 30
          else
             echo "No metadata changes detected. Skipping validation."
          fi

      - name: Provide Instant Access (If Label Applied)
        if: env.ORG_TYPE == 'scratch' && contains(github.event.pull_request.labels.*.name, 'debug:keep-org')
        run: |
          cat scratch_info.json | jq -r .result.authFields.sfdxAuthUrl > auth_url.txt
          AUTH_URL=$(cat auth_url.txt)

          echo "### UAT Environment Ready" >> $GITHUB_STEP_SUMMARY
          echo "> **Status:** Org preserved for 24 hours." >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "echo '${AUTH_URL}' > uat_auth.txt" >> $GITHUB_STEP_SUMMARY
          echo "sf org login sfdx-url -f uat_auth.txt --set-alias pr-${{ github.event.number }}-uat" >> $GITHUB_STEP_SUMMARY
          echo "sf org open -o pr-${{ github.event.number }}-uat" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      # Runs whenever a create was attempted, so a signup whose create command failed
      # afterwards is still removed. Without an org Id from the CLI, the org is found on
      # the Dev Hub: a 1 day Active signup created while this job's create was running.
      - name: Delete Scratch Org
        if: always() && env.CREATE_STARTED != '' && !contains(github.event.pull_request.labels.*.name, 'debug:keep-org')
        run: |
          if [ -n "$SCRATCH_ORG_ID" ] && sf org delete scratch --target-org ci-org --no-prompt; then
             exit 0
          fi

          WINDOW_END=${CREATE_FINISHED:-$(date -u +%Y-%m-%dT%H:%M:%SZ)}
          ORPHANS=$(sf data query --target-org portfolio --json \
            --query "SELECT ScratchOrg FROM ScratchOrgInfo WHERE CreatedDate >= $CREATE_STARTED AND CreatedDate <= $WINDOW_END AND DurationDays = 1 AND Status = 'Active'" \
            | jq -r '.result.records[].ScratchOrg // empty')
          if [ -z "$ORPHANS" ]; then
             echo "No scratch org from this run is left on the Dev Hub."
             exit 0
          fi
          for ORG in $ORPHANS; do
             echo "Deleting scratch org $ORG through the Dev Hub."
             sf data delete record --target-org portfolio --sobject ActiveScratchOrg --where "ScratchOrg='$ORG'" \
               || echo "::warning::Could not delete scratch org $ORG. It expires in 1 day."
          done

      - name: Remove Dev Hub Key
        if: always()
        run: rm -f "$RUNNER_TEMP/devhub.key"

  # A trial of GlassOps 1.2.0-rc.1 beside scratch-org-test, on pull requests labelled
  # glassops:shadow only. Each run creates a scratch org from the Dev Hub, which is production
  # and allows 6 a day and 3 at once, so it runs only where the owner asks for the comparison.
  # It validates the whole source check only with every local test, prints one line to compare
  # with scratch-org-test, and deletes its org. It never blocks the PR: continue-on-error, and
  # pr-status does not wait for it. The production check and deploy.yml stay on v1.0.2.
  glassops-scratch-shadow:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'glassops:shadow') &&
      (github.event.action != 'labeled' || github.event.label.name == 'glassops:shadow')
    runs-on: ubuntu-latest
    continue-on-error: true
    # env create polls for up to 15 minutes and the validate took 545 s in the trial run.
    timeout-minutes: 60
    concurrency:
      group: glassops-shadow-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      SHADOW_IMAGE: ghcr.io/glassops-platform/glassops@sha256:7aedc3e910c101c2627331cb9ae9532d6232b1277983d6f789143415d1d7e8b9
      SHADOW_CONFIG: .github/glassops/scratch.yaml
    steps:
      - uses: actions/checkout@v4

      - name: Setup Salesforce & Tools
        uses: rdbumstead/setup-salesforce-action@v2
        with:
          node_version: "26"
          jwt_key: ${{ secrets.SFDX_JWT_KEY }}
          client_id: ${{ secrets.SFDX_CLIENT_ID }}
          username: ${{ secrets.SFDX_USERNAME }}
          is_dev_hub: "true"
          alias: "portfolio"

      # The same reserve check as scratch-org-test, so the shadow never takes the public site's
      # share of production's API requests or the last scratch org of the day.
      - name: Check the API Reserve
        run: node scripts/api-reserve.js --target-org portfolio --need-scratch-org --label "GlassOps shadow"

      # One container runs the whole pipeline, so the scratch login that env create writes to the
      # container's temp folder is there for validate and env delete. run exits with the worst
      # step's code.
      - name: GlassOps Shadow (Scratch Org, Check Only)
        env:
          SFDX_JWT_KEY: ${{ secrets.SFDX_JWT_KEY }}
          SFDX_CLIENT_ID: ${{ secrets.SFDX_CLIENT_ID }}
          SFDX_USERNAME: ${{ secrets.SFDX_USERNAME }}
          SF_PORTFOLIO_ORG_ID: ${{ secrets.SF_PORTFOLIO_ORG_ID }}
        run: |
          STARTED=$(date +%s)
          set +e
          docker run --rm -e SF_PORTFOLIO_ORG_ID -e SFDX_USERNAME -e SFDX_CLIENT_ID -e SFDX_JWT_KEY \
            -v "$GITHUB_WORKSPACE:/work" -w /work "$SHADOW_IMAGE" \
            run shadow --config "$SHADOW_CONFIG" --ci local
          RUN_EXIT=$?
          set -e
          WALL=$(( $(date +%s) - STARTED ))
          [ -f .glassops/summary.md ] && cat .glassops/summary.md >> $GITHUB_STEP_SUMMARY

          # One line to compare with scratch-org-test.
          if [ -f .glassops/results/validate.json ]; then
             jq -r --arg wall "$WALL" '"GlassOps shadow: status \(.status), tests \(.facts["salesforce.tests_total"] // 0), failed \(.facts["salesforce.tests_failed"] // 0), components \(.facts["salesforce.components_total"] // 0), test level \(.facts["validate.test_level"] // "default"), wall \($wall) s"' .glassops/results/validate.json \
               | tee -a $GITHUB_STEP_SUMMARY
          else
             echo "GlassOps shadow: no validate result, run exit $RUN_EXIT, wall $WALL s" | tee -a $GITHUB_STEP_SUMMARY
          fi
          if [ -f .glassops/results/run.json ]; then
             jq -r '.facts["run.steps"][]? | "step \(.name // .step // .command // "?"): \(.duration // "?")"' .glassops/results/run.json
          fi
          exit $RUN_EXIT

      # A new push cancels this run, which can stop the container before its own env delete.
      # env create writes the org's Id to .glassops/env/ephemeral/env.json in the workspace, so
      # this deletes it through the Dev Hub. Deleting an org that is already gone passes.
      - name: Delete a Leftover Shadow Org
        if: always() && hashFiles('.glassops/env/ephemeral/env.json') != ''
        env:
          SFDX_JWT_KEY: ${{ secrets.SFDX_JWT_KEY }}
          SFDX_CLIENT_ID: ${{ secrets.SFDX_CLIENT_ID }}
          SFDX_USERNAME: ${{ secrets.SFDX_USERNAME }}
          SF_PORTFOLIO_ORG_ID: ${{ secrets.SF_PORTFOLIO_ORG_ID }}
        run: |
          docker run --rm -e SF_PORTFOLIO_ORG_ID -e SFDX_USERNAME -e SFDX_CLIENT_ID -e SFDX_JWT_KEY \
            -v "$GITHUB_WORKSPACE:/work" -w /work "$SHADOW_IMAGE" \
            env delete --config "$SHADOW_CONFIG" --ci local \
            || echo "::warning::Could not delete the shadow scratch org. It expires in 1 day."

  pr-status:
    if: always()
    needs: [quality-check, scratch-org-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate PR Summary
        run: |
          echo "## PR Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          FAILED=false

          if [ "${{ needs.quality-check.result }}" = "success" ]; then
             echo "**Quality Gates**: Passed" >> $GITHUB_STEP_SUMMARY
          else
             echo "**Quality Gates**: Failed" >> $GITHUB_STEP_SUMMARY
             FAILED=true
          fi

          if [ "${{ needs.scratch-org-test.result }}" = "success" ]; then
             echo "**Scratch Org Deployment**: Passed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.scratch-org-test.result }}" = "skipped" ]; then
             echo "**Scratch Org Deployment**: Skipped" >> $GITHUB_STEP_SUMMARY
          else
             echo "**Scratch Org Deployment**: Failed" >> $GITHUB_STEP_SUMMARY
             FAILED=true
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$FAILED" = true ]; then
             exit 1
          fi
