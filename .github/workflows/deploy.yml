name: Deploy to Production

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "sfdx-project.json"
      - "package.json"
      # A docs only push runs the workflow for the docs-cache job. The GlassOps plan finds no
      # metadata, so nothing asks for an approval and nothing is deployed.
      - "docs/**"
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: "Deployment Mode"
        required: true
        default: "delta"
        type: choice
        options: [delta, full, destructive]
      destructive_manifest_dir:
        description: "Destructive mode only: folder under manifest/destructive holding package.xml and destructiveChanges.xml"
        required: false
        default: ""
        type: string
      # There is no timing choice. A delta run deploys through GlassOps, which deletes after it
      # deploys, and destructive mode always deletes after its empty deploy.

# The GitHub token only reads the repository. Deploys use the Salesforce and smoke secrets.
# The glassops job alone may write, to push the deployed tag.
permissions:
  contents: read

# One production deploy at a time. A second push to main waits for the first run to finish
# and is never cancelled, because cancelling a job does not stop a Salesforce deploy it has
# already submitted. The default queue keeps only one pending run and cancels the older one,
# so queue: max keeps them all in order. That order matters, because each GlassOps plan
# starts where the last successful deploy left the deployed tag. A run waiting for its
# approval holds up the runs behind it until it is approved or rejected. GitHub refuses queue
# together with cancel-in-progress, and leaving cancel-in-progress out means false. The group
# name differs from site.yml's, which this workflow calls.
concurrency:
  group: deploy-production
  queue: max

env:
  # v1.0.1, pinned by digest and never by tag. pr.yml uses the same image.
  GLASSOPS_IMAGE: ghcr.io/glassops-platform/glassops@sha256:c90bdfcd36cccd127a979fcf71a1e8996f3879802517b141347b1195d9a6d514
  GLASSOPS_CONFIG: .github/glassops/prod.yaml
  # GlassOps moves this tag to the commit it deployed, only after a deploy succeeds. A failed
  # deploy leaves it where it was, so the next run deploys those changes again.
  GLASSOPS_TAG: glassops/deployed/prod

jobs:
  # Pushes and manual delta runs go through GlassOps. The plan needs no login and no
  # environment, so a push with no metadata change asks for no approval. The full and
  # destructive modes skip GlassOps and run raw sf in the deploy job.
  plan:
    if: github.event_name == 'push' || inputs.deployment_mode == 'delta'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
      from: ${{ steps.plan.outputs.from }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The plan starts at the deployed tag. When the tag is missing, as before the first
      # GlassOps deploy, it starts where main stood before this push, as the raw delta did.
      # The glassops job plans the same range from this job's output.
      - name: GlassOps Plan
        id: plan
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Reads the deployed tag from the remote by name, rather than trusting the checkout to
          # bring tags. GlassOps reads only the local ref.
          git fetch --force --no-tags origin "refs/tags/glassops/deployed/*:refs/tags/glassops/deployed/*"
          if git rev-parse -q --verify "refs/tags/$GLASSOPS_TAG^{commit}" > /dev/null; then
             FROM=tag
             echo "Planning from $GLASSOPS_TAG at $(git rev-parse --short "refs/tags/$GLASSOPS_TAG^{commit}")"
             PLAN=(plan --config "$GLASSOPS_CONFIG" --target prod --ci local)
          else
             FROM="$BEFORE"
             if [ -z "$FROM" ] || [ "$FROM" = "0000000000000000000000000000000000000000" ]; then
                FROM=$(git rev-parse HEAD^1)
             fi
             echo "No $GLASSOPS_TAG tag yet. Planning from $FROM"
             PLAN=(plan --config "$GLASSOPS_CONFIG" --from "$FROM" --to HEAD --ci local)
          fi
          echo "from=$FROM" >> "$GITHUB_OUTPUT"

          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$GLASSOPS_IMAGE" "${PLAN[@]}"
          STATUS=$(jq -r '.status' .glassops/results/plan.json)
          echo "Plan status: $STATUS"
          if [ "$STATUS" = "pass" ]; then
             echo "changes=true" >> "$GITHUB_OUTPUT"
          else
             echo "changes=false" >> "$GITHUB_OUTPUT"
             echo "**GlassOps**: no metadata changes, nothing to deploy" >> $GITHUB_STEP_SUMMARY
          fi

  # Validates, gates and deploys the plan. The PERMIT key lives only in the glassops-deploy
  # environment, so this job waits for an approval there, and that approval is the separation
  # of duties evidence the gate reads. The gate signs a PERMIT, and deploy refuses to run
  # without one that matches this commit, this plan and this config.
  glassops:
    needs: [plan]
    if: needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    # The validate waits up to 60 minutes, and a deploy that cannot quick deploy falls back to a
    # full deploy that runs every local test again and also waits up to 60.
    timeout-minutes: 140
    environment: glassops-deploy
    # contents pushes the deployed tag. actions reads this run's environment approval.
    # pull-requests and issues find the pull request the commit was merged from and its labels.
    permissions:
      contents: write
      actions: read
      pull-requests: read
      issues: read
    outputs:
      deployed: ${{ steps.glassops.outputs.deployed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Salesforce & Tools
        uses: rdbumstead/setup-salesforce-action@v2
        with:
          node_version: "26"
          jwt_key: ${{ secrets.SFDX_JWT_KEY }}
          client_id: ${{ secrets.SFDX_CLIENT_ID }}
          username: ${{ secrets.SFDX_USERNAME }}
          alias: "portfolio"

      # The validate runs every local test in production, so keep the public site's share of
      # the daily API requests, as the PR check does. A reached reserve stops the deploy here,
      # before anything is sent. Run the workflow again by hand in delta mode later.
      - name: Check the API Reserve
        run: node scripts/api-reserve.js --target-org portfolio --label "GlassOps deploy"

      # The container runs as root, so .glassops/ is root owned. Later steps read it and never
      # write into it.
      - name: GlassOps Plan, Validate, Gate, Deploy and Verify
        id: glassops
        env:
          FROM: ${{ needs.plan.outputs.from }}
          SFDX_JWT_KEY: ${{ secrets.SFDX_JWT_KEY }}
          SFDX_CLIENT_ID: ${{ secrets.SFDX_CLIENT_ID }}
          SFDX_USERNAME: ${{ secrets.SFDX_USERNAME }}
          SF_PORTFOLIO_ORG_ID: ${{ secrets.SF_PORTFOLIO_ORG_ID }}
          GLASSOPS_PERMIT_KEY: ${{ secrets.GLASSOPS_PERMIT_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "deployed=false" >> "$GITHUB_OUTPUT"

          # The guard's expected org Id comes from a secret, never from a login result, or the
          # guard would compare the org with itself.
          if [ -z "$SF_PORTFOLIO_ORG_ID" ] || [ -z "$GLASSOPS_PERMIT_KEY" ]; then
             echo "::error::SF_PORTFOLIO_ORG_ID or GLASSOPS_PERMIT_KEY is not set, so nothing can be gated or deployed."
             exit 1
          fi

          # The same tag the plan job read, so this plan covers the same range.
          git fetch --force --no-tags origin "refs/tags/glassops/deployed/*:refs/tags/glassops/deployed/*"
          G=(docker run --rm
             -e SFDX_JWT_KEY -e SFDX_CLIENT_ID -e SFDX_USERNAME -e SF_PORTFOLIO_ORG_ID -e GLASSOPS_PERMIT_KEY
             -e GITHUB_ACTIONS -e GITHUB_REPOSITORY -e GITHUB_RUN_ID -e GITHUB_ACTOR -e GITHUB_TRIGGERING_ACTOR
             -e GITHUB_REF -e GITHUB_EVENT_NAME -e GITHUB_API_URL -e GITHUB_SERVER_URL -e GITHUB_TOKEN -e GITHUB_SHA
             -v "$GITHUB_WORKSPACE:/work" -w /work "$GLASSOPS_IMAGE")
          if [ "$FROM" = "tag" ]; then
             PLAN=(plan --config "$GLASSOPS_CONFIG" --target prod)
          else
             PLAN=(plan --config "$GLASSOPS_CONFIG" --from "$FROM" --to HEAD)
          fi

          set +e
          "${G[@]}" "${PLAN[@]}"
          PLAN_EXIT=$?
          PLAN_STATUS=$(jq -r '.status // empty' .glassops/results/plan.json 2>/dev/null)
          VALIDATE_EXIT=none
          GATE_EXIT=none
          DEPLOY_EXIT=none
          VERIFY_EXIT=none
          if [ $PLAN_EXIT -eq 0 ] && [ "$PLAN_STATUS" = "pass" ]; then
             "${G[@]}" validate --target prod --config "$GLASSOPS_CONFIG"
             VALIDATE_EXIT=$?
          fi
          # Exit 1 is a validate that ran and failed, which the gate still records as a deny.
          # Exit 2 is a tool, login, guard or check only error, and leaves nothing to gate.
          if [ "$VALIDATE_EXIT" = "0" ] || [ "$VALIDATE_EXIT" = "1" ]; then
             "${G[@]}" gate --target prod --config "$GLASSOPS_CONFIG"
             GATE_EXIT=$?
          fi
          # deploy verifies the PERMIT itself before it logs in, and quick deploys the bound
          # validation when Salesforce accepts it.
          if [ "$GATE_EXIT" = "0" ]; then
             "${G[@]}" deploy --target prod --config "$GLASSOPS_CONFIG"
             DEPLOY_EXIT=$?
          fi
          DEPLOY_STATUS=$(jq -r '.status // empty' .glassops/results/deploy.json 2>/dev/null)
          if [ "$DEPLOY_EXIT" = "0" ] && [ "$DEPLOY_STATUS" = "pass" ]; then
             echo "deployed=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$DEPLOY_EXIT" = "0" ]; then
             "${G[@]}" verify --target prod --config "$GLASSOPS_CONFIG"
             VERIFY_EXIT=$?
          fi
          "${G[@]}" report --config "$GLASSOPS_CONFIG" --summary .glassops/summary.md > /dev/null
          set -e

          [ -f .glassops/summary.md ] && cat .glassops/summary.md >> $GITHUB_STEP_SUMMARY
          echo "Plan exit $PLAN_EXIT ($PLAN_STATUS), validate exit $VALIDATE_EXIT, gate exit $GATE_EXIT, deploy exit $DEPLOY_EXIT ($DEPLOY_STATUS), verify exit $VERIFY_EXIT."
          if [ -f .glassops/permit.json ]; then
             jq -r '"PERMIT \(.id // "none"): allow \(.allow), expires \(.expires_at // "unknown")",
               "separation of duties: \(.separation_of_duties.mode // "none"), approver \(.separation_of_duties.approver // "none")",
               "validation bound: \(.validation.passed // false), test level \(.validation.test_level // "none")",
               (.checks[]? | "check \(.rule): \(.outcome)")' .glassops/permit.json
          fi
          if [ -f .glassops/results/deploy.json ]; then
             jq -r '"deploy \(.facts["deploy.id"] // "none"): quick \(.facts["deploy.quick"] // "unknown"), tag \(.facts["deploy.tag"] // "none")"' .glassops/results/deploy.json
          fi
          if [ -f .glassops/results/verify.json ]; then
             jq -r '(.checks[]? | "verify \(.name // .rule // "check"): \(.outcome // .status)")' .glassops/results/verify.json
          fi

          if [ "$PLAN_EXIT" = "0" ] && [ "$PLAN_STATUS" != "pass" ]; then
             echo "**GlassOps**: the plan here found no changes, so nothing was deployed" >> $GITHUB_STEP_SUMMARY
             exit 0
          fi
          if [ "$VALIDATE_EXIT" = "0" ] && [ "$GATE_EXIT" = "0" ] && [ "$DEPLOY_EXIT" = "0" ] && [ "$VERIFY_EXIT" = "0" ]; then
             echo "**GlassOps**: deployed under PERMIT, and verify passed" >> $GITHUB_STEP_SUMMARY
          else
             echo "::error::GlassOps did not end in a verified deploy. See this step's log."
             echo "**GlassOps**: no verified deploy (validate $VALIDATE_EXIT, gate $GATE_EXIT, deploy $DEPLOY_EXIT, verify $VERIFY_EXIT)" >> $GITHUB_STEP_SUMMARY
             exit 1
          fi

      # deploy moves the tag in the checkout, but the container has no git credentials, so its
      # own push only warns. This step pushes it with the checkout's credentials. It runs after a
      # deploy that verify failed too, because production changed either way.
      - name: Push the Deployed Tag
        if: always() && steps.glassops.outputs.deployed == 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse -q --verify "refs/tags/$GLASSOPS_TAG^{commit}" > /dev/null || { echo "::error::GlassOps deployed but $GLASSOPS_TAG is not in the checkout."; exit 1; }
          echo "Pushing $GLASSOPS_TAG at $(git rev-parse --short "refs/tags/$GLASSOPS_TAG^{commit}")"
          git push --force origin "refs/tags/$GLASSOPS_TAG"

      - name: Keep the Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glassops-deploy-evidence
          path: |
            .glassops/results/
            .glassops/plan.json
            .glassops/permit.json
          # The folder name starts with a dot, which upload-artifact can treat as hidden.
          include-hidden-files: true
          if-no-files-found: warn

  deploy:
    needs: [plan, glassops]
    # Runs after GlassOps whatever it did, so a docs only push still deploys the drawings and a
    # GlassOps failure still publishes a Failure event. It runs raw sf only in full and
    # destructive mode.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    # A full mode deploy waits up to 60 minutes inside sf, so the cap sits above that.
    timeout-minutes: 90
    outputs:
      deployed: ${{ steps.execute.outputs.deployed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Salesforce & Tools
        uses: rdbumstead/setup-salesforce-action@v2
        with:
          node_version: "26"
          jwt_key: ${{ secrets.SFDX_JWT_KEY }}
          client_id: ${{ secrets.SFDX_CLIENT_ID }}
          username: ${{ secrets.SFDX_USERNAME }}
          alias: "portfolio"

      # Draws the Mermaid blocks into the Mermaid_Diagrams static resource folder, which is never
      # committed. A failed render leaves only the committed placeholder, so the site shows each
      # diagram's source and the deploy goes on.
      - name: Render Mermaid Diagrams
        if: inputs.deployment_mode != 'destructive'
        continue-on-error: true
        run: |
          PUPPETEER_SKIP_DOWNLOAD=1 npm install --prefix "$RUNNER_TEMP/mmd" --no-save --no-audit --no-fund @mermaid-js/mermaid-cli@12.0.0 puppeteer@25.16.0
          MERMAID_CLI_DIR="$RUNNER_TEMP/mmd" PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome)" node scripts/render-mermaid.js

      # Writes deployed=true only when metadata was actually deployed, so a skipped deploy
      # publishes no Success event and runs no tests. On a push or a delta run GlassOps has
      # already deployed in the glassops job, and this step reads what it did. A failed plan or
      # glassops job fails this step, so the Failure event below is published.
      - name: Execute Deployment
        id: execute
        env:
          DESTRUCTIVE_DIR: ${{ inputs.destructive_manifest_dir }}
          PLAN_RESULT: ${{ needs.plan.result }}
          GLASSOPS_RESULT: ${{ needs.glassops.result }}
          GLASSOPS_DEPLOYED: ${{ needs.glassops.outputs.deployed }}
        run: |
          echo "deployed=false" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.deployment_mode }}" != "full" ] && [ "${{ inputs.deployment_mode }}" != "destructive" ]; then
            [ "$GLASSOPS_DEPLOYED" = "true" ] && echo "deployed=true" >> "$GITHUB_OUTPUT"
            if [ "$PLAN_RESULT" != "success" ]; then
              echo "::error::The GlassOps plan job ended $PLAN_RESULT."
              exit 1
            fi
            case "$GLASSOPS_RESULT" in
              success)
                if [ "$GLASSOPS_DEPLOYED" = "true" ]; then
                  echo "GlassOps deployed and verified the change."
                else
                  echo "GlassOps found nothing to deploy."
                fi ;;
              skipped) echo "No metadata changes detected. Skipping deployment." ;;
              *)
                echo "::error::The glassops job ended $GLASSOPS_RESULT. Deployed: ${GLASSOPS_DEPLOYED:-false}. See its log."
                exit 1 ;;
            esac
            exit 0
          fi

          # 0. Destructive mode, by hand only: removes from production the components a
          # committed manifest names, for a component deleted in source that no delta will
          # ever carry. A check only run goes first, so a refused delete changes nothing.
          if [ "${{ inputs.deployment_mode }}" == "destructive" ]; then
            if ! [[ "$DESTRUCTIVE_DIR" =~ ^manifest/destructive/[A-Za-z0-9_-]+$ ]] \
              || [ ! -s "$DESTRUCTIVE_DIR/package.xml" ] \
              || [ ! -s "$DESTRUCTIVE_DIR/destructiveChanges.xml" ]; then
              echo "::error::destructive_manifest_dir must be a folder under manifest/destructive holding package.xml and destructiveChanges.xml."
              exit 1
            fi
            if grep -q "<types>" "$DESTRUCTIVE_DIR/package.xml"; then
              echo "::error::$DESTRUCTIVE_DIR/package.xml must be empty. Destructive mode deletes and deploys nothing else."
              exit 1
            fi
            echo "Components to delete:"
            grep -E "<members>|<name>" "$DESTRUCTIVE_DIR/destructiveChanges.xml"
            sf project deploy start --target-org portfolio --manifest "$DESTRUCTIVE_DIR/package.xml" --post-destructive-changes "$DESTRUCTIVE_DIR/destructiveChanges.xml" --dry-run --wait 30
            sf project deploy start --target-org portfolio --manifest "$DESTRUCTIVE_DIR/package.xml" --post-destructive-changes "$DESTRUCTIVE_DIR/destructiveChanges.xml" --wait 30
            echo "deployed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 1. Full mode, by hand only: deploys the whole source with raw sf, outside GlassOps.
          # It does not move the deployed tag, so the next GlassOps plan still starts at the last
          # GlassOps deploy and may carry changes this run already shipped. That is safe.
          echo "Starting FULL deployment..."
          sf project deploy start --source-dir packages --target-org portfolio --wait 60
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      # A delta carries only files git changed, and the drawings are never committed, so the drawn
      # resource is deployed on its own after every run, a docs only push included. It runs only
      # when the render wrote its manifest, and a failure warns without stopping the tests.
      - name: Deploy Mermaid Drawings
        if: inputs.deployment_mode != 'destructive' && hashFiles('packages/portfolio-site/main/default/staticresources/Mermaid_Diagrams/manifest.json') != ''
        continue-on-error: true
        run: |
          sf project deploy start --target-org portfolio --source-dir packages/portfolio-site/main/default/staticresources/Mermaid_Diagrams.resource-meta.xml --source-dir packages/portfolio-site/main/default/staticresources/Mermaid_Diagrams --wait 30 || { echo "::warning::The Mermaid drawings did not deploy. The site shows each diagram's source until the next run."; exit 1; }

      # Runs the local tests in production after a real deploy, for the Pillar E card. A
      # failed test is reported here and on the run record, and does not undo the deploy.
      - name: Run Apex Tests
        id: tests
        if: steps.execute.outputs.deployed == 'true'
        continue-on-error: true
        run: |
          sf apex run test --target-org portfolio --test-level RunLocalTests --code-coverage --wait 30 --json > apex-tests.json || true

          RAN=$(jq -r '.result.summary.testsRan // empty' apex-tests.json)
          PASSED=$(jq -r '.result.summary.passing // empty' apex-tests.json)
          COVERAGE=$(jq -r '.result.summary.orgWideCoverage // empty' apex-tests.json | tr -d '%')

          if ! [[ "$RAN" =~ ^[0-9]+$ && "$PASSED" =~ ^[0-9]+$ && "$COVERAGE" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
             echo "::warning::The test run returned no usable summary, so no test counts are published."
             jq -r '.message // empty' apex-tests.json
             exit 0
          fi

          echo "Tests run: $RAN, passed: $PASSED, org wide coverage: $COVERAGE%"
          echo "tests_run=$RAN" >> "$GITHUB_OUTPUT"
          echo "tests_passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"

          if [ "$PASSED" != "$RAN" ]; then
             echo "::warning::$((RAN - PASSED)) Apex tests failed in production after the deploy."
          fi

      # Runs the Jest suite on the merged commit after the Apex tests, for the numbers panel.
      # A failed test is reported here and on the run record, and does not undo the deploy.
      # The second "--" hands the reporter options through sfdx-lwc-jest to Jest itself. The
      # json-summary reporter gives the line coverage the Delivery page shows as Jest coverage.
      - name: Run Jest Tests
        id: jest
        if: steps.execute.outputs.deployed == 'true'
        continue-on-error: true
        run: |
          npm ci
          npm run test:unit -- -- --json --outputFile=jest-results.json --coverage --coverageReporters=json-summary --coverageDirectory=jest-coverage --silent || true

          RAN=$(jq -r '.numTotalTests // empty' jest-results.json)
          PASSED=$(jq -r '.numPassedTests // empty' jest-results.json)
          JEST_COVERAGE=$(jq -r '.total.lines.pct // empty' jest-coverage/coverage-summary.json 2>/dev/null)

          if ! [[ "$RAN" =~ ^[0-9]+$ && "$PASSED" =~ ^[0-9]+$ ]]; then
             echo "::warning::The Jest run returned no usable summary, so no Jest counts are published."
             exit 0
          fi

          echo "Jest tests run: $RAN, passed: $PASSED"
          echo "jest_run=$RAN" >> "$GITHUB_OUTPUT"
          echo "jest_passed=$PASSED" >> "$GITHUB_OUTPUT"
          if [[ "$JEST_COVERAGE" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
             echo "Jest line coverage: $JEST_COVERAGE%"
             echo "jest_coverage=$JEST_COVERAGE" >> "$GITHUB_OUTPUT"
          else
             echo "::warning::The Jest run returned no line coverage, so the Jest coverage tile stays as it was."
          fi

          if [ "$PASSED" != "$RAN" ]; then
             echo "::warning::$((RAN - PASSED)) Jest tests failed after the deploy."
          fi

      # A deploy changes the site's components but visitors see the last published copy, so the
      # site is published after every real deploy and the smoke checks what was just shipped.
      # The publish answers with a background job id, polled until it ends. A publish that ends
      # in anything but Complete, or runs past five minutes, fails the run.
      - name: Publish the Site
        if: steps.execute.outputs.deployed == 'true'
        run: |
          sf community publish --name Portfolio --target-org portfolio --json > publish.json || true
          JOB=$(jq -r '.result.jobId // empty' publish.json)
          if [ -z "$JOB" ]; then
             echo "::error::The publish returned no job id."
             jq -r '.message // empty' publish.json
             exit 1
          fi
          echo "Publish job $JOB"
          for i in $(seq 1 30); do
             STATUS=$(sf data query --target-org portfolio --json --query "SELECT Status FROM BackgroundOperation WHERE Id = '$JOB'" | jq -r '.result.records[0].Status // empty')
             echo "Publish status: ${STATUS:-unknown}"
             case "$STATUS" in
                Complete) exit 0 ;;
                Error|Failed|Canceled) echo "::error::The publish ended $STATUS."; exit 1 ;;
             esac
             sleep 10
          done
          echo "::error::The publish did not finish within five minutes."
          exit 1

      - name: Publish Governance Event
        if: success() && steps.execute.outputs.deployed == 'true'
        continue-on-error: true
        run: |
          VALUES="Workflow__c=deploy Status__c=Success Run_Id__c=${{ github.run_id }} Run_Url__c=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} Commit_Sha__c=${{ github.sha }} Completed_At__c=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if [ -n "${{ steps.tests.outputs.tests_run }}" ]; then
             VALUES="$VALUES Tests_Run__c=${{ steps.tests.outputs.tests_run }} Tests_Passed__c=${{ steps.tests.outputs.tests_passed }} Org_Coverage__c=${{ steps.tests.outputs.coverage }}"
          fi

          if [ -n "${{ steps.jest.outputs.jest_run }}" ]; then
             VALUES="$VALUES Jest_Tests_Run__c=${{ steps.jest.outputs.jest_run }} Jest_Tests_Passed__c=${{ steps.jest.outputs.jest_passed }}"
             if [ -n "${{ steps.jest.outputs.jest_coverage }}" ]; then
                VALUES="$VALUES Jest_Coverage__c=${{ steps.jest.outputs.jest_coverage }}"
             fi
          fi

          sf data create record \
            --sobject Governance_Event__e \
            --values "$VALUES" \
            --target-org portfolio

      - name: Publish Failure Event
        if: failure()
        continue-on-error: true
        run: |
          sf data create record \
            --sobject Governance_Event__e \
            --values "Workflow__c=deploy Status__c=Failure Run_Id__c=${{ github.run_id }} Run_Url__c=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} Commit_Sha__c=${{ github.sha }} Completed_At__c=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --target-org portfolio

  # Checks the live site read only after a deploy that changed production, once the deploy job
  # has published it. A failure fails this run and writes a smoke Failure row, and undoes
  # nothing. The same check can be run by hand from the Live Smoke Test workflow.
  # A condition without a status check gets an implicit success(), which is false when any job
  # further up, such as a skipped glassops job, did not succeed. always() and !cancelled() leave
  # the decision to this job's own condition.
  smoke:
    needs: [deploy]
    if: always() && !cancelled() && needs.deploy.result == 'success' && needs.deploy.outputs.deployed == 'true'
    uses: ./.github/workflows/smoke.yml
    secrets: inherit

  # Refreshes the docs cache in production after a push to main that changes docs/**, so the
  # docs page matches the repository within minutes. It needs the deploy job, so on a push
  # that changes both packages/** and docs/** a new Source_File record is in production
  # before the forced run reads it. The page still reads only the cache. always() and
  # !cancelled() keep a skipped glassops job, as on a docs only push, from skipping this one.
  docs-cache:
    needs: [deploy]
    if: always() && !cancelled() && github.event_name == 'push' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for docs changes
        id: docs
        run: |
          FROM_SHA="${{ github.event.before }}"
          if [ -z "$FROM_SHA" ] || [ "$FROM_SHA" = "0000000000000000000000000000000000000000" ]; then
             FROM_SHA="HEAD~1"
          fi
          if git diff --quiet "$FROM_SHA" "${{ github.sha }}" -- docs/; then
             echo "No docs changes, nothing to refresh."
             echo "changed=false" >> "$GITHUB_OUTPUT"
          else
             git diff --name-only "$FROM_SHA" "${{ github.sha }}" -- docs/
             echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Salesforce & Tools
        if: steps.docs.outputs.changed == 'true'
        uses: rdbumstead/setup-salesforce-action@v2
        with:
          node_version: "26"
          jwt_key: ${{ secrets.SFDX_JWT_KEY }}
          client_id: ${{ secrets.SFDX_CLIENT_ID }}
          username: ${{ secrets.SFDX_USERNAME }}
          alias: "portfolio"

      # The GitHub contents API answers with Cache-Control max-age=60, so a read in the
      # first minute after the push can return the old file. The wait covers that.
      - name: Refresh the docs cache
        if: steps.docs.outputs.changed == 'true'
        run: |
          sleep 60
          STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          sf apex run --target-org portfolio --file scripts/refresh-docs-cache.apex --json > refresh.json || true
          if [ "$(jq -r '.result.success' refresh.json)" != "true" ]; then
             echo "::error::The refresh script failed."
             jq -r '.result.exceptionMessage // .message // empty' refresh.json
             exit 1
          fi
          JOB_ID=$(jq -r '.result.logs' refresh.json | grep -oE 'USER_DEBUG\|\[[0-9]+\]\|ERROR\|REFRESH_JOB_ID=[A-Za-z0-9]{15,18}' | sed 's/.*=//' | head -1)
          if [ -z "$JOB_ID" ]; then
             echo "::error::The refresh script printed no job Id."
             exit 1
          fi
          echo "Queued job $JOB_ID"

          STATUS=""
          for i in $(seq 1 30); do
             sleep 10
             STATUS=$(sf data query --target-org portfolio --query "SELECT Status FROM AsyncApexJob WHERE Id = '$JOB_ID'" --json | jq -r '.result.records[0].Status // empty')
             case "$STATUS" in Completed|Failed|Aborted) break ;; esac
          done
          echo "Job status: ${STATUS:-unknown}"
          if [ "$STATUS" != "Completed" ]; then
             echo "::error::The refresh job did not complete."
             exit 1
          fi

          EXPECTED=$(sf data query --target-org portfolio --query "SELECT Id FROM Source_File__mdt WHERE Source_Key__c = 'docs'" --json | jq -r '.result.totalSize')
          FRESH=$(sf data query --target-org portfolio --query "SELECT COUNT() FROM Source_Cache__c WHERE Path__c LIKE 'docs/%' AND (NOT Path__c LIKE '%#part-%') AND Last_Status__c = '200' AND Checked_At__c >= $STARTED" --json | jq -r '.result.totalSize')
          echo "Docs read with status 200 since $STARTED: $FRESH of $EXPECTED"
          if [ "$FRESH" != "$EXPECTED" ]; then
             echo "::error::Not every doc was refreshed. The circuit breaker may be open or GitHub may have failed. The cache keeps its last good content."
             exit 1
          fi

  # View source shows code read from GitHub and kept in Source_Cache__c. The nightly refresh
  # can leave it up to a day behind a merge, so a push that changes packages/ forces a fresh
  # read of every configured code path, the same way docs-cache does for the docs. Several
  # source keys can name one file, so the expected count is the number of distinct paths.
  code-cache:
    needs: [deploy]
    if: always() && !cancelled() && github.event_name == 'push' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for code changes
        id: code
        run: |
          FROM_SHA="${{ github.event.before }}"
          if [ -z "$FROM_SHA" ] || [ "$FROM_SHA" = "0000000000000000000000000000000000000000" ]; then
             FROM_SHA="HEAD~1"
          fi
          if git diff --quiet "$FROM_SHA" "${{ github.sha }}" -- packages/; then
             echo "No code changes, nothing to refresh."
             echo "changed=false" >> "$GITHUB_OUTPUT"
          else
             echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Salesforce & Tools
        if: steps.code.outputs.changed == 'true'
        uses: rdbumstead/setup-salesforce-action@v2
        with:
          node_version: "26"
          jwt_key: ${{ secrets.SFDX_JWT_KEY }}
          client_id: ${{ secrets.SFDX_CLIENT_ID }}
          username: ${{ secrets.SFDX_USERNAME }}
          alias: "portfolio"

      # The GitHub contents API answers with Cache-Control max-age=60, so the wait covers a
      # read in the first minute after the push.
      - name: Refresh the code cache
        if: steps.code.outputs.changed == 'true'
        run: |
          sleep 60
          STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          sf apex run --target-org portfolio --file scripts/refresh-code-cache.apex --json > refresh.json || true
          if [ "$(jq -r '.result.success' refresh.json)" != "true" ]; then
             echo "::error::The refresh script failed."
             jq -r '.result.exceptionMessage // .message // empty' refresh.json
             exit 1
          fi
          JOB_ID=$(jq -r '.result.logs' refresh.json | grep -oE 'USER_DEBUG\|\[[0-9]+\]\|ERROR\|REFRESH_JOB_ID=[A-Za-z0-9]{15,18}' | sed 's/.*=//' | head -1)
          if [ -z "$JOB_ID" ]; then
             echo "::error::The refresh script printed no job Id."
             exit 1
          fi
          echo "Queued job $JOB_ID"

          STATUS=""
          for i in $(seq 1 30); do
             sleep 10
             STATUS=$(sf data query --target-org portfolio --query "SELECT Status FROM AsyncApexJob WHERE Id = '$JOB_ID'" --json | jq -r '.result.records[0].Status // empty')
             case "$STATUS" in Completed|Failed|Aborted) break ;; esac
          done
          echo "Job status: ${STATUS:-unknown}"
          if [ "$STATUS" != "Completed" ]; then
             echo "::error::The refresh job did not complete."
             exit 1
          fi

          EXPECTED=$(sf data query --target-org portfolio --query "SELECT Path__c FROM Source_File__mdt WHERE Source_Key__c != 'docs'" --json | jq -r '[.result.records[].Path__c | ltrimstr(" ") | rtrimstr(" ")] | unique | length')
          FRESH=$(sf data query --target-org portfolio --query "SELECT COUNT() FROM Source_Cache__c WHERE (NOT Path__c LIKE 'docs/%') AND (NOT Path__c LIKE '%#part-%') AND Last_Status__c = '200' AND Checked_At__c >= $STARTED" --json | jq -r '.result.totalSize')
          echo "Code files read with status 200 since $STARTED: $FRESH of $EXPECTED"
          if [ "$FRESH" != "$EXPECTED" ]; then
             echo "::error::Not every code file was refreshed. The circuit breaker may be open or GitHub may have failed. The cache keeps its last good content."
             exit 1
          fi

  # The static site reads the org after the deploy, the smoke and both cache refreshes, so
  # its export runs against the Apex, documents and code that just went live. Static Site
  # (Cloudflare Pages) builds a fixture site until its own secrets are set.
  site:
    needs: [deploy, smoke, docs-cache, code-cache]
    if: always() && github.event_name == 'push' && needs.deploy.result == 'success' && needs.smoke.result != 'failure' && needs.docs-cache.result != 'failure' && needs.code-cache.result != 'failure'
    uses: ./.github/workflows/site.yml
    secrets: inherit

  # The Postman collection sync is its own workflow, postman-sync.yml. It starts when this one
  # completes, so the site footer can show its badge.

  deploy-status:
    if: always()
    needs: [deploy, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate Deployment Summary
        run: |
          echo "## Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          case "${{ needs.smoke.result }}" in
            success) echo "**Live smoke test**: Passed" >> $GITHUB_STEP_SUMMARY ;;
            failure) echo "**Live smoke test**: Failed, see the smoke job. Nothing was undone." >> $GITHUB_STEP_SUMMARY ;;
            *) echo "**Live smoke test**: Not run" >> $GITHUB_STEP_SUMMARY ;;
          esac

          if [ "${{ needs.deploy.result }}" = "success" ] && [ "${{ needs.deploy.outputs.deployed }}" = "true" ]; then
             echo "**Result**: Deployment Successful" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy.result }}" = "success" ]; then
             echo "**Result**: Skipped, no metadata changes" >> $GITHUB_STEP_SUMMARY
          else
             echo "**Result**: Deployment Failed" >> $GITHUB_STEP_SUMMARY
             exit 1
          fi
