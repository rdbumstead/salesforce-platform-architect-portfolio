name: Deploy to Production

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "sfdx-project.json"
      - "package.json"
      # A docs only push runs the workflow for the docs-cache job. The deploy job finds no
      # metadata in its delta and skips the deploy.
      - "docs/**"
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: "Deployment Mode"
        required: true
        default: "delta"
        type: choice
        options: [delta, full, destructive]
      destructive_manifest_dir:
        description: "Destructive mode only: folder under manifest/destructive holding package.xml and destructiveChanges.xml"
        required: false
        default: ""
        type: string
      destructive_timing:
        description: "Destructive Changes Timing"
        required: true
        default: "post"
        type: choice
        options: [pre, post]

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.execute.outputs.deployed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Salesforce & Tools
        uses: rdbumstead/setup-salesforce-action@v2
        with:
          node_version: "22"
          jwt_key: ${{ secrets.SFDX_JWT_KEY }}
          client_id: ${{ secrets.SFDX_CLIENT_ID }}
          username: ${{ secrets.SFDX_USERNAME }}
          install_delta: "true"
          alias: "portfolio"

      - name: Generate Delta
        if: github.event_name == 'push' || inputs.deployment_mode == 'delta'
        run: |
          mkdir -p changed

          FROM_SHA="${{ github.event.before }}"
          [ -z "$FROM_SHA" ] || [ "$FROM_SHA" = "0000000000000000000000000000000000000000" ] && FROM_SHA="HEAD~1"

          echo "Generating delta from $FROM_SHA to HEAD..."

          sf sgd source delta \
            --to "HEAD" \
            --from "$FROM_SHA" \
            --output-dir changed \
            --source-dir packages \
            --generate-delta \
            --ignore .forceignore

      # Draws the Mermaid blocks into the Mermaid_Diagrams static resource folder, which is never
      # committed. A failed render leaves only the committed placeholder, so the site shows each
      # diagram's source and the deploy goes on.
      - name: Render Mermaid Diagrams
        if: inputs.deployment_mode != 'destructive'
        continue-on-error: true
        run: |
          PUPPETEER_SKIP_DOWNLOAD=1 npm install --prefix "$RUNNER_TEMP/mmd" --no-save --no-audit --no-fund @mermaid-js/mermaid-cli@12.0.0 puppeteer@25.16.0
          MERMAID_CLI_DIR="$RUNNER_TEMP/mmd" PUPPETEER_EXECUTABLE_PATH="$(command -v google-chrome)" node scripts/render-mermaid.js

      # Writes deployed=true only when metadata was actually deployed, so a skipped deploy
      # publishes no Success event and runs no tests.
      - name: Execute Deployment
        id: execute
        env:
          DESTRUCTIVE_DIR: ${{ inputs.destructive_manifest_dir }}
        run: |
          echo "deployed=false" >> "$GITHUB_OUTPUT"

          # 0. Destructive mode, by hand only: removes from production the components a
          # committed manifest names, for a component deleted in source that no delta will
          # ever carry. A check only run goes first, so a refused delete changes nothing.
          if [ "${{ inputs.deployment_mode }}" == "destructive" ]; then
            if ! [[ "$DESTRUCTIVE_DIR" =~ ^manifest/destructive/[A-Za-z0-9_-]+$ ]] \
              || [ ! -s "$DESTRUCTIVE_DIR/package.xml" ] \
              || [ ! -s "$DESTRUCTIVE_DIR/destructiveChanges.xml" ]; then
              echo "::error::destructive_manifest_dir must be a folder under manifest/destructive holding package.xml and destructiveChanges.xml."
              exit 1
            fi
            if grep -q "<types>" "$DESTRUCTIVE_DIR/package.xml"; then
              echo "::error::$DESTRUCTIVE_DIR/package.xml must be empty. Destructive mode deletes and deploys nothing else."
              exit 1
            fi
            echo "Components to delete:"
            grep -E "<members>|<name>" "$DESTRUCTIVE_DIR/destructiveChanges.xml"
            sf project deploy start --target-org portfolio --manifest "$DESTRUCTIVE_DIR/package.xml" --post-destructive-changes "$DESTRUCTIVE_DIR/destructiveChanges.xml" --dry-run --wait 30
            sf project deploy start --target-org portfolio --manifest "$DESTRUCTIVE_DIR/package.xml" --post-destructive-changes "$DESTRUCTIVE_DIR/destructiveChanges.xml" --wait 30
            echo "deployed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 1. Handle Full Deployment
          if [ "${{ inputs.deployment_mode }}" == "full" ]; then
            echo "Starting FULL deployment..."
            sf project deploy start --source-dir packages --target-org portfolio --wait 60
            echo "deployed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. Analyze Delta Artifacts
          HAS_CHANGES="false"
          DEPLOY_CMD="sf project deploy start --target-org portfolio --wait 30"

          if [ -s changed/package/package.xml ] && grep -q "<types>" changed/package/package.xml; then
             echo "Detected Metadata Changes"
             DEPLOY_CMD="$DEPLOY_CMD --manifest changed/package/package.xml"
             HAS_CHANGES="true"
          fi

          if [ -s changed/destructiveChanges/destructiveChanges.xml ] && grep -q "<types>" changed/destructiveChanges/destructiveChanges.xml; then
             echo "Detected Destructive Changes"

             # The destructive flags need a manifest. A delta that only deletes has an empty
             # package.xml, which still has to be passed.
             [[ "$DEPLOY_CMD" == *"--manifest"* ]] || DEPLOY_CMD="$DEPLOY_CMD --manifest changed/package/package.xml"

             TIMING="${{ inputs.destructive_timing }}"
             [ -z "$TIMING" ] && TIMING="post"

             if [ "$TIMING" == "pre" ]; then
                DEPLOY_CMD="$DEPLOY_CMD --pre-destructive-changes changed/destructiveChanges/destructiveChanges.xml"
             else
                DEPLOY_CMD="$DEPLOY_CMD --post-destructive-changes changed/destructiveChanges/destructiveChanges.xml"
             fi
             HAS_CHANGES="true"
          fi

          # 3. Execute or Skip
          if [ "$HAS_CHANGES" == "true" ]; then
             echo "Executing: $DEPLOY_CMD"
             $DEPLOY_CMD
             echo "deployed=true" >> "$GITHUB_OUTPUT"
          else
             echo "No metadata changes detected. Skipping deployment."
          fi

      # A delta carries only files git changed, and the drawings are never committed, so the drawn
      # resource is deployed on its own after every run, a docs only push included. It runs only
      # when the render wrote its manifest, and a failure warns without stopping the tests.
      - name: Deploy Mermaid Drawings
        if: inputs.deployment_mode != 'destructive' && hashFiles('packages/portfolio-site/main/default/staticresources/Mermaid_Diagrams/manifest.json') != ''
        continue-on-error: true
        run: |
          sf project deploy start --target-org portfolio --source-dir packages/portfolio-site/main/default/staticresources/Mermaid_Diagrams.resource-meta.xml --source-dir packages/portfolio-site/main/default/staticresources/Mermaid_Diagrams --wait 30 || { echo "::warning::The Mermaid drawings did not deploy. The site shows each diagram's source until the next run."; exit 1; }

      # Runs the local tests in production after a real deploy, for the Pillar E card. A
      # failed test is reported here and on the run record, and does not undo the deploy.
      - name: Run Apex Tests
        id: tests
        if: steps.execute.outputs.deployed == 'true'
        continue-on-error: true
        run: |
          sf apex run test --target-org portfolio --test-level RunLocalTests --code-coverage --wait 30 --json > apex-tests.json || true

          RAN=$(jq -r '.result.summary.testsRan // empty' apex-tests.json)
          PASSED=$(jq -r '.result.summary.passing // empty' apex-tests.json)
          COVERAGE=$(jq -r '.result.summary.orgWideCoverage // empty' apex-tests.json | tr -d '%')

          if ! [[ "$RAN" =~ ^[0-9]+$ && "$PASSED" =~ ^[0-9]+$ && "$COVERAGE" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then
             echo "::warning::The test run returned no usable summary, so no test counts are published."
             jq -r '.message // empty' apex-tests.json
             exit 0
          fi

          echo "Tests run: $RAN, passed: $PASSED, org wide coverage: $COVERAGE%"
          echo "tests_run=$RAN" >> "$GITHUB_OUTPUT"
          echo "tests_passed=$PASSED" >> "$GITHUB_OUTPUT"
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"

          if [ "$PASSED" != "$RAN" ]; then
             echo "::warning::$((RAN - PASSED)) Apex tests failed in production after the deploy."
          fi

      # Runs the Jest suite on the merged commit after the Apex tests, for the numbers panel.
      # A failed test is reported here and on the run record, and does not undo the deploy.
      # The second "--" hands the reporter options through sfdx-lwc-jest to Jest itself.
      - name: Run Jest Tests
        id: jest
        if: steps.execute.outputs.deployed == 'true'
        continue-on-error: true
        run: |
          npm ci
          npm run test:unit -- -- --json --outputFile=jest-results.json --silent || true

          RAN=$(jq -r '.numTotalTests // empty' jest-results.json)
          PASSED=$(jq -r '.numPassedTests // empty' jest-results.json)

          if ! [[ "$RAN" =~ ^[0-9]+$ && "$PASSED" =~ ^[0-9]+$ ]]; then
             echo "::warning::The Jest run returned no usable summary, so no Jest counts are published."
             exit 0
          fi

          echo "Jest tests run: $RAN, passed: $PASSED"
          echo "jest_run=$RAN" >> "$GITHUB_OUTPUT"
          echo "jest_passed=$PASSED" >> "$GITHUB_OUTPUT"

          if [ "$PASSED" != "$RAN" ]; then
             echo "::warning::$((RAN - PASSED)) Jest tests failed after the deploy."
          fi

      - name: Publish Governance Event
        if: success() && steps.execute.outputs.deployed == 'true'
        continue-on-error: true
        run: |
          VALUES="Workflow__c=deploy Status__c=Success Run_Id__c=${{ github.run_id }} Run_Url__c=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} Commit_Sha__c=${{ github.sha }} Completed_At__c=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if [ -n "${{ steps.tests.outputs.tests_run }}" ]; then
             VALUES="$VALUES Tests_Run__c=${{ steps.tests.outputs.tests_run }} Tests_Passed__c=${{ steps.tests.outputs.tests_passed }} Org_Coverage__c=${{ steps.tests.outputs.coverage }}"
          fi

          if [ -n "${{ steps.jest.outputs.jest_run }}" ]; then
             VALUES="$VALUES Jest_Tests_Run__c=${{ steps.jest.outputs.jest_run }} Jest_Tests_Passed__c=${{ steps.jest.outputs.jest_passed }}"
          fi

          sf data create record \
            --sobject Governance_Event__e \
            --values "$VALUES" \
            --target-org portfolio

      - name: Publish Failure Event
        if: failure()
        continue-on-error: true
        run: |
          sf data create record \
            --sobject Governance_Event__e \
            --values "Workflow__c=deploy Status__c=Failure Run_Id__c=${{ github.run_id }} Run_Url__c=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} Commit_Sha__c=${{ github.sha }} Completed_At__c=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --target-org portfolio

  # Checks the live site read only after a deploy that changed production. A failure fails
  # this run and writes a smoke Failure row, and undoes nothing. The same check can be run by
  # hand from the Live Smoke Test workflow, for example after the site is published.
  smoke:
    needs: [deploy]
    if: needs.deploy.result == 'success' && needs.deploy.outputs.deployed == 'true'
    uses: ./.github/workflows/smoke.yml
    secrets: inherit

  # Refreshes the docs cache in production after a push to main that changes docs/**, so the
  # docs page matches the repository within minutes. It needs the deploy job, so on a push
  # that changes both packages/** and docs/** a new Source_File record is in production
  # before the forced run reads it. The page still reads only the cache.
  docs-cache:
    needs: [deploy]
    if: github.event_name == 'push' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for docs changes
        id: docs
        run: |
          FROM_SHA="${{ github.event.before }}"
          if [ -z "$FROM_SHA" ] || [ "$FROM_SHA" = "0000000000000000000000000000000000000000" ]; then
             FROM_SHA="HEAD~1"
          fi
          if git diff --quiet "$FROM_SHA" "${{ github.sha }}" -- docs/; then
             echo "No docs changes, nothing to refresh."
             echo "changed=false" >> "$GITHUB_OUTPUT"
          else
             git diff --name-only "$FROM_SHA" "${{ github.sha }}" -- docs/
             echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Salesforce & Tools
        if: steps.docs.outputs.changed == 'true'
        uses: rdbumstead/setup-salesforce-action@v2
        with:
          node_version: "22"
          jwt_key: ${{ secrets.SFDX_JWT_KEY }}
          client_id: ${{ secrets.SFDX_CLIENT_ID }}
          username: ${{ secrets.SFDX_USERNAME }}
          alias: "portfolio"

      # The GitHub contents API answers with Cache-Control max-age=60, so a read in the
      # first minute after the push can return the old file. The wait covers that.
      - name: Refresh the docs cache
        if: steps.docs.outputs.changed == 'true'
        run: |
          sleep 60
          STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          sf apex run --target-org portfolio --file scripts/refresh-docs-cache.apex --json > refresh.json || true
          if [ "$(jq -r '.result.success' refresh.json)" != "true" ]; then
             echo "::error::The refresh script failed."
             jq -r '.result.exceptionMessage // .message // empty' refresh.json
             exit 1
          fi
          JOB_ID=$(jq -r '.result.logs' refresh.json | grep -oE 'USER_DEBUG\|\[[0-9]+\]\|ERROR\|REFRESH_JOB_ID=[A-Za-z0-9]{15,18}' | sed 's/.*=//' | head -1)
          if [ -z "$JOB_ID" ]; then
             echo "::error::The refresh script printed no job Id."
             exit 1
          fi
          echo "Queued job $JOB_ID"

          STATUS=""
          for i in $(seq 1 30); do
             sleep 10
             STATUS=$(sf data query --target-org portfolio --query "SELECT Status FROM AsyncApexJob WHERE Id = '$JOB_ID'" --json | jq -r '.result.records[0].Status // empty')
             case "$STATUS" in Completed|Failed|Aborted) break ;; esac
          done
          echo "Job status: ${STATUS:-unknown}"
          if [ "$STATUS" != "Completed" ]; then
             echo "::error::The refresh job did not complete."
             exit 1
          fi

          EXPECTED=$(sf data query --target-org portfolio --query "SELECT Id FROM Source_File__mdt WHERE Source_Key__c = 'docs'" --json | jq -r '.result.totalSize')
          FRESH=$(sf data query --target-org portfolio --query "SELECT COUNT() FROM Source_Cache__c WHERE Path__c LIKE 'docs/%' AND (NOT Path__c LIKE '%#part-%') AND Last_Status__c = '200' AND Checked_At__c >= $STARTED" --json | jq -r '.result.totalSize')
          echo "Docs read with status 200 since $STARTED: $FRESH of $EXPECTED"
          if [ "$FRESH" != "$EXPECTED" ]; then
             echo "::error::Not every doc was refreshed. The circuit breaker may be open or GitHub may have failed. The cache keeps its last good content."
             exit 1
          fi

  deploy-status:
    if: always()
    needs: [deploy, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Generate Deployment Summary
        run: |
          echo "## Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          case "${{ needs.smoke.result }}" in
            success) echo "**Live smoke test**: Passed" >> $GITHUB_STEP_SUMMARY ;;
            failure) echo "**Live smoke test**: Failed, see the smoke job. Nothing was undone." >> $GITHUB_STEP_SUMMARY ;;
            *) echo "**Live smoke test**: Not run" >> $GITHUB_STEP_SUMMARY ;;
          esac

          if [ "${{ needs.deploy.result }}" = "success" ] && [ "${{ needs.deploy.outputs.deployed }}" = "true" ]; then
             echo "**Result**: Deployment Successful" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.deploy.result }}" = "success" ]; then
             echo "**Result**: Skipped, no metadata changes" >> $GITHUB_STEP_SUMMARY
          else
             echo "**Result**: Deployment Failed" >> $GITHUB_STEP_SUMMARY
             exit 1
          fi
