name: Live Smoke Test

# Read only check of the live site: every route answers 200, each route's key components
# render, and no unexpected console error shows, in Chromium and WebKit at a desktop and a
# phone size. Deploy to Production calls it after a deploy that changed production, it runs
# once a day on its own so a break between deploys is caught (an expired credential, a
# failing cache job, a platform change), and it can be run by hand, for example after the
# site is published. GitHub emails the repository owner when a scheduled run fails. A failure
# writes a smoke Failure row through the governance event and undoes nothing.
#
# The check runs inside Playwright's own container image, which already holds both browsers
# and the system libraries they need, so the job installs no operating system packages and
# downloads no browser. The npm package version must match the image's version. A run that
# hangs stops after 10 minutes and counts as a failure.

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      site_base:
        description: Site root to check, for example a scratch org's site. Defaults to production.
        required: false
        default: https://ryan-bumstead-dev-ed.develop.my.site.com/portfolio
  # 09:30 UTC, after the 08:00 Daily Org Heartbeat.
  schedule:
    - cron: "30 9 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    env:
      SITE_BASE: ${{ inputs.site_base || 'https://ryan-bumstead-dev-ed.develop.my.site.com/portfolio' }}
      PLAYWRIGHT_VERSION: "1.64.0"
    steps:
      - uses: actions/checkout@v4

      # Only the npm package. The browsers come with the image, in its PLAYWRIGHT_BROWSERS_PATH.
      - name: Install Playwright
        run: npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"

      - name: Run Live Smoke Test
        run: |
          set +e
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" SMOKE_JSON=smoke.json node scripts/live-smoke.js > smoke.out
          CODE=$?
          set -e

          SUMMARY=$(head -n 1 smoke.out)
          echo "$SUMMARY"
          {
            echo "## Live Smoke Test"
            echo ""
            echo "**Result**: $SUMMARY"
            echo ""
            echo "Site: $SITE_BASE"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -s smoke.json ]; then
            node -e '
              const rows = (JSON.parse(require("fs").readFileSync("smoke.json", "utf8")).rows || []).filter((r) => !r.pass);
              for (const r of rows) {
                const parts = [`- ${r.browser} ${r.route || ""} ${r.viewport || ""}: status ${r.status || "none"}`];
                if (r.error) parts.push(r.error);
                for (const [tag, state] of Object.entries(r.components || {})) {
                  if (state !== "visible" && state !== "empty") parts.push(`${tag} ${state}`);
                }
                for (const e of r.errors || []) parts.push(`console: ${e}`);
                console.log(parts.join(", "));
              }
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

          exit $CODE

      - name: Upload Smoke Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke
          path: smoke.json
          if-no-files-found: ignore

  # Outside the container, as before, so the Salesforce sign in runs where it always has.
  # Only a check of the production site reports. A run by hand against another site, such as
  # a scratch org's, writes nothing to production.
  report-failure:
    needs: [smoke]
    if: failure() && (inputs.site_base == '' || inputs.site_base == 'https://ryan-bumstead-dev-ed.develop.my.site.com/portfolio')
    runs-on: ubuntu-latest
    steps:
      - name: Sign In For The Failure Event
        continue-on-error: true
        uses: rdbumstead/setup-salesforce-action@v2
        with:
          node_version: "22"
          jwt_key: ${{ secrets.SFDX_JWT_KEY }}
          client_id: ${{ secrets.SFDX_CLIENT_ID }}
          username: ${{ secrets.SFDX_USERNAME }}
          alias: "portfolio"

      # On the daily schedule the row's key is smoke:<this run's id>.
      # Called from Deploy to Production, github.run_id is that deploy's run, so the row's key
      # is smoke:<the deploy's run id>, beside the deploy's own row.
      - name: Publish Smoke Failure Event
        continue-on-error: true
        run: |
          sf data create record \
            --sobject Governance_Event__e \
            --values "Workflow__c=smoke Status__c=Failure Run_Id__c=${{ github.run_id }} Run_Url__c=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} Commit_Sha__c=${{ github.sha }} Completed_At__c=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --target-org portfolio
