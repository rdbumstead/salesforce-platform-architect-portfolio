<template>
  <span lwc:if={hasIcon} class="boundary" style={boundaryStyle}>
    <svg
      class="icon"
      style={svgStyle}
      viewBox={viewBox}
      aria-hidden="true"
      focusable="false"
    >
      <g>
        <template for:each={paths} for:item="p">
          <path key={p.key} d={p.d} fill={p.fill}></path>
        </template>
      </g>
    </svg>
    <span lwc:if={alternativeText} class="assistive">{alternativeText}</span>
  </span>
</template>
