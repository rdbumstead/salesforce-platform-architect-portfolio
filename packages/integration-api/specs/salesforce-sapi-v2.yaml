tags:
  - name: Monitoring
    description: Health checks and observability endpoints.
  - name: Profile
    description: Core candidate information (Contact, Experience, Education).
  - name: Objects
    description: Portfolio entities (Projects, Skills, Certifications).
  - name: Junctions
    description: Many-to-many relationships (Project-Skills, Experience-Skills).
  - name: Configuration
    description: Global portfolio settings.

servers:
  - url: https://{domain}/services/apexrest/sapi
    description: |
      Salesforce My Domain (authenticated Apex REST). Bearer-token callers use the `instance_url`
      returned with their token. The Experience Cloud site domain serves Apex REST to the guest
      user only, and the only guest-callable path is PAPI `POST /auth/token`.
    variables:
      domain:
        default: ryan-bumstead-dev-ed.develop.my.salesforce.com
        description: The org's My Domain host.
        enum:
          - ryan-bumstead-dev-ed.develop.my.salesforce.com

security:
  - OAuth2ClientCredentials:
      - api

components:
  x-rate-limit:
    description: "Enforced in Apex by RateWindowLimiter (ADR-025), a custom-object counter: one API_Rate_Window__c row per caller key per fixed UTC calendar minute. The caller key is sapi:{SHA-256 hex of the session id}, or sapi:{user id} when the session id is null. Every response carries X-RateLimit-Limit and X-RateLimit-Remaining. Request limit + 1 within the minute gets 429 RATE_LIMIT_EXCEEDED with Retry-After set to the seconds left in the minute. Rejected requests count. No burst allowance. Every token from POST /papi/auth/token is the same session, so all evaluators share one key and one limit (ADR-028)."
    tier: standard
    requestsPerMinute: 120

  securitySchemes:
    OAuth2ClientCredentials:
      type: oauth2
      description: |
        OAuth 2.0 Client Credentials flow issued by the Portfolio API External Client App (ADR-027).
        Tokens run as the read-only integration user. External evaluators obtain a short-lived token
        from `POST /papi/auth/token` (ADR-028) instead of holding the consumer secret. Every
        evaluator receives the same session, so all evaluators share one rate limit.
      flows:
        clientCredentials:
          tokenUrl: https://ryan-bumstead-dev-ed.develop.my.salesforce.com/services/oauth2/token
          scopes:
            api: Access Salesforce REST APIs as the integration user

  headers:
    RequestIdResponse:
      description: "Correlation ID. A valid caller-supplied value is echoed by the platform; Apex sets the header only when it generated the value (missing or non-UUID request header)."
      schema:
        type: string
        format: uuid

    TotalCountResponse:
      description: "Total number of records that match the request, so a filtered list reports the filtered total. With no filter it is every record the resource can return. The total is the same on every page of one request."
      schema:
        type: integer

    HasMoreResponse:
      description: "Boolean indicator if more records exist beyond the current offset."
      schema:
        type: boolean

    CacheControlResponse:
      description: "Directives for caching mechanisms in both requests and responses."
      schema:
        type: string
        example: "max-age=300, public"

    NoCacheResponse:
      description: "Directive to prevent caching of sensitive/dynamic data."
      schema:
        type: string
        example: "no-store, no-cache"

  parameters:
    apiVersionParam:
      name: X-API-Version
      in: header
      required: false
      description: "API Contract Version. Send v2 for this contract. Missing resolves to v1, which is deprecated; any other value returns 400 BAD_REQUEST that says to send v1 or v2 (ADR-026)."
      schema:
        type: string
        enum: [v1, v2]
        example: "v2"

    requestIdParam:
      name: X-Request-Id
      in: header
      required: true
      description: "Correlation ID for distributed tracing. Required on SAPI; missing or non-UUID returns 400 BAD_REQUEST (ADR-026)."
      schema:
        type: string
        format: uuid

    limitParam:
      name: limit
      in: query
      required: false
      description: "Maximum number of records to return."
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200

    offsetParam:
      name: offset
      in: query
      required: false
      description: "Pagination offset, from 0 to 2000. A larger value returns 400 BAD_REQUEST, because the platform allows no larger SOQL offset. The X-Total-Count header says how many records there are."
      schema:
        type: integer
        default: 0
        minimum: 0
        maximum: 2000

    contactNameParam:
      name: contactName
      in: query
      description: Filter by Contact Name.
      schema:
        type: string

    employerNameParam:
      name: employerName
      in: query
      description: Filter by Employer Name.
      schema:
        type: string

    currentlyEmployedParam:
      name: currentlyEmployed
      in: query
      description: Filter by active employment status.
      schema:
        type: boolean

    projectKeyParam:
      name: projectKey
      in: query
      description: Filter by Project public key, for example `prj_8f3k2m9qtz`. A Salesforce Id is not accepted in v2 and is treated as an unknown key. The version 1 name `projectId` returns 400.
      schema:
        type: string

    experienceKeyParam:
      name: experienceKey
      in: query
      description: Filter by Experience public key, for example `exp_4h7n2c8wpd`. A Salesforce Id is not accepted in v2 and is treated as an unknown key. The version 1 name `experienceId` returns 400.
      schema:
        type: string

    personaParam:
      name: persona
      in: query
      description: |
        Filters records where the target field (Multi-Select Picklist) includes the specified persona(s).
        Takes a single value or a comma-separated list of Admin, Developer and Architect. An unknown value returns 400.

        Examples:
        - Single: `?persona=Admin`
        - Multiple (comma): `?persona=Admin,Developer`
      schema:
        type: string
      example: "Admin"

    statusParam:
      name: status
      in: query
      description: "Filter by Project Status."
      schema:
        $ref: "#/components/schemas/ProjectStatus"

    issuerNameParam:
      name: issuerName
      in: query
      description: Filter by Issuer Name.
      schema:
        type: string

    accountNameParam:
      name: accountName
      in: query
      description: Filter by Account Name.
      schema:
        type: string

    certificationNameParam:
      name: certificationName
      in: query
      description: Filter by Certification Name.
      schema:
        type: string

    projectNameParam:
      name: projectName
      in: query
      description: Filter by Project Name.
      schema:
        type: string

    certificationKeyParam:
      name: certificationKey
      in: query
      description: Filter by Certification public key, for example `crt_6q2v8d4nhz`. A Salesforce Id is not accepted in v2 and is treated as an unknown key. The version 1 name `certificationId` returns 400.
      schema:
        type: string

    isFeaturedParam:
      name: isFeatured
      in: query
      description: Filter only featured projects.
      schema:
        type: boolean

    categoryParam:
      name: category
      in: query
      schema:
        type: string
      description: "Filter skills by Category, one of the Skill Category picklist values, for example 'Backend', 'Frontend' or 'Integration'."

  responses:
    BadRequest:
      description: "The request was refused before any data was read. The message names the header, parameter or field to change."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestIdResponse"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unsupportedVersion:
              summary: "X-API-Version is not v1 or v2"
              value:
                httpStatus: 400
                errorCode: "BAD_REQUEST"
                message: "X-API-Version must be v1 or v2. Send X-API-Version: v2 for the current version."
                correlationId: "123e4567-e89b-12d3-a456-426614174000"
                retryable: false
                help: "https://ryanbumstead.com/api-lab/reference?spec=sapi&version=v2#error-bad-request"
            badRequestId:
              summary: "X-Request-Id is not a UUID"
              value:
                httpStatus: 400
                errorCode: "BAD_REQUEST"
                message: "X-Request-Id must be a UUID like 3f1c9b2e-8d4a-4c1e-9b7f-2a6d5e4c3b1a. On /papi routes you can leave it out and one is made for you."
                correlationId: "123e4567-e89b-12d3-a456-426614174000"
                retryable: false
                help: "https://ryanbumstead.com/api-lab/reference?spec=sapi&version=v2#error-bad-request"
            badOffset:
              summary: "offset is out of range"
              value:
                httpStatus: 400
                errorCode: "BAD_REQUEST"
                message: "offset must be a whole number from 0 to 2000. The X-Total-Count header says how many records there are."
                correlationId: "123e4567-e89b-12d3-a456-426614174000"
                retryable: false
                help: "https://ryanbumstead.com/api-lab/reference?spec=sapi&version=v2#error-bad-request"
            badLimit:
              summary: "limit is out of range"
              value:
                httpStatus: 400
                errorCode: "BAD_REQUEST"
                message: "limit must be a whole number from 1 to 200. Leave it out to get the default page size."
                correlationId: "123e4567-e89b-12d3-a456-426614174000"
                retryable: false
                help: "https://ryanbumstead.com/api-lab/reference?spec=sapi&version=v2#error-bad-request"
            renamedFilter:
              summary: "A v2 call used the v1 filter name"
              value:
                httpStatus: 400
                errorCode: "BAD_REQUEST"
                message: "In v2 this filter is called projectKey, and it takes a public key. Rename projectId to projectKey."
                correlationId: "123e4567-e89b-12d3-a456-426614174000"
                retryable: false
                help: "https://ryanbumstead.com/api-lab/reference?spec=sapi&version=v2#error-bad-request"
            idInV2:
              summary: "A Salesforce Id was sent to a v2 filter"
              value:
                httpStatus: 400
                errorCode: "BAD_REQUEST"
                message: "projectKey must be a public key, the key field of a record from GET /sapi/projects. A Salesforce Id does not work in v2."
                correlationId: "123e4567-e89b-12d3-a456-426614174000"
                retryable: false
                help: "https://ryanbumstead.com/api-lab/reference?spec=sapi&version=v2#error-bad-request"
            badPersonaList:
              summary: "persona holds an unknown value"
              value:
                httpStatus: 400
                errorCode: "BAD_REQUEST"
                message: "persona must be Admin, Developer or Architect. To ask for more than one, separate them with commas."
                correlationId: "123e4567-e89b-12d3-a456-426614174000"
                retryable: false
                help: "https://ryanbumstead.com/api-lab/reference?spec=sapi&version=v2#error-bad-request"
            missingRequestId:
              summary: "X-Request-Id is missing on a SAPI route"
              value:
                httpStatus: 400
                errorCode: "BAD_REQUEST"
                message: "Send an X-Request-Id header holding a UUID, for example X-Request-Id: 3f1c9b2e-8d4a-4c1e-9b7f-2a6d5e4c3b1a. It lets a request be traced in the logs."
                correlationId: "123e4567-e89b-12d3-a456-426614174000"
                retryable: false
                help: "https://ryanbumstead.com/api-lab/reference?spec=sapi&version=v2#error-bad-request"

    Unauthorized:
      description: "No token, or a token that has ended. A caller on the site address with no token gets our error object with a Bearer challenge. A bad or ended token on the instance address is refused by the platform, which answers a JSON array and not our error object."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestIdResponse"
        WWW-Authenticate:
          description: Bearer, when the caller sent no token at all.
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/Error"
              - $ref: "#/components/schemas/PlatformErrorList"
          examples:
            noToken:
              summary: "A caller on the site address with no token (our envelope)"
              value:
                httpStatus: 401
                errorCode: "UNAUTHORIZED"
                message: "This route needs an evaluator token. Get one with POST https://ryan-bumstead-dev-ed.develop.my.site.com/portfoliovforcesite/services/apexrest/papi/auth/token and a JSON body with your email and a purpose. Then call /sapi/skills on the instance_url from that answer, with the header Authorization: Bearer <access_token>."
                correlationId: "123e4567-e89b-12d3-a456-426614174000"
                retryable: false
                help: "https://ryanbumstead.com/api-lab/reference?spec=sapi&version=v2#error-unauthorized"
            endedToken:
              summary: "A token that ended or was never valid (the platform answers before our code runs)"
              value:
                - errorCode: "INVALID_SESSION_ID"
                  message: "Session expired or invalid"

    Forbidden:
      description: "The caller may not run the class that serves this route. The platform refuses the call before our code runs and answers a JSON array and not our error object."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestIdResponse"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PlatformErrorList"
          examples:
            classAccess:
              summary: "The caller may not run the class that serves the route (the platform answers)"
              value:
                - errorCode: "FORBIDDEN"
                  message: "You do not have access to the Apex class named: SAPISkill"

    NotFound:
      description: "The route does not exist, or the key in the path matches no record."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestIdResponse"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            routeNotFound:
              summary: "There is no such route"
              value:
                httpStatus: 404
                errorCode: "NOT_FOUND"
                message: "There is no GET /sapi/nothing in this API. The routes are listed in the API reference."
                correlationId: "123e4567-e89b-12d3-a456-426614174000"
                retryable: false
                help: "https://ryanbumstead.com/api-lab/reference?spec=sapi&version=v2#error-not-found"
            switchedOff:
              summary: "The versionless URLs are switched off (the old /v1/ spelling is the only one)"
              value:
                httpStatus: 404
                errorCode: "NOT_FOUND"
                message: "Versionless URLs are switched off. Use /services/apexrest/sapi/v1/skills."
                correlationId: "123e4567-e89b-12d3-a456-426614174000"
                retryable: false
                help: "https://ryanbumstead.com/api-lab/reference?spec=sapi&version=v2#error-not-found"
            noSuchProject:
              summary: "No project has the key"
              value:
                httpStatus: 404
                errorCode: "NOT_FOUND"
                message: "No project has the key prj_nothere. GET /sapi/projects lists every project with its key. This path takes a key, not a Salesforce Id."
                correlationId: "123e4567-e89b-12d3-a456-426614174000"
                retryable: false
                help: "https://ryanbumstead.com/api-lab/reference?spec=sapi&version=v2#error-not-found"

    MethodNotAllowed:
      description: "SAPI takes GET only. The platform refuses any other method before our code runs and answers a JSON array and not our error object, with an Allow header."
      headers:
        Allow:
          description: The methods the route takes.
          schema:
            type: string
            example: "GET,HEAD"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PlatformErrorList"
          examples:
            wrongMethod:
              summary: "POST to a SAPI route"
              value:
                - errorCode: "METHOD_NOT_ALLOWED"
                  message: "HTTP Method 'POST' not allowed. Allowed are GET,HEAD"

    Gone:
      description: "API v1, or the old /v1/ URL, was retired. Send X-API-Version: v2, or call the versionless URL."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestIdResponse"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            versionRetired:
              summary: "API v1 was retired"
              value:
                httpStatus: 410
                errorCode: "GONE"
                message: "API v1 was retired on 2026-11-29. Send the header X-API-Version: v2 and call the same URL again."
                correlationId: "123e4567-e89b-12d3-a456-426614174000"
                retryable: false
                help: "https://ryanbumstead.com/api-lab/reference?spec=sapi&version=v2#error-gone"
            urlRetired:
              summary: "The /v1/ URL spelling was retired"
              value:
                httpStatus: 410
                errorCode: "GONE"
                message: "URLs with /v1/ were retired on 2026-11-29. Call /services/apexrest/sapi/skills instead. Nothing else about the request changes."
                correlationId: "123e4567-e89b-12d3-a456-426614174000"
                retryable: false
                help: "https://ryanbumstead.com/api-lab/reference?spec=sapi&version=v2#error-gone"

    TooManyRequests:
      description: "The rate limit was used up (ADR-025, ADR-028). Retry-After says how many seconds to wait."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestIdResponse"
        Retry-After:
          description: Seconds to wait before the same request can succeed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            tierLimit:
              summary: "The shared limit for the tier is used up"
              value:
                httpStatus: 429
                errorCode: "RATE_LIMIT_EXCEEDED"
                message: "This API allows 120 requests a minute on SAPI routes, shared by every evaluator. Wait 42 seconds and send the request again."
                correlationId: "123e4567-e89b-12d3-a456-426614174000"
                retryable: true
                help: "https://ryanbumstead.com/api-lab/reference?spec=sapi&version=v2#error-rate-limit-exceeded"
            busy:
              summary: "The counter row stayed locked"
              value:
                httpStatus: 429
                errorCode: "RATE_LIMIT_EXCEEDED"
                message: "The API is busy for a moment. Wait 1 second and send the request again."
                correlationId: "123e4567-e89b-12d3-a456-426614174000"
                retryable: true
                help: "https://ryanbumstead.com/api-lab/reference?spec=sapi&version=v2#error-rate-limit-exceeded"

    ServerError:
      description: "Something failed that the API did not plan for. The message holds the correlation id, and the detail is in the log under that id. No exception text is sent."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestIdResponse"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            unexpected:
              summary: "An unplanned failure"
              value:
                httpStatus: 500
                errorCode: "INTERNAL_SERVER_ERROR"
                message: "Something went wrong on our side, and it has been logged as 123e4567-e89b-12d3-a456-426614174000. Try again in a minute. If it keeps happening, send that id through ryanbumstead.com/contact."
                correlationId: "123e4567-e89b-12d3-a456-426614174000"
                retryable: true
                help: "https://ryanbumstead.com/api-lab/reference?spec=sapi&version=v2#error-internal-server-error"

  schemas:
    Error:
      type: object
      description: "The error object this API sends. The platform sends a JSON array instead for two refusals, see PlatformErrorList."
      required:
        - httpStatus
        - errorCode
        - message
        - correlationId
        - retryable
      properties:
        httpStatus:
          type: integer
          example: 400
        errorCode:
          type: string
          description: "Machine readable code. Program against this, not against the message."
          enum:
            - BAD_REQUEST
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - GONE
            - RATE_LIMIT_EXCEEDED
            - INTERNAL_SERVER_ERROR
          example: "BAD_REQUEST"
        message:
          type: string
          description: "What happened, what you need and how to get it, in plain sentences."
          example: "offset must be a whole number from 0 to 2000. The X-Total-Count header says how many records there are."
        correlationId:
          type: string
          format: uuid
          description: "Matches X-Request-Id, or the id the API made when none was sent."
          example: "123e4567-e89b-12d3-a456-426614174000"
        retryable:
          type: boolean
          description: "True only when the same request can succeed later with no change by the caller."
          example: false
        help:
          type: string
          format: uri
          description: "Link to this error code's entry in the Errors section of the API reference."
          example: "https://ryanbumstead.com/api-lab/reference?spec=sapi&version=v2#error-bad-request"

    PlatformErrorList:
      type: array
      description: "What the platform sends for a refusal that happens before our code runs: an ended token (401) or no access to the class (403). Not our error object."
      items:
        type: object
        required: [errorCode, message]
        properties:
          errorCode:
            type: string
            example: "INVALID_SESSION_ID"
          message:
