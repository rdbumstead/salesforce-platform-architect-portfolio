paths:
  /health:
    get:
      tags: [Monitoring]
      summary: Health Check
      description: |
        Shallow check: runtime availability, the current transaction's governor-limit snapshot and org time
        (`SAPIHealth.getHealth`, payload from `SAPIHealth.buildPayload`). `checkType` is always SHALLOW.
      operationId: getHealth
      responses:
        "200":
          description: Service is UP.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestIdResponse"
            Cache-Control:
              description: "No-cache for health checks."
              schema:
                type: string
                example: "no-store, no-cache"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /contacts:
    get:
      tags: [Profile]
      summary: Get Contact records
      description: Retrieves the primary contact details for the portfolio owner. Returns only the Contact flagged as the portfolio owner (`Is_Portfolio_Owner__c`).
      operationId: getContacts
      parameters:
        - $ref: "#/components/parameters/apiVersionParam"
        - $ref: "#/components/parameters/requestIdParam"
        - $ref: "#/components/parameters/contactNameParam"
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/offsetParam"
      responses:
        "200":
          description: Successful retrieval of Contact records.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestIdResponse"
            X-Total-Count:
              $ref: "#/components/headers/TotalCountResponse"
            X-Has-More:
              $ref: "#/components/headers/HasMoreResponse"
            Cache-Control:
              $ref: "#/components/headers/NoCacheResponse"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "410": { $ref: "#/components/responses/Gone" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }

  /experience:
    get:
      tags: [Profile]
      summary: Get Experience records
      description: Retrieves professional experience history.
      operationId: getExperience
      parameters:
        - $ref: "#/components/parameters/apiVersionParam"
