101828" text-anchor="middle">Find or create the Account</text><text x="480" y="173.05" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#101828" text-anchor="middle">from the business details</text><rect x="355.0" y="205.0" width="250" height="50" rx="6" fill="#FFFFFF" stroke="#667085" stroke-width="1.5"/><text x="480" y="226.05" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#101828" text-anchor="middle">Find or create the Contact</text><text x="480" y="243.05" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#101828" text-anchor="middle">from the personal details</text><rect x="355.0" y="275.0" width="250" height="50" rx="6" fill="#FFFFFF" stroke="#667085" stroke-width="1.5"/><text x="480" y="296.05" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#101828" text-anchor="middle">Link the Contact</text><text x="480" y="313.05" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#101828" text-anchor="middle">to the Account</text><polyline points="480,185.0 480,205.0" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/><polyline points="480,255.0 480,275.0" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/><polyline points="275.0,300 315,300 315,160 355.0,160" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/><rect x="670" y="100" width="280" height="455" rx="10" fill="#F8FAFC" stroke="#667085" stroke-width="1" stroke-dasharray="5 4"/><text x="684" y="122" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#475467" text-anchor="start">Case creation and routing</text><rect x="685.0" y="135.0" width="250" height="50" rx="6" fill="#FFFFFF" stroke="#667085" stroke-width="1.5"/><text x="810" y="156.05" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#101828" text-anchor="middle">Create