<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
<title id="t">Process flow, part 1: Initial inquiry and routing</title>
<desc id="d">An employer submits the web form. The hub finds or creates the Account and the Contact and links them, creates one Case for each kind of help asked for, routes each Case to a queue by the employer's industry and notifies the queue. A queue member reviews the Case, and its type decides the path in part 2. Redrawn for the portfolio from the original Employer Hub demo. No names and no real data.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker></defs>
<rect width="960" height="600" fill="#FFFFFF"/>
<text x="24" y="44" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#101828" text-anchor="start">Process flow, part 1: Initial inquiry and routing</text>
<text x="24" y="72" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#475467" text-anchor="start">From the web form to a reviewed Case in the right queue</text>
