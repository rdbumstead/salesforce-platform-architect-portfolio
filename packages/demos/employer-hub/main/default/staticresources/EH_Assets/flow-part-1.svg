2563EB" stroke-width="2" marker-end="url(#arrow)"/><polyline points="810,395.0 810,475" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/><polyline points="605.0,300 645,300 645,160 685.0,160" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/><text x="720" y="515" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2563EB" text-anchor="end">Part 2</text><text x="24" y="582" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#475467" text-anchor="start">Redrawn for the portfolio from the original Employer Hub demo. No names and no real data.</text>
