<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 860" width="960" height="860" role="img" aria-labelledby="t d">
<title id="t">Process flow, part 2: Monetary and service paths</title>
<desc id="d">A service request (a career event, advisory board, job posting or direct hire) is handled in the Service Request screen flow and the Case closes. A monetary request (a scholarship, partner investment, training or donation) is converted to an Opportunity and the Case closes. The Opportunity follows the sales stages until Closed Won, then an automation creates a Task for the contract, and the user creates the Contract with its file. Redrawn for the portfolio from the original Employer Hub demo. No names and no real data.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker></defs>
<rect width="960" height="860" fill="#FFFFFF"/>
<text x="24" y="44" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#101828" text-anchor="start">Process flow, part 2: Monetary and service paths</text>
<text x="24" y="72" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#475467" text-anchor="start">A reviewed Case becomes a service the education provider delivers or a monetary agreement</text>
