tem-ui, sans-serif" font-size="12" font-weight="400" fill="#101828" text-anchor="middle">The user gathers the details</text><text x="640" y="362.2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#101828" text-anchor="middle">(amount, close date)</text><rect x="505.0" y="388.0" width="270" height="44" rx="6" fill="#FFFFFF" stroke="#667085" stroke-width="1.5"/><text x="640" y="406.2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#101828" text-anchor="middle">The user runs</text><text x="640" y="422.2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#101828" text-anchor="middle">“Convert to Opportunity”</text><rect x="505.0" y="448.0" width="270" height="44" rx="6" fill="#FFFFFF" stroke="#667085" stroke-width="1.5"/><text x="640" y="474.2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#101828" text-anchor="middle">A new Opportunity is created</text><rect x="505.0" y="508.0" width="270" height="44" rx="6" fill="#FFFFFF" stroke="#667085" stroke-width="1.5"/><text x="640" y="526.2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#101828" text-anchor="middle">The Opportunity follows</text><text x="640" y="542.2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#101828" text-anchor="middle">the sales stages</text><polygon points="640,565.0 735.0,600 640,635.0 545.0,600" fill="#EFF4FF" stroke="#2563EB" stroke-width="1.5"/><text x="640" y="596.05" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#101828" text-anchor="middle">Stage is</text><text x="640" y="613.05" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#101828" text-anchor="middle">Closed Won?</text><rect x="505.0" y="648.0" width="270" height="44" rx="6" fill="#FFFFFF" stroke="#667085" stroke-width="1.5"/><text x="640" y="666.2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#101828" text-anchor="middle">An automation creates a Task</text><text x="640" y="682.2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#101828" text-anchor="middle">for the contract</text><rect x="505.0" y="705.0" width="270" height="40" rx="6" fill="#FFFFFF" stroke="#667085" stroke-width="1.5"/><text x="640" y="729.2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#101828" text-anchor="middle">The user clicks “Create Contract”</text><rect x="505.0" y="758.0" width="270" height="44" rx="6" fill="#FFFFFF" stroke="#667085" stroke-width="1.5"/><text x="640" y="776.2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#101828" text-anchor="middle">Contract details and the file are</text><text x="640" y="792.2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#101828" text-anchor="middle">added, and the Contract is created</text><rect x="795.0" y="448.0" width="130" height="44" rx="6" fill="#FFFFFF" stroke="#667085" stroke-width="1.5"/><text x="860" y="466.2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#101828" text-anchor="middle">Case status set</text><text x="860" y="482.2" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#101828" text-anchor="middle">to Closed</text><polyline points="775,410 860,410 860,448" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/><polyline points="690,281 690,310 640,310 640,328" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/><polyline points="640,372 640,388" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/><polyline points="640,432 640,448" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/><polyline points="640,492 640,508" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/><polyline points="640,552 640,565" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/><polyline points="545,600 480,600 480,530 505,530" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/><text x="488" y="592" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#475467" text-anchor="start">No</text><polyline points="640,635 640,648" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/><text x="650" y="642" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#475467" text-anchor="start">Yes</text><polyline points="640,692 640,705" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/><polyline points="640,745 640,758" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="842" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#475467" text-anchor="start">Redrawn for the portfolio from the original Employer Hub demo. No names and no real data.</text>
