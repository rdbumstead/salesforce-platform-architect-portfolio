<title id="t">Operations dashboard</title>
<desc id="d">Redrawn with sample values. A donut chart of new inquiries by queue across three academic focus areas, 22 in all, and a table of neglected inquiries with the queue, the employer, the subject, the date opened and the age in days. Redrawn for the portfolio from the original Employer Hub demo. No names and no real data.</desc>
