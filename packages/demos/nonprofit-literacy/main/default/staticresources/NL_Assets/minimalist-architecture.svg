<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-labelledby="nl-title nl-desc">
  <title id="nl-title">Minimalist architecture, redrawn from public object names</title>
  <desc id="nl-desc">Object model for the literacy program platform. NPSP holds the Household Account and Contact. The Program Management Module holds Program, Program Cohort, Program Engagement, Service, Service Schedule, Service Session, Service Participant and Service Delivery. Three custom objects, Assessment, Employment and Partner Referral, hang off Contact. Volunteers for Salesforce holds Volunteer Job, Shift and Hours. Arrows point from a child record to its parent.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#344054"/>
    </marker>
    <style>
      .frame { fill: #F9FAFB; stroke: #D0D5DD; stroke-width: 1.5; }
      .group { font: 600 14px Inter, system-ui, sans-serif; fill: #344054; }
      .box { fill: #FFFFFF; stroke: #2563EB; stroke-width: 1.5; }
      .custom { fill: #FFFFFF; stroke: #92400E; stroke-width: 1.5; stroke-dasharray: 5 3; }
      .name { font: 600 14px Inter, system-ui, sans-serif; fill: #101828; text-anchor: middle; }
      .sub { font: 400 11px Inter, system-ui, sans-serif; fill: #475467; text-anchor: middle; }
      .edge { fill: none; stroke: #344054; stroke-width: 1.3; marker-end: url(#arrow); }
      .title { font: 700 18px Inter, system-ui, sans-serif; fill: #101828; }
      .note { font: 400 12px Inter, system-ui, sans-serif; fill: #475467; }
    </style>
  </defs>
  <rect x="0" y="0" width="1000" height="660" fill="#FFFFFF"/>
  <text class="title" x="20" y="34">Minimalist architecture, redrawn from public object names</text>

  <rect class="frame" x="20" y="70" width="210" height="220" rx="12"/>
  <text class="group" x="34" y="94">NPSP</text>
  <rect class="frame" x="20" y="320" width="210" height="260" rx="12"/>
  <text class="group" x="34" y="344">Custom objects</text>
  <rect class="frame" x="270" y="70" width="500" height="470" rx="12"/>
  <text class="group" x="284" y="94">Program Management Module</text>
  <rect class="frame" x="790" y="70" width="190" height="362" rx="12"/>
  <text class="group" x="804" y="94">Volunteers for Salesforce</text>
  <text class="note" x="804" y="420">Deferred at first</text>

  <rect class="box" x="40" y="110" width="170" height="48" rx="8"/>
  <text class="name" x="125" y="131">Account</text>
  <text class="sub" x="125" y="148">Household record type</text>
  <rect class="box" x="40" y="230" width="170" height="44" rx="8"/>
  <text class="name" x="125" y="257">Contact</text>

  <rect class="custom" x="40" y="380" width="170" height="44" rx="8"/>
  <text class="name" x="125" y="407">Assessment</text>
  <rect class="custom" x="40" y="450" width="170" height="44" rx="8"/>
  <text class="name" x="125" y="477">Employment</text>
  <rect class="custom" x="40" y="520" width="170" height="44" rx="8"/>
  <text class="name" x="125" y="547">Partner Referral</text>

  <rect class="box" x="300" y="110" width="170" height="44" rx="8"/>
  <text class="name" x="385" y="137">Program</text>
  <rect class="box" x="300" y="230" width="170" height="44" rx="8"/>
  <text class="name" x="385" y="257">Program Cohort</text>
  <rect class="box" x="300" y="350" width="170" height="44" rx="8"/>
  <text class="name" x="385" y="377">Program Engagement</text>
  <rect class="box" x="300" y="470" width="170" height="44" rx="8"/>
  <text class="name" x="385" y="497">Service Delivery</text>

  <rect class="box" x="560" y="110" width="170" height="44" rx="8"/>
  <text class="name" x="645" y="137">Service</text>
  <rect class="box" x="560" y="230" width="170" height="44" rx="8"/>
  <text class="name" x="645" y="257">Service Schedule</text>
  <rect class="box" x="560" y="350" width="170" height="44" rx="8"/>
  <text class="name" x="645" y="377">Service Session</text>
  <rect class="box" x="560" y="470" width="170" height="44" rx="8"/>
  <text class="name" x="645" y="497">Service Participant</text>

  <rect class="box" x="810" y="110" width="150" height="44" rx="8"/>
  <text class="name" x="885" y="137">Volunteer Job</text>
  <rect class="box" x="810" y="230" width="150" height="44" rx="8"/>
  <text class="name" x="885" y="257">Shift</text>
  <rect class="box" x="810" y="350" width="150" height="44" rx="8"/>
  <text class="name" x="885" y="377">Hours</text>

  <path class="edge" d="M125 230 V160"/>
  <path class="edge" d="M40 402 H28 V252 H38"/>
  <path class="edge" d="M40 472 H28 V252"/>
  <path class="edge" d="M40 542 H28 V252"/>
  <path class="edge" d="M385 230 V156"/>
  <path class="edge" d="M385 350 V276"/>
  <path class="edge" d="M300 372 L212 262"/>
  <path class="edge" d="M560 132 H472"/>
  <path class="edge" d="M645 230 V156"/>
  <path class="edge" d="M645 350 V276"/>
  <path class="edge" d="M730 492 H750 V252 H732"/>
  <path class="edge" d="M560 482 L472 386"/>
  <path class="edge" d="M385 470 V396"/>
  <path class="edge" d="M470 482 L560 386"/>
  <path class="edge" d="M300 480 L212 268"/>
  <path class="edge" d="M885 230 V156"/>
  <path class="edge" d="M885 350 V276"/>
  <path class="edge" d="M885 394 V610 H245 V262 H212"/>

  <text class="note" x="20" y="636">Arrows point from a child record to its parent. Dashed boxes are custom objects. Donations and state reporting stay in external systems.</text>
</svg>
