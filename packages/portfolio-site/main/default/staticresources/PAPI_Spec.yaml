openapi: 3.0.0
info:
  title: Portfolio Process API (PAPI)
  version: 1.3.0
  description: |
    A Process API (PAPI) responsible for orchestrating, transforming, and filtering data 
    from the Salesforce System API (SAPI) for consumption by the Portfolio frontend.

    ### 1. Authentication Strategy
    - **Callers → PAPI**: OAuth 2.0 **Client Credentials** issued by the Portfolio API External Client App; `Authorization: Bearer <token>` on every request (ADR-027). The platform rejects unauthenticated calls before Apex executes.
    - **Site (API Lab)**: `c-api-tester` calls an Apex proxy that obtains its token through the `Portfolio_API` Named Credential; no secret reaches the browser.
    - **External evaluators**: `POST /auth/token` vends a short-lived token (ADR-028). It is the only unauthenticated path, and the only path served on the Experience Cloud site domain (see its `servers` entry). Every other path is called on My Domain with the Bearer token.
    - **PAPI → SAPI**: in-process Apex (same transaction), not HTTP; see ADR-025 for why fan-out callouts were rejected.

    ### 2. Versioning Strategy
    - **Pattern**: Header-based versioning takes precedence.
    - **Header**: `X-API-Version: v1`. A missing header resolves to `v1`; any other value returns `400 BAD_REQUEST` with message `Unsupported X-API-Version` (ADR-026).
    - **Correlation**: a missing `X-Request-Id` is replaced by a generated UUID, and a present but non-UUID value returns `400 BAD_REQUEST`. On My Domain the platform injects its own 32-character hex id when the caller sends none, and PAPI treats that value as missing. Both headers are on every response (`ApiRequestContext.applyRequestRules`): the platform echoes whatever `X-Request-Id` the request carries, its own included, and Apex sets the header only when it generated the value and the request carried none, so the header appears once (ADR-026). When the platform injected its id, the header carries that id and an error body's `correlationId` carries the generated UUID. Send your own UUID to get one predictable id.
    - **URL**: Version segments removed from base path to align with SAPI ADR.

    ### 3. Rate Limiting & Aggregation Math
    - **SAPI Limit**: 120 requests/minute.
    - **PAPI Aggregation**: A single `/profile/full` call triggers ~8 upstream SAPI calls.
    - **PAPI Limit**: Restricted to **15 requests/minute** (Standard Tier) to prevent cascading rate limit violations on SAPI (15 * 8 = 120).
    - **Enforcement**: `RateWindowLimiter` (ADR-025), one `API_Rate_Window__c` row per caller key per fixed UTC calendar minute. The caller key is `{tier}:{SHA-256 hex of the session id}`, or `{tier}:{user id}` when the session id is null. Tiers: `papi` 15, `papi-ai` (`/ai/*`) 10. Every token from `POST /auth/token` is the same session, so all evaluators share one key per tier and one limit (SAPI 120, PAPI 15, `/ai/*` 10 per minute, ADR-028). `POST /auth/token` is also limited to 15 requests per minute per email and source IP.

    ### 4. Caching Strategy (Aggregation Logic)
    *Note: PAPI cannot pass SAPI headers verbatim due to mixed sensitivity in aggregated payloads.*
    - **Rule**: Strictest policy wins.
      1. If *any* upstream resource is `no-store` (e.g., Contact) → PAPI response is `no-store`.
      2. If *any* upstream resource is `private` → PAPI response is `private`.
      3. Otherwise → PAPI response is `public` with the minimum `max-age`.

    ### 5. Field Mapping (Transformation Layer)
    | Object | SAPI Field | PAPI Field | Logic |
    | :--- | :--- | :--- | :--- |
    | Contact | `name` | `fullName` | Rename |
    | Experience | `name` | `role` | Semantic Rename |
    | Certification | `earnedDate` | `dateEarned` | JS Convention |
    | Project | `dateCompleted` | `completionDate` | JS Convention |
    | Project | `heroImageUrl` | `heroImageUrl` | Passthrough |

  x-api-layer: process
  contact:
    name: Ryan Bumstead
    email: ryan@ryanbumstead.com
    url: https://ryanbumstead.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://{domain}/services/apexrest/papi/v1
    description: |
      Salesforce My Domain (authenticated Apex REST). Bearer-token callers use the `instance_url`
      returned with their token. `POST /auth/token` overrides this with the site domain.
    variables:
      domain:
        default: ryan-bumstead-dev-ed.develop.my.salesforce.com
        description: The org's My Domain host.
        enum:
          - ryan-bumstead-dev-ed.develop.my.salesforce.com

# Global Rate Limits (Aligned to SAPI capacity)
x-rate-limit:
  description: "Enforced in Apex by RateWindowLimiter (ADR-025), a custom-object counter: one API_Rate_Window__c row per caller key per fixed UTC calendar minute. The caller key is {tier}:{SHA-256 hex of the session id}, or {tier}:{user id} when the session id is null. Every response carries X-RateLimit-Limit and X-RateLimit-Remaining. Request limit + 1 within the minute gets 429 RATE_LIMIT_EXCEEDED with Retry-After set to the seconds left in the minute. Rejected requests count. Every vended evaluator token is the same session, so all evaluators share one key and one limit per tier. Evaluator token vending adds a per-email and source IP limit and a daily cap (ADR-028)."
  tiers:
    standard:
      requestsPerMinute: 15
      description: "Conservative limit to protect SAPI (1 PAPI req = 8 SAPI reqs)"
    ai:
      requestsPerMinute: 10
      description: "Expensive Generative AI calls (/ai/*)"
    token:
      requestsPerMinute: 15
      description: "POST /auth/token, per email and source IP (the Token_Requests_Per_Minute setting, default 15)"

security:
  - OAuth2ClientCredentials:
      - api

tags:
  - name: Orchestration
    description: Endpoints that aggregate multiple SAPI calls
  - name: Transformation
    description: Endpoints that transform SAPI data into new formats
  - name: Logic
    description: Endpoints that apply business rules and filtering
  - name: Monitoring
    description: Health checks and observability
  - name: Access
    description: Evaluator token vending (ADR-028)

components:
  securitySchemes:
    OAuth2ClientCredentials:
      type: oauth2
      description: |
        OAuth 2.0 Client Credentials flow issued by the Portfolio API External Client App (ADR-027).
        Tokens run as the read-only integration user. External evaluators obtain a short-lived token
        from `POST /auth/token` (ADR-028) instead of holding the consumer secret. Every
        evaluator receives the same session, so all evaluators share one rate limit per tier.
      flows:
        clientCredentials:
          tokenUrl: https://ryan-bumstead-dev-ed.develop.my.salesforce.com/services/oauth2/token
          scopes:
            api: Access Salesforce REST APIs as the integration user

  parameters:
    RequestIdParam:
      name: X-Request-Id
      in: header
      required: false
      description: Correlation ID. When missing, or when it is the platform's own 32-character hex id, a generated UUID is used as the correlation id. A present but non-UUID value returns 400 BAD_REQUEST (ADR-026).
      schema:
        type: string
        format: uuid

    ApiVersionParam:
      name: X-API-Version
      in: header
      required: false
      description: API Version. Missing resolves to v1; any other value returns 400 BAD_REQUEST with message 'Unsupported X-API-Version' (ADR-026).
      schema:
        type: string
        default: v1
        example: v1

  headers:
    RequestIdHeader:
      description: Correlation ID for distributed tracing. A valid caller-supplied value is echoed by the platform; Apex sets the header only when it generated the value.
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request parameters
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestIdHeader"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            httpStatus: 400
            errorCode: "BAD_REQUEST"
            message: "Invalid persona value."
            correlationId: "123e4567-e89b-12d3-a456-426614174000"
            retryable: false

    Unauthorized:
      description: Missing, expired, or invalid Bearer token (rejected by the platform before Apex executes)
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestIdHeader"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            httpStatus: 401
            errorCode: "UNAUTHORIZED"
            message: "Missing or invalid Bearer token"
            correlationId: "123e4567-e89b-12d3-a456-426614174000"
            retryable: false

    TooManyRequests:
      description: Rate limit exceeded (ADR-025, ADR-028)
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestIdHeader"
        Retry-After:
          schema:
            type: integer
          description: Seconds left in the current calendar minute, or 1 when the counter row stayed locked past the platform wait.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            httpStatus: 429
            errorCode: "RATE_LIMIT_EXCEEDED"
            message: "Rate limit exceeded. Retry after 42 seconds."
            correlationId: "123e4567-e89b-12d3-a456-426614174000"
            retryable: true

    InternalServerError:
      description: Internal PAPI error or SAPI communication failure
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestIdHeader"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            httpStatus: 500
            errorCode: "INTERNAL_SERVER_ERROR"
            message: "Failed to aggregate profile data. Partial SAPI failure."
            correlationId: "123e4567-e89b-12d3-a456-426614174000"
            retryable: true
            details:
              failedSapiCalls:
                - endpoint: "/experience-skills"
                  error: "Connection timeout"

    ServiceUnavailable:
      description: PAPI or downstream SAPI is unavailable
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestIdHeader"
        Retry-After:
          description: Seconds until service may be available
          schema:
            type: integer
            example: 30
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            httpStatus: 503
            errorCode: "SERVICE_UNAVAILABLE"
            message: "Downstream SAPI is currently unavailable"
            correlationId: "123e4567-e89b-12d3-a456-426614174000"
            retryable: true

  schemas:
    # --- Error Schema ---
    Error:
      type: object
      required:
        - httpStatus
        - errorCode
        - message
        - correlationId
        - retryable
      properties:
        httpStatus:
          type: integer
          example: 500
        errorCode:
          type: string
          example: "INTERNAL_SERVER_ERROR"
        message:
          type: string
          example: "An unexpected error occurred"
        correlationId:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        retryable:
          type: boolean
          description: Indicates if the client should retry the request
          example: true
        details:
          type: object
          description: Additional error context (optional)
          additionalProperties: true

    # --- Health Schema ---
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [UP, DOWN, DEGRADED]
          example: "UP"
        checkType:
          type: string
          enum: [SHALLOW, DEEP]
          example: "DEEP"
        timestamp:
          type: string
          format: date-time
        dependencies:
          type: object
          properties:
            sapi:
              type: string
              enum: [UP, DOWN]
              example: "UP"
            credential:
              type: string
              enum: [UP, DOWN]
              example: "UP"
              description: "UP only when a GET through the Portfolio_API Named Credential to /sapi/v1/health returns HTTP 200."
            jira:
              type: string
              enum: [CONFIGURED, MISSING, UNKNOWN]
              description: "Presence of the Jira_API Named Credential; UNKNOWN when NamedCredential cannot be read."
            github:
              type: string
              enum: [CONFIGURED, MISSING, UNKNOWN]
              description: "Presence of the GitHub_API Named Credential."
            gemini:
              type: string
              enum: [CONFIGURED, MISSING, UNKNOWN]
              description: "Presence of the Gemini_API Named Credential."
        details:
          type: object
          additionalProperties:
            type: string
          description: 'Diagnostic per dependency, e.g. credential: "HTTP 401" or an exception type name.'

    # --- Orchestrated Response Objects ---
    FullPortfolioPayload:
      type: object
      description: The master payload for initial app load
      required:
        - config
        - contactInfo
        - skills
        - experience
        - projects
        - certifications
        - education
        - testimonials
      properties:
        config:
          $ref: "#/components/schemas/PortfolioConfig"
        contactInfo:
          $ref: "#/components/schemas/ContactDetail"
        summary:
          type: string
          description: Auto-generated professional summary
          example: "Salesforce Platform Architect with nearly a decade on the platform, focused on higher education"
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillSummary"
        experience:
          type: array
          items:
            $ref: "#/components/schemas/EnrichedExperience"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/EnrichedProject"
        certifications:
          type: array
          items:
            $ref: "#/components/schemas/EnrichedCertification"
        education:
          type: array
          items:
            $ref: "#/components/schemas/SimpleEducation"
        testimonials:
          type: array
          items:
            $ref: "#/components/schemas/EnrichedTestimonial"
        integrityNote:
          type: string
          description: '"complete", or "partial: <sections> unavailable" naming each upstream section that could not be read (e.g. "partial: certifications unavailable").'
          example: "complete"

    ProfileSummary:
      type: object
      required:
        - contactInfo
        - skills
        - experience
        - certifications
        - education
      properties:
        contactInfo:
          $ref: "#/components/schemas/ContactDetail"
        summary:
          type: string
          description: Calculated summary based on experience
          example: "Salesforce Platform Architect with nearly a decade on the platform, focused on higher education"
        skills:
          type: array
          items:
            $ref: "#/components/schemas/SkillSummary"
        experience:
          type: array
          items:
            $ref: "#/components/schemas/EnrichedExperience"
        certifications:
          type: array
          items:
            $ref: "#/components/schemas/EnrichedCertification"
        education:
          type: array
          items:
            $ref: "#/components/schemas/SimpleEducation"
        integrityNote:
          type: string
          description: '"complete", or "partial: <sections> unavailable" naming each upstream section that could not be read (e.g. "partial: certifications unavailable").'
          example: "complete"

    EnrichedExperience:
      type: object
      description: Work Experience enriched with related Skills and Highlights
      required:
        - id
        - employer
        - dateRange
      properties:
        id:
          type: string
          description: Salesforce Record ID (18-char)
          example: "a025e00000B2O3DAAV"
        employer:
          type: string
          example: "Salesforce"
        role:
          type: string
          example: "Senior Technical Architect"
          nullable: true
        dateRange:
          type: string
          description: Formatted as "MMM YYYY - MMM YYYY" or "MMM YYYY - Present"
          example: "Jan 2023 - Present"
        isCurrent:
          type: boolean
          example: true
          nullable: true
        isRemote:
          type: boolean
          example: true
          nullable: true
        skillsUsed:
          type: array
          description: Skills derived from ExperienceSkill junction
          items:
            type: string
            example: "LWC"
        highlights:
          type: array
          description: Selected bullet points (filtered by persona if applicable)
          items:
            type: string
            example: "Implemented CI/CD pipelines using GitHub Actions"

    EnrichedProject:
      type: object
      description: Project enriched with Skills and Assets
      required:
        - id
      properties:
        id:
          type: string
          example: "a015e00000B2O3DAAV"
        title:
          type: string
          example: "Portfolio Site"
          nullable: true
        challenge:
          type: string
          example: "Display skills dynamically to recruiters"
        solution:
          type: string
          example: "Built on LWR with SAPI/PAPI architecture"
        businessValue:
          type: string
          example: "Increased interview rate by 40%"
        status:
          type: string
          description: "Project Status (e.g., Live, Archived)"
          nullable: true
          example: "Live – In Production"
        completionDate:
          type: string
          format: date
          description: "Mapped from SAPI dateCompleted"
          example: "2025-12-01"
          nullable: true
        heroImageUrl:
          type: string
          format: uri
          description: URL of the main display image. Matches SAPI field name.
          example: "https://example.com/images/hero.png"
        liveUrl:
          type: string
          format: uri
          example: "https://example.com/portfolio"
        repositoryUrl:
          type: string
          format: uri
          example: "https://example.com/source"
        technologies:
          type: array
          description: Skill names from ProjectSkill junction
          items:
            type: string
            example: "Apex"
        pillarLabel:
          type: string
          description: "The strategic pillar and pillar description (e.g. Pillar A: Business Architecture)"
          example: "Pillar A: Business Architecture"
          nullable: true
        assets:
          type: array
          description: Images, videos, or links related to the project
          items:
            type: object
            required:
              - type
              - url
            properties:
              type:
                type: string
                enum: [Image, Video, Document, Link]
                example: "Image"
              url:
                type: string
                format: uri
                example: "https://example.com/images/diagram.png"
              caption:
                type: string
                example: "System Architecture Diagram"

    EnrichedTestimonial:
      type: object
      required:
        - id
        - author
        - quote
      properties:
        id:
          type: string
          example: "a055e00000B2O3DAAV"
        author:
          type: string
          example: "Jane Doe"
        title:
          type: string
          example: "VP of Engineering"
        relationship:
          type: string
          enum: [Manager, Peer, Client, Recruiter, Fan]
          example: "Manager"
        quote:
          type: string
          example: "Ryan is a beast at architecture"
        vibe:
          type: string
          enum: [Professional, Casual]
          example: "Professional"
        avatarUrl:
          type: string
          format: uri
          example: "https://example.com/images/avatar.jpg"

    # --- Basic DTOs ---
    PortfolioConfig:
      type: object
      description: Public configuration. The owner's email and phone are never returned.
      properties:
        linkedInUrl:
          type: string
          format: uri
          example: "https://linkedin.com/in/ryanbumstead"
        calendlyUrl:
          type: string
          format: uri
          example: "https://example.com/schedule"
        githubUrl:
          type: string
          format: uri
          example: "https://example.com/source"
        trailheadUrl:
          type: string
          format: uri
          example: "https://example.com/trailhead"
        personalWebsiteUrl:
          type: string
          format: uri
          example: "https://ryanbumstead.com"
        careerObjective:
          type: string
          description: Short professional bio/objective
          example: "Driving digital transformation through architecture."
        jiraProjectKey:
          type: string
          description: Key for Jira integration
          example: "SPAP"
        gitHubRepoPath:
          type: string
          description: GitHub Owner/Repo path
          example: "rdbumstead/salesforce-portfolio"

    ContactDetail:
      type: object
      description: Simplified contact information for the header. No email or phone is returned.
      required:
        - fullName
      properties:
        id:
          type: string
          example: "0035e00000B2O3DAAV"
        fullName:
          type: string
          example: "Ryan Bumstead"
        title:
          type: string
          example: "Platform Architect"
          nullable: true
        linkedIn:
          type: string
          format: uri
          example: "https://linkedin.com/in/ryanbumstead"
        github:
          type: string
          format: uri
          example: "https://example.com/source"
        trailhead:
          type: string
          format: uri
          example: "https://example.com/trailhead"
        portfolioUrl:
          type: string
          format: uri
          example: "https://ryanbumstead.com"
        bio:
          type: string
          description: The 'Career Objective' from Salesforce
          example: "Specializing in API-led connectivity..."

    SkillSummary:
      type: object
      description: Lightweight skill object for list views
      required:
        - id
        - name
        - category
        - proficiency
      properties:
        id:
          type: string
          example: "a075e00000B2O3DAAV"
        name:
          type: string
          example: "Apex"
        displayName:
          type: string
          description: Prefer this over 'name' for UI rendering if present
          example: "Salesforce Apex"
        category:
          type: string
          example: "Backend"
        proficiency:
          type: number
          description: 1-5 score
          example: 5
        iconName:
          type: string
          description: SLDS Icon reference
          example: "utility:code"
        colorHex:
          type: string
          description: Brand color for the category
          example: "#0070d2"
        categoryOrder:
          type: number
          description: Order to display the category in the UI
          example: 10

    EnrichedCertification:
      type: object
      description: Certification with associated skills
      required:
        - id
        - name
        - issuer
        - dateEarned
      properties:
        id:
          type: string
          example: "a105e00000B2O3DAAV"
        name:
          type: string
          example: "Certified Application Architect"
        issuer:
          type: string
          example: "Salesforce"
        dateEarned:
          type: string
          format: date
          example: "2024-05-15"
        skillsUsed:
          type: array
          description: Derived from CertificationSkill junction
          items:
            type: string
            example: "Security"

    SimpleEducation:
      type: object
      description: Educational background
      required:
        - id
        - school
        - degree
        - year
      properties:
        id:
          type: string
          example: "a115e00000B2O3DAAV"
        school:
          type: string
          example: "Creighton University"
        degree:
          type: string
          example: "B.S. Computer Science"
        fieldOfStudy:
          type: string
          example: "Computer Science"
        year:
          type: string
          description: Graduation Year derived from Graduation Date
          example: "2018"
        gpa:
          type: number
          nullable: true
          example: 3.8

    TokenRequest:
      type: object
      required:
        - email
        - purpose
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          example: "reviewer@example.com"
        purpose:
          type: string
          maxLength: 280
          description: Free-text reason, stored on the audit record.
          example: "Evaluating API contract parity"

    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - instance_url
      properties:
        access_token:
          type: string
          description: >-
            OAuth 2.0 Bearer token bound to the read-only integration user. It is the integration
            user's current session, shared by every evaluator, and it ends after 30 minutes without
            use (the integration profile's idle timeout). The response carries no expires_in,
            because the token endpoint reports no expiry and a fixed number would be a guess.
        token_type:
          type: string
          enum: [Bearer]
        instance_url:
          type: string
          format: uri
          description: The My Domain root, as returned by the token endpoint. Append `/services/apexrest/sapi/v1/...` or `/services/apexrest/papi/v1/...` and send the token as a Bearer credential.
          example: "https://ryan-bumstead-dev-ed.develop.my.salesforce.com"
        docs:
          type: string
          format: uri
          description: Link to the rendered API documentation.
          example: "https://rdbumstead.github.io/salesforce-platform-architect-portfolio/api/oas/salesforce-sapi"

paths:
  /health:
    get:
      summary: PAPI Health Check
      description: |
        Deep health check (`PAPIHealth.getHealth`). Reads SAPI health in-process (`SAPIHealth.buildPayload`),
        exercises the `Portfolio_API` Named Credential with one GET to `/sapi/v1/health` (`credential` is UP
        only on HTTP 200), and reports presence of the `Jira_API`, `GitHub_API` and `Gemini_API` Named
        Credentials without calling them. `status` is DOWN when SAPI is down, DEGRADED when the credential is
        down or any Named Credential is not CONFIGURED, otherwise UP. Always returns 200.
      operationId: getHealth
      tags:
        - Monitoring
      responses:
        "200":
          description: Service is healthy
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestIdHeader"
            Cache-Control:
              schema:
                type: string
                example: "no-store, no-cache"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/token:
    servers:
      - url: https://{domain}/portfoliovforcesite/services/apexrest/papi/v1
        description: Experience Cloud site domain. Apex REST is served to the guest user under `/portfoliovforcesite/services/apexrest/`.
        variables:
          domain:
            default: ryan-bumstead-dev-ed.develop.my.site.com
            description: The Salesforce Experience Cloud domain.
            enum:
              - ryan-bumstead-dev-ed.develop.my.site.com
    post:
      summary: Request an evaluator access token
      description: |
        Vends a short-lived OAuth 2.0 Bearer token so external reviewers can call the SAPI and PAPI
        without holding the External Client App consumer secret (ADR-028). `PAPIAuthToken.requestToken`
        hands the attempt to `TokenExchangeService.requestToken`, which validates it, applies the limits,
        then runs the client-credentials exchange server-side through the `Portfolio_API_Token` Named
        Credential (`TokenExchangeService.exchangeToken`). Tokens run as the read-only integration user
        and end with its session, after 30 minutes without use. While that session is valid, every
        exchange returns the same token, so all evaluators share one token and one rate limit per tier
        (SAPI 120, PAPI 15, `/ai/*` 10 per minute). The response has no `expires_in`: the token
        endpoint reports no expiry, and the session's end depends on use.

        - **400 BAD_REQUEST**: the body is not a JSON object of strings; `email` is blank, longer than 254
          characters or not an address; `purpose` is blank or longer than 280 characters; or a header rule
          from `ApiRequestContext` fails.
        - **429 RATE_LIMIT_EXCEEDED** with `Retry-After`: the PAPI tier limit (15 per minute per caller
          key), or 15 requests per minute per email and source IP
          (key `papi-token:{SHA-256 hex of lowercase(email)|sourceIp}`). On the email and IP limit,
          `X-RateLimit-Limit` and `X-RateLimit-Remaining` describe that limit.
        - **503 SERVICE_UNAVAILABLE** (retryable): the daily cap is reached (`Retry-After` is the seconds to
          the next midnight in the running user's time zone; the cap counts audit rows with outcome
          `Issued` created today, from `Portfolio_Config__mdt.Token_Daily_Cap__c`, default 50); the
          credential is missing or not granted ("Token issuance is not configured."); or the token endpoint
          fails ("Token issuance is temporarily unavailable.").
        - Every attempt writes one `API_Access_Request__c` row. Every response is `no-store, no-cache`.

        This is the only path served on the Experience Cloud site domain, not on My Domain:
        `POST https://ryan-bumstead-dev-ed.develop.my.site.com/portfoliovforcesite/services/apexrest/papi/v1/auth/token`.
      operationId: requestEvaluatorToken
      security: []
      tags:
        - Access
      parameters:
        - $ref: "#/components/parameters/RequestIdParam"
        - $ref: "#/components/parameters/ApiVersionParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
            example:
              email: "reviewer@example.com"
              purpose: "Evaluating API contract parity"
      responses:
        "200":
          description: Token issued
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestIdHeader"
            Cache-Control:
              schema:
                type: string
                example: "no-store, no-cache"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /profile/full:
    get:
      tags:
        - Orchestration
      summary: Get Complete Portfolio State
      description: |
        The "Hydration" endpoint. Returns the entire portfolio state in a single call.

        **Parallel Execution Strategy**:
        The following groups are executed in parallel:
        1. **Config Group**: `/portfolio-config`, `/contacts`
        2. **Work History Group**: `/experience`, `/education`, `/certifications`
        3. **Portfolio Group**: `/projects`, `/skills`, `/testimonials`

        *Note*: Junction object calls (e.g., `/project-skills`) are dependent on their parent calls and execute sequentially *within* their group.

        **Architecture Strategies**:
        1. **Recursive Pagination**: Consumes `X-Has-More` from SAPI to fetch all pages.
        2. **Partial Failure Tolerance**: "Best Effort" aggregation. 
           - **Timeout**: 3 seconds per group.
           - If a group fails, the main response returns `200 OK` with empty arrays for that section and `X-Data-Integrity: partial`.
        3. **Smart Caching**: Applies strictest upstream cache policy.
      operationId: getFullPortfolio
      parameters:
        - $ref: "#/components/parameters/RequestIdParam"
        - $ref: "#/components/parameters/ApiVersionParam"
      responses:
