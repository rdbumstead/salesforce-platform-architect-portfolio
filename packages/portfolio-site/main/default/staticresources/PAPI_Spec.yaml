  /resume/generate:
    get:
      tags:
        - Transformation
      summary: Generate Plain Text Resume
      description: |
        Generates an ATS-optimized plain text resume. 

        **SAPI Calls**:
        - `GET /contacts`
        - `GET /experience`
        - `GET /experience-highlights?persona={persona}` - Filters bullets by target audience
        - `GET /skills`
        - `GET /certifications`
        - `GET /education`

        **Transformation Logic**:
        - Formats dates as "MMM YYYY - MMM YYYY" or "MMM YYYY - Present"
        - Lists the skills linked to the printed roles, each once, grouped by category in category order and strongest first within a category
        - Prints up to 10 roles, current first
        - Prints at most 5 highlights per role, in sort order, as stored

        **Persona Filtering**:
        - `Admin`: System Admin highlights only
        - `Developer`: Development highlights only
        - `Architect`: Architecture/Design highlights only
        - Skills follow the same persona: a skill prints when its persona tags include the persona, and a skill with no persona tag prints under every persona. With no persona, every linked skill prints. The site's resume page uses the same rule.

        **SAPI Mapping**:
        - PAPI persona values are passed directly to SAPI `/experience-highlights?persona={value}`
        - If persona is omitted, all highlights are returned (no filtering)

        **Response format**:
        - When the first media type in the `Accept` header is `text/plain`, a 200 answer is the generated text alone, with `Content-Type: text/plain; charset=UTF-8`. Parameters after a semicolon are ignored and the header name matches in any case.
        - With no `Accept` header, `*/*`, `application/json` or any other first type, the answer is the JSON object below.
        - Every other response header, the rate count and the cache directive are the same in both forms. Errors are always JSON, whatever `Accept` says.
        - Example: `curl -H "Authorization: Bearer $TOKEN" -H "Accept: text/plain" "$INSTANCE_URL/services/apexrest/papi/v1/resume/generate?persona=Architect"`
      operationId: generateResume
      parameters:
        - $ref: "#/components/parameters/RequestIdParam"
        - $ref: "#/components/parameters/ApiVersionParam"
        - name: persona
          in: query
          required: false
          description: |
            Target audience for the resume. Omit for all highlights and all skills. With a persona, skills tagged for it and every untagged skill are kept.

            **Note**: This value is passed directly to SAPI's persona filter.
          schema:
            type: string
            enum: [Admin, Developer, Architect]
      responses:
        "200":
          description: The formatted resume text, as a JSON object by default, or as plain text when the first media type in `Accept` is `text/plain`
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestIdHeader"
            X-Data-Integrity:
              schema:
                type: string
                enum: [complete, partial]
            Cache-Control:
              schema:
                type: string
                example: "no-store, no-cache"
          content:
            application/json:
              schema:
                type: object
                required:
                  - generatedText
                  - persona
                  - generatedAt
                properties:
                  integrityNote:
                    type: string
                    description: '"complete", or "partial: <sections> unavailable" naming each upstream section that could not be read.'
                    example: "complete"
                  generatedText:
                    type: string
                    description: The complete, formatted resume string ready for clipboard copy
                    example: |
                      Ryan Bumstead
                      Salesforce Platform Architect

                      EXPERIENCE

                      Salesforce | Senior Technical Architect
                      Jan 2023 - Present
                      - Designed multi-cloud solutions...
                      - Led DevOps transformation...
                  persona:
                    type: string
                    description: The persona filter applied
                    example: "Architect"
                  generatedAt:
                    type: string
                    format: date-time
                    description: ISO 8601 timestamp of generation
            text/plain:
              schema:
                type: string
                description: The same text as `generatedText`, with leading and trailing white space trimmed. Sent only when the first media type in `Accept` is `text/plain`.
              example: |
                Ryan Bumstead
                Salesforce Platform Architect

                EXPERIENCE

                Salesforce | Senior Technical Architect
                Jan 2023 - Present
                - Designed multi-cloud solutions...
                - Led DevOps transformation...
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

