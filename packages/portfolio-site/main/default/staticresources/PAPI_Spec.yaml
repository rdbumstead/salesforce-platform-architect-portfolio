          description: The complete portfolio payload
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestIdHeader"
            Cache-Control:
              description: "Derived from upstream SAPI resources (Contacts = no-store)."
              schema:
                type: string
                example: "no-store, no-cache"
            X-Data-Integrity:
