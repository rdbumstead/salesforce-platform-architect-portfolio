  /ai/generate:
    post:
      tags:
        - Logic
      summary: Generate AI Content
      description: |
        Generates content through `PAPIAiGenerate.generate`, which calls the one provider chain,
        `ContentGenerationController.dispatch`.

        **Provider chain**:
        1. Agentforce, only when its switch (`AI_Provider_Config__mdt` record `Agentforce`) is on.
           It ships on and runs a Prompt Builder template as the caller. It has a 20 second
           timeout and an hourly budget (`Hourly_Budget__c`, 120 calls per UTC hour). Past the
           budget its attempt is `budget_exhausted` and the chain moves on.
        2. Gemini 2.5 Flash (`gemini-2.5-flash`, the model set on the `Gemini` record) through the Gemini API (`Gemini_API` Named Credential),
           with a 60 second timeout. The code default model is `gemma-4-31b-it`, used only when the
           record names none.
        3. Local template (`Local`), CoverLetter only.

        A CoverLetter prompt also carries facts from featured projects and experience highlights,
        chosen by keywords from `role` and `jobDescription`. No email address, phone number or
        owner field is ever included. The site's cover letter page calls this endpoint with
        `provider` set to `Agentforce` through the `Portfolio_API` Named Credential, and runs
        Gemini and the template in process when it gets no letter, because a request that arrives
        as a callout from the same org may not call out again (ADR-015). Outside callers use it
        with a Bearer token.

        **Asking for Agentforce only**: send `provider` set to `Agentforce`. Only Agentforce is
        tried, with no Gemini and no template. A failure is 503 `ALL_PROVIDERS_UNAVAILABLE` with
        the message "Agentforce currently unavailable", or "Agentforce hourly budget used" when
        the budget is spent. A CoverLetter asked of Agentforce uses the site's cover letter prompt
        and comes back whole unless `maxLength` is sent.

        **Rate limit**: 10 requests per minute (ai tier). Upstream, the Gemini API key allowed Gemini 2.5 Flash
        5 requests per minute and 20 requests per day when it was read on 2026-10-20, a recorded reading and not a live one. When the Gemini API
        refuses or fails, CoverLetter falls back to the local template and the other types answer
        503 `ALL_PROVIDERS_UNAVAILABLE`.

        **Validation**: `type` and `tone` must be enum values, `provider` only `Agentforce`, `maxLength` an integer 100 to 1000;
        CoverLetter requires `context.companyName` and `context.role`. Content longer than `maxLength` is cut.
      operationId: generateAiContent
      parameters:
        - $ref: "#/components/parameters/RequestIdParam"
        - $ref: "#/components/parameters/ApiVersionParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - context
              properties:
                type:
                  type: string
                  enum: [CoverLetter, BioSummary, SkillDescription]
                  description: The type of content to generate
                  example: "CoverLetter"
                context:
                  type: object
                  description: Contextual data for generation
                  properties:
                    jobDescription:
                      type: string
                      description: Full text of job posting (for cover letters)
                      example: "We are seeking a Senior Salesforce Architect..."
                    companyName:
                      type: string
                      example: "Acme Corp"
                    role:
                      type: string
                      example: "Senior Technical Architect"
                    skills:
                      type: array
                      description: Skills to emphasize
                      items:
                        type: string
                      example: ["Apex", "LWC", "Integration Architecture"]
                    experienceSummary:
                      type: string
                      description: Brief professional summary
                      example: "Nearly a decade on the Salesforce platform"
                tone:
                  type: string
                  enum: [Professional, Enthusiastic, Technical, Casual]
                  default: Professional
                  description: Desired tone of generated content
                maxLength:
                  type: integer
                  minimum: 100
                  maximum: 1000
                  default: 500
                  description: Maximum character count
                provider:
                  type: string
                  enum: [Agentforce]
                  description: |
                    Optional. When sent, only Agentforce is tried: no Gemini and no template, and a
                    failure is 503 `ALL_PROVIDERS_UNAVAILABLE`.
                  example: "Agentforce"
            example:
              type: "CoverLetter"
              context:
                jobDescription: "We are seeking a Senior Salesforce Architect with 5+ years experience in multi-cloud integrations, DevOps, and API design."
                companyName: "Acme Financial"
                role: "Senior Technical Architect"
                skills: ["Apex", "LWC", "MuleSoft", "AWS Lambda"]
                experienceSummary: "Salesforce Platform Architect with nearly a decade on the platform, focused on higher education"
              tone: "Professional"
              maxLength: 500
      responses:
        "200":
          description: Successfully generated content
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestIdHeader"
            X-AI-Provider:
              description: Which provider served the request
              schema:
                type: string
                enum: [Agentforce, Gemini, Local]
                example: "Gemini"
            X-Generation-Time-Ms:
              description: Time taken to generate content in milliseconds
              schema:
                type: integer
                example: 1247
            Cache-Control:
              schema:
                type: string
                example: "no-store, no-cache"
          content:
            application/json:
              schema:
                type: object
                required:
                  - content
                  - provider
                  - generatedAt
                  - latencyMs
                  - attempts
                  - promptShown
                properties:
                  content:
                    type: string
                    description: The generated text content
                    example: |
                      Dear Hiring Manager,

                      I am writing to express my strong interest in the Senior Technical Architect position at Acme Financial...
                  provider:
                    type: string
                    enum: [Agentforce, Gemini, Local]
                    description: Provider that served the request
                    example: "Gemini"
                  model:
                    type: string
                    description: Model identifier (`local-template` when the local template served it)
                    example: "gemini-2.5-flash"
                  type:
                    type: string
                    description: The requested content type, echoed
                    example: "CoverLetter"
                  tone:
                    type: string
                    description: The applied tone, echoed
                    example: "Professional"
                  generatedAt:
                    type: string
                    format: date-time
                  fallbackOccurred:
                    type: boolean
                    description: True when the local template served the request or an earlier provider failed
                    example: false
                  latencyMs:
                    type: integer
                    format: int64
                    description: Time the provider chain took, in milliseconds
                    example: 1240
                  attempts:
                    type: array
                    description: Every provider the chain considered, in order, with what happened
                    items:
                      type: object
                      required:
                        - provider
                        - outcome
                        - ms
                      properties:
                        provider:
                          type: string
                          enum: [Agentforce, Gemini, Local]
                          example: "Gemini"
                        outcome:
                          type: string
                          enum:
                            [
                              served,
                              skipped_off,
                              skipped_open_circuit,
                              budget_exhausted,
                              failed
                            ]
                          description: |
                            `served` wrote the content, `skipped_off` was switched off or unavailable,
                            `skipped_open_circuit` was passed over because its circuit breaker is open,
                            `budget_exhausted` is Agentforce past its hourly budget,
                            `failed` threw or returned no usable text.
                          example: "served"
                        ms:
                          type: integer
                          format: int64
                          description: Time spent on this provider, in milliseconds
                          example: 1236
                    example:
                      - provider: "Agentforce"
                        outcome: "skipped_off"
                        ms: 0
                      - provider: "Gemini"
                        outcome: "served"
                        ms: 1236
                  promptShown:
                    type: string
                    nullable: true
                    description: |
                      The prompt sent to the provider that served, as built by Apex, including the
                      portfolio facts for a CoverLetter. Null when the local template served, because
                      it uses no prompt.
                    example: "Write a cover letter for Ryan Bumstead in a professional tone, no longer than 500 characters."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Rate limit exceeded (ai tier, 10 requests per minute)
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestIdHeader"
            Retry-After:
              schema:
                type: integer
                example: 60
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                httpStatus: 429
                errorCode: "RATE_LIMIT_EXCEEDED"
                message: "Rate limit exceeded. Retry after 60 seconds."
                correlationId: "123e4567-e89b-12d3-a456-426614174000"
