<template>
  <section class="changelog" aria-labelledby="changelog-heading">
    <header class="changelog-header">
      <h2 id="changelog-heading" class="changelog-title">Latest Updates</h2>
      <div class="changelog-meta">
        <template lwc:if={statusBadge}>
          <span class={statusBadge.className} data-id="status-badge"
            >{statusBadge.label}</span
          >
        </template>
        <template lwc:if={ageText}>
          <span class={ageClass} data-id="age-label">{ageText}</span>
        </template>
      </div>
    </header>

    <p class="status-note" data-id="status-note" aria-live="polite">
      {statusNote}
    </p>

    <template lwc:if={isLoading}>
      <p class="changelog-message" data-id="loading">Loading recent updates</p>
    </template>

    <template lwc:if={hasCommits}>
      <ul class="commit-list">
        <template for:each={commits} for:item="commit">
          <li key={commit.sha} class="commit-item" data-sha={commit.sha}>
            <p class="commit-message">
              <template lwc:if={commit.tag}>
                <span class="commit-tag" data-id="tag">{commit.tag}</span>
              </template>
              <span data-id="message">{commit.message}</span>
            </p>
            <p class="commit-details">
              <a
                class="commit-link"
                href={commit.url}
                target="_blank"
                rel="noopener noreferrer"
                aria-label={commit.linkLabel}
                data-id="link"
                data-sha={commit.sha}
                onclick={handleCommitClick}
                >{commit.shortSha}</a
              >
              <span class="commit-date" data-id="date">{commit.date}</span>
            </p>
          </li>
        </template>
      </ul>
    </template>

    <template lwc:if={showEmpty}>
      <p class="changelog-message" data-id="empty">No recent updates found.</p>
    </template>
  </section>
</template>
