<template>
  <template lwc:if={hasAny}>
    <div class="timeline">
      <section class="section" aria-labelledby="timeline-heading">
        <h2 id="timeline-heading" class="section-heading">
          Work, education and certifications.
        </h2>
        <p class="section-intro">Newest first.</p>

        <div
          class="tab-list"
          role="tablist"
          aria-label="Work, education and certifications"
          onkeydown={handleTabKeydown}
        >
          <template for:each={tabs} for:item="tab">
            <button
              key={tab.key}
              type="button"
              class="tab"
              role="tab"
              id={tab.tabId}
              aria-controls={tab.panelId}
              aria-selected={tab.selected}
              tabindex={tab.tabIndex}
              data-tab={tab.key}
              onclick={handleTabClick}
            >
              {tab.label}
            </button>
          </template>
        </div>

        <template for:each={tabs} for:item="tab">
          <div
            key={tab.key}
            class="tab-panel"
            role="tabpanel"
            id={tab.panelId}
            aria-labelledby={tab.tabId}
            data-panel={tab.key}
            tabindex="0"
            hidden={tab.hidden}
          >
            <ol class="entry-list" id={tab.listId}>
              <template for:each={tab.entries} for:item="entry">
                <li
                  key={entry.key}
                  class={entry.className}
                  data-key={entry.key}
                >
                  <div class="entry-main">
                    <h3 class="entry-title">{entry.title}</h3>
                    <p class="entry-org">{entry.org}</p>
                  </div>
                  <p class="entry-dates">{entry.dates}</p>
                </li>
              </template>
            </ol>
            <template lwc:if={tab.hasMore}>
              <button
                type="button"
                class="toggle"
                aria-expanded={tab.expandedText}
                aria-controls={tab.listId}
                data-toggle="true"
                data-tab={tab.key}
                onclick={handleToggle}
              >
                {tab.toggleLabel}
              </button>
            </template>
            <template lwc:if={tab.showVerify}>
              <p class="verify">
                <a
                  class="verify-link"
                  href={verificationUrl}
                  target="_blank"
                  rel="noopener noreferrer"
                  data-id="verify-link"
                  >Verify on Trailhead<span class="assistive-text"
                    >{newTabNote}</span
                  ></a
                >
              </p>
            </template>
          </div>
        </template>
      </section>
    </div>
  </template>
</template>
