<template>
  <lightning-card title="Skill Network" icon-name="standard:invocable_action">
    <c-view-source slot="actions" source-key="skillNetwork"></c-view-source>
    <div class="slds-p-around_medium network-body">
      <template lwc:if={isLoading}>
        <div class="state state-loading">
          <lightning-spinner
            alternative-text="Loading the skills"
            size="medium"
          ></lightning-spinner>
        </div>
      </template>

      <template lwc:elseif={hasError}>
        <div class="state state-error" role="alert">
          <p class="state-title">The skills could not be loaded.</p>
          <p class="slds-text-body_small">{errorMessage}</p>
        </div>
      </template>

      <template lwc:elseif={isEmpty}>
        <div class="state state-empty">
          <p>No skills to show yet.</p>
        </div>
      </template>

      <template lwc:else>
        <template lwc:if={showSwitch}>
          <div class="view-switch" role="group" aria-label="Skills view">
            <button
              type="button"
              class={matrixButtonClass}
              data-view="matrix"
              aria-pressed={matrixPressed}
              onclick={handleViewClick}
            >
              Matrix
            </button>
            <button
              type="button"
              class={graphButtonClass}
              data-view="graph"
              aria-pressed={graphPressed}
              onclick={handleViewClick}
            >
              Graph
            </button>
          </div>
        </template>

        <template lwc:if={showPersonaFilter}>
          <div
            class="persona-filter"
            role="group"
            aria-label="Filter skills by persona"
          >
            <template for:each={personaButtons} for:item="option">
              <button
                key={option.key}
                type="button"
                class={option.className}
                data-value={option.value}
                aria-pressed={option.pressed}
                onclick={handlePersonaClick}
              >
                {option.label}
              </button>
            </template>
          </div>
          <p class="persona-summary" aria-live="polite">{personaSummary}</p>
        </template>

        <template lwc:if={isMatrix}>
          <template lwc:if={matrixIsEmpty}>
            <p class="persona-empty">
              No skill is tagged for this persona yet.
            </p>
          </template>
          <div class="matrix">
            <template for:each={matrixRows} for:item="row">
              <section
                key={row.key}
                class={row.rowClass}
                aria-labelledby={row.headingId}
              >
                <h3 class="row-name" id={row.headingId}>{row.name}</h3>
                <ul class="chips">
                  <template for:each={row.chips} for:item="chip">
                    <li key={chip.id} class={chip.itemClass}>
                      <template lwc:if={chip.isLeaving}>
                        <span class="chip chip-ghost" aria-hidden="true"
                          >{chip.name}</span
                        >
                      </template>
                      <template lwc:else>
                        <button
                          type="button"
                          class={chip.className}
                          data-id={chip.id}
                          aria-pressed={chip.pressed}
                          aria-label={chip.ariaLabel}
                          onclick={handleChipClick}
                        >
                          <span class="chip-name">{chip.name}</span>
                          <span class="chip-meta">
                            <span class="chip-proficiency"
                              >{chip.proficiency}</span
                            >
                            <template lwc:if={chip.hasYears}>
                              <span class="chip-years">{chip.years}</span>
                            </template>
                          </span>
                        </button>
                      </template>
                    </li>
                  </template>
                </ul>
                <template lwc:if={row.showSelection}>
                  <div class="selection">
                    <div
                      class="selection-panel"
                      role="region"
                      aria-labelledby="selection-title"
                    >
                      <div class="selection-head">
                        <h3
                          class="selection-title"
                          id="selection-title"
                          tabindex="-1"
                        >
                          {selection.name}
                        </h3>
                        <button
                          type="button"
                          class="selection-close"
                          onclick={handleClearSelection}
                        >
                          Close
                        </button>
                      </div>
                      <p class="selection-summary">{selection.summary}</p>
                      <template lwc:if={selection.evidence}>
                        <p class="selection-evidence">{selection.evidence}</p>
                      </template>
                      <template lwc:if={selection.hasRoles}>
                        <h4 class="selection-label">Roles</h4>
                        <ul class="selection-list selection-roles">
                          <template for:each={selection.roles} for:item="role">
                            <li key={role.id}>{role.name}</li>
                          </template>
                        </ul>
                      </template>
                      <template lwc:if={selection.hasProjects}>
                        <h4 class="selection-label">Projects</h4>
                        <ul class="selection-list selection-projects">
                          <template
                            for:each={selection.projects}
                            for:item="project"
                          >
                            <li key={project.id}>{project.name}</li>
                          </template>
                        </ul>
                      </template>
                      <template lwc:if={selection.hasCertifications}>
                        <h4 class="selection-label">Certifications</h4>
                        <ul class="selection-list selection-certifications">
                          <template
                            for:each={selection.certifications}
                            for:item="certification"
                          >
                            <li key={certification.id}>{certification.name}</li>
                          </template>
                        </ul>
                      </template>
                      <template lwc:if={selection.isUnused}>
                        <p class="selection-none">
                          No role, project or certification is linked to this
                          skill yet.
                        </p>
                      </template>
                    </div>
                  </div>
                </template>
              </section>
            </template>
          </div>
        </template>

        <template lwc:if={isGraph}>
          <div class="graph-view">
            <template lwc:if={graphLoading}>
              <div class="state state-loading graph-loading">
                <lightning-spinner
                  alternative-text="Loading the graph"
                  size="medium"
                ></lightning-spinner>
              </div>
            </template>
            <template lwc:if={graphErrorMessage}>
              <p class="graph-error" role="alert">{graphErrorMessage}</p>
            </template>
            <template lwc:if={graphIsEmpty}>
              <p class="persona-empty">
                No skill is tagged for this persona yet.
              </p>
            </template>
            <template lwc:if={showGraphCanvas}>
              <p class="graph-hint">
                Hover or select a node to see its connections. Drag a node to
                move it, and it stays there for this visit. Zoom with the
                buttons, Ctrl and the mouse wheel, or a pinch. Drag the
                background, or use the arrow keys on the focused graph, to pan.
                Fit shows the whole graph, and Reset layout puts every node
                back.
              </p>
              <template lwc:if={canZoom}>
                <div
                  class="graph-controls"
                  role="group"
                  aria-label="Graph view controls"
                >
                  <button
                    type="button"
                    class="graph-control"
                    data-action="zoom-in"
                    onclick={handleZoomIn}
                  >
                    Zoom in
                  </button>
                  <button
                    type="button"
                    class="graph-control"
                    data-action="zoom-out"
                    onclick={handleZoomOut}
                  >
                    Zoom out
                  </button>
                  <button
                    type="button"
                    class="graph-control"
                    data-action="fit"
                    onclick={handleFit}
                  >
                    Fit
                  </button>
                  <button
                    type="button"
                    class="graph-control"
                    data-action="reset-layout"
                    onclick={handleResetLayout}
                  >
                    Reset layout
                  </button>
                  <span class="zoom-level" aria-live="polite">{zoomLabel}</span>
                </div>
              </template>
              <div
                class="graph-wrapper"
                role="group"
                aria-label="Skill graph"
                aria-describedby="pan-hint"
                tabindex={graphTabIndex}
                onkeydown={handleGraphKeydown}
                onfocusout={handleGraphBlur}
              >
                <p class="pan-hint" id="pan-hint">
                  Arrow keys pan the graph. Fit shows all of it again.
                </p>
                <svg
                  class="graph-svg"
                  viewBox={graphModel.viewBox}
                  aria-hidden="true"
                  focusable="false"
                >
                  <g class="graph-viewport" transform={graphModel.transform}>
                    <template for:each={graphModel.edges} for:item="edge">
                      <line
                        key={edge.key}
                        class={edge.className}
                        x1={edge.x1}
                        y1={edge.y1}
                        x2={edge.x2}
                        y2={edge.y2}
                      ></line>
                    </template>
                    <template for:each={graphModel.nodes} for:item="node">
                      <g
                        key={node.key}
                        class={node.className}
                        data-id={node.id}
                        onmouseenter={handleNodeEnter}
                        onmouseleave={handleNodeLeave}
                        onclick={handleNodeClick}
                      >
                        <title>{node.title}</title>
                        <template lwc:if={node.hasRing}>
                          <circle
                            class="evidence-ring"
                            cx={node.cx}
                            cy={node.cy}
                            r={node.ringR}
                          ></circle>
                        </template>
                        <circle
                          class="node-dot"
                          cx={node.cx}
                          cy={node.cy}
                          r={node.r}
                        ></circle>
                        <template lwc:if={node.showLabel}>
                          <text
                            class="node-label"
                            x={node.labelX}
                            y={node.labelY}
                            text-anchor={node.anchor}
                          >
                            {node.label}
                          </text>
                        </template>
                      </g>
                    </template>
                    <template
                      for:each={graphModel.categories}
                      for:item="category"
                    >
                      <text
                        key={category.key}
                        class="category-label"
                        x={category.x}
                        y={category.y}
                        text-anchor="middle"
                      >
                        {category.name}
                      </text>
                    </template>
                  </g>
                </svg>
              </div>
              <ul class="graph-legend" aria-label="Graph legend">
                <li class="legend-item">
                  <svg
                    class="legend-swatch"
                    viewBox="0 0 20 20"
                    aria-hidden="true"
                  >
                    <circle
                      class="legend-dot legend-skill"
                      cx="10"
                      cy="10"
                      r="6"
                    ></circle>
                  </svg>
                  Skill
                </li>
                <li class="legend-item">
                  <svg
                    class="legend-swatch"
                    viewBox="0 0 20 20"
                    aria-hidden="true"
                  >
                    <circle
                      class="legend-dot legend-role"
                      cx="10"
                      cy="10"
                      r="6"
                    ></circle>
                  </svg>
                  Role
                </li>
                <li class="legend-item">
                  <svg
                    class="legend-swatch"
                    viewBox="0 0 20 20"
                    aria-hidden="true"
                  >
                    <circle
                      class="legend-dot legend-project"
                      cx="10"
                      cy="10"
                      r="6"
                    ></circle>
                  </svg>
                  Project
                </li>
                <template lwc:if={hasCertifications}>
                  <li class="legend-item">
                    <svg
                      class="legend-swatch"
                      viewBox="0 0 20 20"
                      aria-hidden="true"
                    >
                      <circle
                        class="legend-dot legend-certification"
                        cx="10"
                        cy="10"
                        r="6"
                      ></circle>
                    </svg>
                    Certification
                  </li>
                </template>
                <template lwc:if={hasRetired}>
                  <li class="legend-item">
                    <svg
                      class="legend-swatch"
                      viewBox="0 0 20 20"
                      aria-hidden="true"
                    >
                      <circle
                        class="legend-dot legend-retired"
                        cx="10"
                        cy="10"
                        r="6"
                      ></circle>
                    </svg>
                    Retired certification
                  </li>
                </template>
                <li class="legend-item legend-evidence">
                  <svg
                    class="legend-swatch legend-swatch_wide"
                    viewBox="0 0 84 20"
                    aria-hidden="true"
                  >
                    <circle
                      class="legend-ring legend-ring-1"
                      cx="10"
                      cy="10"
                      r="7.5"
                    ></circle>
                    <circle
                      class="legend-dot legend-skill"
                      cx="10"
                      cy="10"
                      r="5"
                    ></circle>
                    <circle
                      class="legend-ring legend-ring-2"
                      cx="40"
                      cy="10"
                      r="8"
                    ></circle>
                    <circle
                      class="legend-dot legend-skill"
                      cx="40"
                      cy="10"
                      r="5"
                    ></circle>
                    <circle
                      class="legend-ring legend-ring-3"
                      cx="72"
                      cy="10"
                      r="8.5"
                    ></circle>
                    <circle
                      class="legend-dot legend-skill"
                      cx="72"
                      cy="10"
                      r="5"
                    ></circle>
                  </svg>
                  A heavier ring and line: more kinds of evidence (a role, a
                  project, a certification) back the skill.
                </li>
              </ul>
              <p class="graph-selection" aria-live="polite">
                {graphSelectionText}
              </p>
            </template>

            <div class="slds-assistive-text network-list">
              <h3>Skill network as a list</h3>
              <p class="network-summary">{summary}</p>
              <ul>
                <template for:each={accessibleNodes} for:item="item">
                  <li
                    key={item.id}
                    class="network-node"
                    data-connections={item.connectionCount}
                  >
                    {item.text}
                  </li>
                </template>
              </ul>
            </div>
          </div>
        </template>
      </template>
    </div>
  </lightning-card>
</template>
