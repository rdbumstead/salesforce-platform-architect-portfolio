<template>
  <lightning-card title="Skill Network" icon-name="standard:invocable_action">
    <div class="slds-p-around_medium network-body">
      <template lwc:if={isLoading}>
        <div class="state state-loading">
          <lightning-spinner
            alternative-text="Loading the skills"
            size="medium"
          ></lightning-spinner>
        </div>
      </template>

      <template lwc:elseif={hasError}>
        <div class="state state-error" role="alert">
          <p class="state-title">The skills could not be loaded.</p>
          <p class="slds-text-body_small">{errorMessage}</p>
        </div>
      </template>

      <template lwc:elseif={isEmpty}>
        <div class="state state-empty">
          <p>No skills to show yet.</p>
        </div>
      </template>

      <template lwc:else>
        <template lwc:if={showSwitch}>
          <div class="view-switch" role="group" aria-label="Skills view">
            <button
              type="button"
              class={matrixButtonClass}
              data-view="matrix"
              aria-pressed={matrixPressed}
              onclick={handleViewClick}
            >
              Matrix
            </button>
            <button
              type="button"
              class={graphButtonClass}
              data-view="graph"
              aria-pressed={graphPressed}
              onclick={handleViewClick}
            >
              Graph
            </button>
          </div>
        </template>

        <template lwc:if={isMatrix}>
          <div class="matrix">
            <template for:each={categoryRows} for:item="row">
              <section
                key={row.key}
                class="matrix-row"
                aria-labelledby={row.headingId}
              >
                <h3 class="row-name" id={row.headingId}>{row.name}</h3>
                <ul class="chips">
                  <template for:each={row.chips} for:item="chip">
                    <li key={chip.id} class="chip-item">
                      <button
                        type="button"
                        class={chip.className}
                        data-id={chip.id}
                        aria-pressed={chip.pressed}
                        aria-label={chip.ariaLabel}
                        onclick={handleChipClick}
                      >
                        <span class="chip-name">{chip.name}</span>
                        <span class="chip-meta">
                          <span class="chip-proficiency"
                            >{chip.proficiency}</span
                          >
                          <template lwc:if={chip.hasYears}>
                            <span class="chip-years">{chip.years}</span>
                          </template>
                        </span>
                      </button>
                    </li>
                  </template>
                </ul>
              </section>
            </template>
          </div>

          <div class="selection" aria-live="polite">
            <template lwc:if={selection}>
              <div class="selection-panel">
                <div class="selection-head">
                  <h3 class="selection-title">{selection.name}</h3>
                  <button
                    type="button"
                    class="selection-close"
                    onclick={handleClearSelection}
                  >
                    Close
                  </button>
                </div>
                <p class="selection-summary">{selection.summary}</p>
                <template lwc:if={selection.hasRoles}>
                  <h4 class="selection-label">Roles</h4>
                  <ul class="selection-list selection-roles">
                    <template for:each={selection.roles} for:item="role">
                      <li key={role.id}>{role.name}</li>
                    </template>
                  </ul>
                </template>
                <template lwc:if={selection.hasProjects}>
                  <h4 class="selection-label">Projects</h4>
                  <ul class="selection-list selection-projects">
                    <template for:each={selection.projects} for:item="project">
                      <li key={project.id}>{project.name}</li>
                    </template>
                  </ul>
                </template>
                <template lwc:if={selection.isUnused}>
                  <p class="selection-none">
                    No role or project is linked to this skill yet.
                  </p>
                </template>
              </div>
            </template>
          </div>
        </template>

        <template lwc:if={isGraph}>
          <div class="graph-view">
            <template lwc:if={graphLoading}>
              <div class="state state-loading graph-loading">
                <lightning-spinner
                  alternative-text="Loading the graph"
                  size="medium"
                ></lightning-spinner>
              </div>
            </template>
            <template lwc:if={graphErrorMessage}>
              <p class="graph-error" role="alert">{graphErrorMessage}</p>
            </template>
            <template lwc:if={showGraphCanvas}>
              <p class="graph-hint">
                Hover or select a node to see its connections.
              </p>
              <div class="graph-wrapper">
                <svg
                  class="graph-svg"
                  viewBox={graphModel.viewBox}
                  aria-hidden="true"
                  focusable="false"
                >
                  <template for:each={graphModel.edges} for:item="edge">
                    <line
                      key={edge.key}
                      class="graph-edge"
                      x1={edge.x1}
                      y1={edge.y1}
                      x2={edge.x2}
                      y2={edge.y2}
                    ></line>
                  </template>
                  <template for:each={graphModel.nodes} for:item="node">
                    <g
                      key={node.key}
                      class={node.className}
                      data-id={node.id}
                      onmouseenter={handleNodeEnter}
                      onmouseleave={handleNodeLeave}
                      onclick={handleNodeClick}
                    >
                      <title>{node.title}</title>
                      <circle cx={node.cx} cy={node.cy} r={node.r}></circle>
                      <template lwc:if={node.showLabel}>
                        <text
                          class="node-label"
                          x={node.labelX}
                          y={node.labelY}
                          text-anchor={node.anchor}
                        >
                          {node.label}
                        </text>
                      </template>
                    </g>
                  </template>
                  <template
                    for:each={graphModel.categories}
                    for:item="category"
                  >
                    <text
                      key={category.key}
                      class="category-label"
                      x={category.x}
                      y={category.y}
                      text-anchor="middle"
                    >
                      {category.name}
                    </text>
                  </template>
                </svg>
              </div>
              <p class="graph-selection" aria-live="polite">
                {graphSelectionText}
              </p>
            </template>

            <div class="slds-assistive-text network-list">
              <h3>Skill network as a list</h3>
              <p class="network-summary">{summary}</p>
              <ul>
                <template for:each={accessibleNodes} for:item="item">
                  <li
                    key={item.id}
                    class="network-node"
                    data-connections={item.connectionCount}
                  >
                    {item.text}
                  </li>
                </template>
              </ul>
            </div>
          </div>
        </template>
      </template>
    </div>
  </lightning-card>
</template>
