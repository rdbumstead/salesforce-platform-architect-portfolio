<template>
  <div class="home">
    <section class="hero" aria-labelledby="hero-name">
      <img
        class="hero-photo"
        src={headshotUrl}
        alt={name}
        width="132"
        height="132"
        fetchpriority="high"
      />
      <div class="hero-body">
        <p class="hero-meta" data-id="hero-meta">{title} · {location}</p>
        <h1 id="hero-name" class="hero-name">{name}</h1>
        <div class="hero-line-slot">
          <template lwc:if={heroLine}>
            <p class="hero-line" data-id="hero-line">{heroLine}</p>
          </template>
        </div>
        <div class="hero-value-slot">
          <p class="hero-value" data-id="hero-value">{valueSentence}</p>
        </div>
        <ul class="proof" aria-label="At a glance" data-id="proof-strip">
          <template for:each={proofPoints} for:item="point">
            <li key={point.key} class="proof-item">{point.text}</li>
          </template>
        </ul>
        <div class="hero-actions">
          <a
            class="btn btn-primary"
            href={tourHref}
            data-id="tour-link"
            onclick={handleTourClick}
            >{tourLabel} <span aria-hidden="true">→</span></a
          >
          <template lwc:if={hasCaseStudies}>
            <a
              class="btn btn-secondary"
              href={caseStudiesHref}
              data-id="case-studies-button"
              onclick={handleCaseStudiesClick}
              >See the case studies <span aria-hidden="true">↓</span></a
            >
          </template>
        </div>
        <div class="proof-panel" data-id="proof-panel">
          <p class="proof-intro" data-id="proof-intro">{proofIntro}</p>
          <template lwc:if={statsText}>
            <p class="proof-stats" data-id="proof-stats">{statsText}</p>
          </template>
          <div class="proof-actions">
            <a class="btn btn-secondary" href={docsHref} data-id="docs-link"
              >Architecture and decisions <span aria-hidden="true">→</span></a
            >
            <a
              class="btn btn-secondary"
              href={guestAccessHref}
              data-id="guest-access-link"
              >How a request reaches the data
              <span aria-hidden="true">→</span></a
            >
          </div>
        </div>
        <nav class="profile-links" aria-label="Profiles">
          <template for:each={profileLinks} for:item="link">
            <a
              key={link.key}
              class="profile-link"
              href={link.href}
              target={link.target}
              rel={link.rel}
              data-key={link.key}
            >
              <template lwc:if={link.isGitHub}>
                <svg
                  aria-hidden="true"
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"
                  ></path>
                </svg>
              </template>
              <template lwc:if={link.isLinkedIn}>
                <svg
                  aria-hidden="true"
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"
                  ></path>
                  <rect x="2" y="9" width="4" height="12"></rect>
                  <circle cx="4" cy="4" r="2"></circle>
                </svg>
              </template>
              <template lwc:if={link.isTrailhead}>
                <svg
                  aria-hidden="true"
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline
                    points="3 20 9 10 13 16 16 12 21 20 3 20"
                  ></polyline>
                </svg>
              </template>
              <template lwc:if={link.isResume}>
                <svg
                  aria-hidden="true"
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                  ></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                </svg>
              </template>
              <template lwc:if={link.isApi}>
                <svg
                  aria-hidden="true"
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="16 18 22 12 16 6"></polyline>
                  <polyline points="8 6 2 12 8 18"></polyline>
                </svg>
              </template>
              {link.label}
            </a>
          </template>
        </nav>
      </div>
    </section>
  </div>
</template>
