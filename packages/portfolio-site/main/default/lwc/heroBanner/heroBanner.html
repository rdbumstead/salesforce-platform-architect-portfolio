<template>
  <div class="home">
    <section class="hero" aria-labelledby="hero-name">
      <img
        class="hero-photo"
        src={headshotUrl}
        alt={name}
        width="232"
        height="232"
        fetchpriority="high"
      />
      <div class="hero-body">
        <p class="hero-meta">{title} · {location}</p>
        <h1 id="hero-name" class="hero-name">{name}</h1>
        <template lwc:if={bio}>
          <p class="hero-bio">{bio}</p>
        </template>
        <div class="hero-actions">
          <a
            class="btn btn-primary"
            href="#tour"
            data-id="tour-button"
            onclick={handleTourClick}
            >{tourButtonLabel} <span aria-hidden="true">↓</span></a
          >
          <a class="btn btn-ghost" href={resumeHref} data-id="resume-button"
            >View the resume <span aria-hidden="true">→</span></a
          >
        </div>
        <nav class="profile-links" aria-label="Profiles">
          <template for:each={profileLinks} for:item="link">
            <a
              key={link.key}
              class="profile-link"
              href={link.href}
              target={link.target}
              rel={link.rel}
              data-key={link.key}
            >
              <template lwc:if={link.isGitHub}>
                <svg
                  aria-hidden="true"
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"
                  ></path>
                </svg>
              </template>
              <template lwc:if={link.isLinkedIn}>
                <svg
                  aria-hidden="true"
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"
                  ></path>
                  <rect x="2" y="9" width="4" height="12"></rect>
                  <circle cx="4" cy="4" r="2"></circle>
                </svg>
              </template>
              <template lwc:if={link.isResume}>
                <svg
                  aria-hidden="true"
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                  ></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                </svg>
              </template>
              <template lwc:if={link.isApi}>
                <svg
                  aria-hidden="true"
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="16 18 22 12 16 6"></polyline>
                  <polyline points="8 6 2 12 8 18"></polyline>
                </svg>
              </template>
              {link.label}
            </a>
          </template>
        </nav>
      </div>
    </section>

    <nav class="start" aria-labelledby="start-heading" data-id="start-paths">
      <h2 id="start-heading" class="start-heading">Start here</h2>
      <ul class="start-list">
        <template for:each={startPaths} for:item="path">
          <li key={path.key} class="start-item" data-key={path.key}>
            <p class="start-audience">{path.audience}</p>
            <a
              class="start-link"
              href={path.href}
              data-target={path.target}
              data-path={path.key}
              onclick={handleStartClick}
              >{path.title} <span aria-hidden="true">{path.arrow}</span></a
            >
            <p class="start-text">{path.text}</p>
          </li>
        </template>
      </ul>
    </nav>

    <section class="section" aria-labelledby="pillars-heading">
      <p class="section-label">01 / THE PILLARS</p>
      <h2
        id="pillars-heading"
        class="section-heading"
        data-id="pillars-heading"
        tabindex="-1"
      >
        The pillars.
      </h2>
      <p class="section-intro">Pick a pillar, or take the tour below.</p>
      <ul class="pillar-grid" data-id="pillar-nav">
        <template for:each={pillars} for:item="pillar">
          <li key={pillar.key} class="card pillar-card" data-key={pillar.key}>
            <template lwc:if={pillar.hasImage}>
              <img
                class="pillar-image"
                src={pillar.imageUrl}
                alt={pillar.imageAlt}
                width={cardImageWidth}
                height={cardImageHeight}
                loading="lazy"
                decoding="async"
              />
            </template>
            <template lwc:if={pillar.hasHeadline}>
              <p class="pillar-headline" data-id="pillar-headline">
                <span class="pillar-metric">{pillar.headlineMetric}</span>
                <span class="pillar-metric-label">{pillar.headlineLabel}</span>
              </p>
            </template>
            <div class="pillar-top">
              <span class="pillar-letter" aria-hidden="true"
                >{pillar.letter}</span
              >
              <span class="pillar-eyebrow">{pillar.eyebrow}</span>
            </div>
            <h3 class="pillar-name">{pillar.sasName}</h3>
            <p class="pillar-summary">{pillar.summary}</p>
            <template lwc:if={pillar.code}>
              <code class="pillar-code">{pillar.code}</code>
            </template>
            <ul class="tag-list" aria-label="Topics">
              <template for:each={pillar.tags} for:item="tag">
                <li key={tag.key} class="tag">{tag.label}</li>
              </template>
            </ul>
            <template lwc:if={pillar.hasCaseStudy}>
              <div class="case-study" data-id="case-study">
                <button
                  type="button"
                  class="case-toggle"
                  aria-expanded={pillar.expandedText}
                  aria-controls={pillar.caseId}
                  data-key={pillar.key}
                  onclick={handleCaseToggle}
                >
                  <span>{pillar.caseToggleLabel}</span>
                  <span class="case-chevron" aria-hidden="true"
                    >{pillar.caseChevron}</span
                  >
                </button>
                <div
                  id={pillar.caseId}
                  class="case-body"
                  data-id="case-body"
                  hidden={pillar.caseHidden}
                >
                  <template for:each={pillar.caseBlocks} for:item="block">
                    <div key={block.key} class="case-block">
                      <h4 class="case-heading">{block.heading}</h4>
                      <p class="case-text">{block.text}</p>
                    </div>
                  </template>
                  <template lwc:if={pillar.hasCaseLinks}>
                    <ul class="case-links" aria-label="Links">
                      <template for:each={pillar.caseLinks} for:item="link">
                        <li key={link.key}>
                          <a
                            class="case-link"
                            href={link.href}
                            target="_blank"
                            rel="noopener noreferrer"
                            data-key={link.key}
                            >{link.label}<span class="assistive-text"
                              >{newTabNote}</span
                            ></a
                          >
                        </li>
                      </template>
                    </ul>
                  </template>
                </div>
              </div>
            </template>
            <a class="pillar-link" href={pillar.href}
              >{pillar.linkLabel} <span aria-hidden="true">→</span></a
            >
          </li>
        </template>
        <li class="card tour-card">
          <a
            class="tour-card-link"
            href="#tour"
            data-id="tour-card"
            onclick={handleTourClick}
          >
            <span class="tour-card-kicker">Not sure where to start?</span>
            <span class="tour-card-title"
              >{tourButtonLabel} <span aria-hidden="true">↓</span></span
            >
          </a>
        </li>
      </ul>
      <template lwc:if={hasComing}>
        <p class="coming-note" data-id="coming-note">{comingText}</p>
      </template>
    </section>

    <section class="section" aria-labelledby="tour-heading">
      <p class="section-label">02 / HOW TO EVALUATE ME</p>
      <h2
        id="tour-heading"
        class="section-heading"
        data-id="tour-heading"
        tabindex="-1"
      >
        {tourHeading}
      </h2>
      <p class="section-intro">One stop per pillar.</p>
      <ol class="tour-list" data-id="tour">
        <template for:each={tourSteps} for:item="step">
          <li key={step.key} class="tour-step" data-key={step.key}>
            <span class="tour-lead">
              <span class="tour-number" aria-hidden="true">{step.number}</span>
              <a class="tour-link" href={step.href}>{step.title}</a>
            </span>
            <span class="tour-text">{step.text}</span>
            <span class="tour-duration">{step.duration}</span>
          </li>
        </template>
      </ol>
    </section>
  </div>
</template>
