      </p>

        inquiry, registration, assessment, orientation, delivery, transition and

      </p>

      <h3 class="sub-heading">Architecture decisions</h3>
      <ul class="decisions">
        <li>
          Minimalist model: start with the fewest objects the staff can run, and
          add only what reporting needs.
        </li>
        <li>
          Household Accounts: each learner is a Contact in a Household Account,
          the NPSP default.
        </li>
        <li>
          Custom assessment and employment objects: Assessment, Employment and
          Partner Referral are small custom objects on Contact, because the
          program packages have no outcome objects.
        </li>
        <li>
          Volunteers on Volunteers for Salesforce: a volunteer enters as a Lead,
          becomes a Contact once confirmed, and jobs, shifts and hours live in
          the package.
        </li>
        <li>
          Outreach as Tasks: follow-ups and operational actions are standard
          Tasks on the activity timeline, not a custom object.
        </li>
        <li>
          Observations as Service Deliveries: a classroom observation is one
          more service delivered, so it needs no object of its own.
        </li>
        <li>
          Donations external: donor management was out of scope by agreement,
          and the existing donor system keeps fundraising.
        </li>
      </ul>
      <h3 class="sub-heading">What we deliberately did not build</h3>
      <ul class="not-built">
        <li>Fundraising, gifts or donor records.</li>
        <li>A portal for learners or instructors, who hold no licences.</li>
        <li>An automated sync to the state reporting system.</li>
        <li>An integration with the accounting system.</li>
      </ul>
    </section>

    <section class="story-section" data-section="outcome">

        minimalist model, and the nonprofit is in user acceptance testing,
        preparing for production. Staff record classes, sessions and attendance
        in one place, with assessment, employment and referral outcomes on the
        learner's record, ready for the state report.
      </p>
