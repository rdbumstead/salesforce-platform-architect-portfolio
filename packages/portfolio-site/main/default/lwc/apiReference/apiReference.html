<template>
  <article class={cardClass}>
    <header class="reference-header">
      <template lwc:if={fullWidth}>
        <h1 class="reference-title reference-title_page">API reference</h1>
        <!-- prettier-ignore -->
        <p class="reference-intro">Every endpoint, parameter and response behind the <a class="inline-link" href={apiLabHref}>API Lab</a>.</p>
      </template>
      <template lwc:else>
        <h2 class="reference-title">
          <lightning-icon
            icon-name="utility:knowledge_base"
            size="small"
            class="reference-icon"
          ></lightning-icon>
          <span>API reference</span>
        </h2>
        <p class="reference-intro">
          Browse the full OpenAPI contract for the System API and the Process
          API. The interactive reference loads only when you open it.
        </p>
      </template>
      <div class="postman-actions">
        <a
          class="nc-button nc-button_secondary collection-download"
          href={collectionUrl}
          download={collectionFileName}
          onclick={handleCollectionDownload}
          >Download the Postman collection</a
        >
        <template lwc:if={hasPostmanRun}>
          <a
            class="nc-button nc-button_secondary postman-run"
            href={postmanRunUrl}
            target="_blank"
            rel="noopener noreferrer"
            onclick={handlePostmanRun}
            >Run in Postman</a
          >
        </template>
      </div>
      <p lwc:if={hasPostmanRun} class="postman-note">
        Run in Postman opens a copy you cannot edit. Fork it into your own
        workspace, then add your email in the collection's Variables tab.
      </p>
    </header>
    <div class={bodyClass}>
      <div class="spec-bar-group version-bar">
        <span class="toggle-label" aria-hidden="true">Version</span>
        <div
          class="nc-toggle-group version-toggle slds-m-bottom_small"
          role="group"
          aria-label="API version"
        >
          <template for:each={versionButtons} for:item="version">
            <button
              key={version.value}
              type="button"
              class={version.cssClass}
              aria-pressed={version.pressed}
              data-version={version.value}
              onclick={handleVersionClick}
            >
              {version.label}
            </button>
          </template>
        </div>
      </div>
      <div class="spec-bar">
        <div class="spec-bar-group">
          <span class="toggle-label" aria-hidden="true">Specification</span>
          <div
            class="nc-toggle-group spec-toggle slds-m-bottom_small"
            role="group"
            aria-label="Specification"
          >
            <template for:each={specButtons} for:item="spec">
              <button
                key={spec.value}
                type="button"
                class={spec.cssClass}
                aria-pressed={spec.pressed}
                data-spec={spec.value}
                onclick={handleSpecClick}
              >
                {spec.label}
              </button>
            </template>
          </div>
        </div>
      </div>

      <div lwc:if={showMenuButton} class="menu-bar">
        <button
          type="button"
          class="nc-button nc-button_secondary menu-button"
          aria-expanded={menuExpanded}
          onclick={handleMenuClick}
        >
          {menuLabel}
        </button>
      </div>

      <p lwc:if={isDeprecatedVersion} class="version-notice" role="note">
        {versionNotice}
      </p>

      <template lwc:if={showOpenButton}>
        <button
          type="button"
          class="open-reference nc-button"
          onclick={handleOpen}
          disabled={openDisabled}
        >
          {openLabel}
        </button>
      </template>

      <div aria-live="polite" class="slds-m-top_small">
        <template lwc:if={isLoading}>
          <div class="loading-state slds-is-relative slds-p-around_large">
            <lightning-spinner
              alternative-text="Loading the API reference"
              size="small"
            ></lightning-spinner>
          </div>
        </template>

        <div lwc:if={hasError} class="reference-error" role="alert">
          <p class="error-text">{errorMessage}</p>
          <p class="fallback-text">
            Read the
            <a
              class="hosted-link"
              href={hostedUrl}
              target="_blank"
              rel="noopener noreferrer"
              >hosted API reference</a
            >
            instead.
          </p>
        </div>
      </div>

      <div class={targetClass}>
        <div class="redoc-styles" lwc:dom="manual"></div>
        <div
          class="redoc-target"
          lwc:dom="manual"
          onclick={handleRedocClick}
          onkeydown={handleRedocKeydown}
          onwheel={handleRedocWheel}
          ontouchstart={handleRedocTouchStart}
          ontouchmove={handleRedocTouchMove}
        ></div>
      </div>
    </div>
  </article>
</template>
