<template>
  <template lwc:if={hasPoints}>
    <div class="career">
      <section class="section" aria-labelledby="career-heading">
        <div class="heading-row">
          <h2
            id="career-heading"
            class="section-heading"
            data-id="career-heading"
          >
            Career timeline
          </h2>
          <c-data-source
            source-keys="ResumeController_TimelineRoles,ResumeController_Education,ResumeController_Certifications"
            class="card-source"
          ></c-data-source>
        </div>

        <template lwc:if={showFilters}>
          <div
            class="filters"
            role="group"
            aria-label="Show on the timeline"
            data-id="filters"
          >
            <template for:each={filters} for:item="option">
              <button
                key={option.key}
                type="button"
                class={option.className}
                aria-pressed={option.pressed}
                data-kind={option.key}
                onclick={handleFilterClick}
              >
                {option.label}
              </button>
            </template>
          </div>
        </template>

        <div class={lineWrapClass} data-id="line-wrap">
          <ol
            class="line"
            data-id="line"
            tabindex="0"
            aria-labelledby="career-heading"
            onscroll={handleLineScroll}
          >
            <template for:each={linePoints} for:item="point">
              <li
                key={point.key}
                class={point.pointClass}
                data-id="line-point"
                data-key={point.key}
                data-type={point.type}
              >
                <span class="dot" aria-hidden="true"></span>
                <template lwc:if={point.isGroup}>
                  <div class="group">
                    <span class="point-first"
                      >{point.first}<span class="visually-hidden"
                        >{comma}</span
                      ></span
                    >
                    <template lwc:if={point.showGroupYears}>
                      <span class="years group-years"
                        ><span aria-hidden="true">{point.years}</span
                        ><span class="visually-hidden"
                          >{point.yearsSpoken}</span
                        ></span
                      >
                    </template>
                    <ul class="titles">
                      <template for:each={point.titles} for:item="title">
                        <li
                          key={title.key}
                          class="title-item"
                          data-id="line-title"
                        >
                          <div class="point-body title-row">
                            <span class="point-second"
                              >{title.label}<span class="visually-hidden"
                                >{comma}</span
                              ></span
                            >
                            <template lwc:if={title.showYears}>
                              <span class="years"
                                ><span aria-hidden="true">{title.years}</span
                                ><span class="visually-hidden"
                                  >{title.yearsSpoken}</span
                                ><template lwc:if={title.isCurrent}
                                  ><span class="active-tag" aria-hidden="true"
                                    >Active</span
                                  ></template
                                ></span
                              >
                            </template>
                          </div>
                        </li>
                      </template>
                    </ul>
                  </div>
                </template>
                <template lwc:else>
                  <div class="point-body">
                    <span class="point-first"
                      >{point.first}<span class="visually-hidden"
                        >{comma}</span
                      ></span
                    >
                    <template lwc:if={point.hasSecond}>
                      <span class="point-second"
                        >{point.second}<span class="visually-hidden"
                          >{comma}</span
                        ></span
                      >
                    </template>
                    <span class="years"
                      ><span aria-hidden="true">{point.years}</span
                      ><span class="visually-hidden">{point.yearsSpoken}</span
                      ><template lwc:if={point.isCurrent}
                        ><span class="active-tag" aria-hidden="true"
                          >Active</span
                        ></template
                      ></span
                    >
                  </div>
                </template>
              </li>
            </template>
          </ol>
        </div>

        <ol
          id="career-stack"
          class="stack"
          data-id="stack"
          aria-labelledby="career-heading"
        >
          <template for:each={stackPoints} for:item="point">
            <li
              key={point.key}
              class={point.pointClass}
              data-id="stack-point"
              data-key={point.key}
              data-type={point.type}
            >
              <span class="dot" aria-hidden="true"></span>
              <template lwc:if={point.isGroup}>
                <div class="group">
                  <span class="point-first"
                    >{point.first}<span class="visually-hidden"
                      >{comma}</span
                    ></span
                  >
                  <template lwc:if={point.showGroupYears}>
                    <span class="years group-years"
                      ><span aria-hidden="true">{point.years}</span
                      ><span class="visually-hidden"
                        >{point.yearsSpoken}</span
                      ></span
                    >
                  </template>
                  <ul class="titles">
                    <template for:each={point.titles} for:item="title">
                      <li
                        key={title.key}
                        class="title-item"
                        data-id="stack-title"
                      >
                        <div class="point-body title-row">
                          <span class="point-second"
                            >{title.label}<span class="visually-hidden"
                              >{comma}</span
                            ></span
                          >
                          <template lwc:if={title.showYears}>
                            <span class="years"
                              ><span aria-hidden="true">{title.years}</span
                              ><span class="visually-hidden"
                                >{title.yearsSpoken}</span
                              ><template lwc:if={title.isCurrent}
                                ><span class="active-tag" aria-hidden="true"
                                  >Active</span
                                ></template
                              ></span
                            >
                          </template>
                        </div>
                      </li>
                    </template>
                  </ul>
                </div>
              </template>
              <template lwc:else>
                <div class="point-body">
                  <span class="point-first"
                    >{point.first}<span class="visually-hidden"
                      >{comma}</span
                    ></span
                  >
                  <template lwc:if={point.hasSecond}>
                    <span class="point-second"
                      >{point.second}<span class="visually-hidden"
                        >{comma}</span
                      ></span
                    >
                  </template>
                  <span class="years"
                    ><span aria-hidden="true">{point.years}</span
                    ><span class="visually-hidden">{point.yearsSpoken}</span
                    ><template lwc:if={point.isCurrent}
                      ><span class="active-tag" aria-hidden="true"
                        >Active</span
                      ></template
                    ></span
                  >
                </div>
              </template>
            </li>
          </template>
        </ol>

        <template lwc:if={showStackToggle}>
          <div class="stack-more">
            <button
              type="button"
              class="stack-toggle"
              data-id="stack-toggle"
              aria-expanded={stackToggleExpanded}
              aria-controls="career-stack"
              onclick={handleStackToggle}
            >
              {stackToggleLabel}
            </button>
          </div>
        </template>

        <p class="career-foot">
          <a class="foot-link" href={resumeHref} data-id="resume-link"
            >View full details on my resume</a
          >
          <template lwc:if={showVerify}>
            <a
              class="foot-link verify-link"
              href={verificationUrl}
              target="_blank"
              rel="noopener noreferrer"
              data-id="verify-link"
              >Verify on Trailhead<span class="visually-hidden"
                >{newTabNote}</span
              ></a
            >
          </template>
        </p>
      </section>
    </div>
  </template>
</template>
