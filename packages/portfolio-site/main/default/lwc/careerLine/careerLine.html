<template>
  <template lwc:if={hasPoints}>
    <div class="career">
      <section
        class="section"
        aria-labelledby="career-heading"
        onkeydown={handleKeydown}
      >
        <h2
          id="career-heading"
          class="visually-hidden"
          data-id="career-heading"
        >
          Career, newest first
        </h2>

        <template lwc:if={showFilters}>
          <div
            class="filters"
            role="group"
            aria-label="Show on the timeline"
            data-id="filters"
          >
            <template for:each={filters} for:item="option">
              <button
                key={option.key}
                type="button"
                class={option.className}
                aria-pressed={option.pressed}
                data-kind={option.key}
                onclick={handleFilterClick}
              >
                {option.label}
              </button>
            </template>
          </div>
        </template>

        <div class={lineWrapClass} data-id="line-wrap">
          <ol
            class="line"
            data-id="line"
            tabindex={lineTabIndex}
            aria-labelledby="career-heading"
            onscroll={handleLineScroll}
          >
            <template for:each={linePoints} for:item="point">
              <li
                key={point.key}
                class={point.pointClass}
                data-id="line-point"
                data-key={point.key}
                data-type={point.type}
              >
                <span class="dot" aria-hidden="true"></span>
                <template lwc:if={point.hasPanel}>
                  <button
                    type="button"
                    class="point-body point-button"
                    aria-expanded={point.expanded}
                    aria-controls={point.controls}
                    data-point-button="true"
                    data-list="line"
                    data-key={point.key}
                    onclick={handlePointClick}
                  >
                    <span class="point-first"
                      >{point.first}<span class="visually-hidden"
                        >{comma}</span
                      ></span
                    >
                    <template lwc:if={point.hasSecond}>
                      <span class="point-second"
                        >{point.second}<span class="visually-hidden"
                          >{comma}</span
                        ></span
                      >
                    </template>
                    <span class="years"
                      ><span aria-hidden="true">{point.years}</span
                      ><span class="visually-hidden">{point.yearsSpoken}</span
                      ><template lwc:if={point.isCurrent}
                        ><span class="active-tag" aria-hidden="true"
                          >Active</span
                        ></template
                      >
                      <svg
                        class="point-chevron"
                        aria-hidden="true"
                        width="12"
                        height="12"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <polyline points="6 9 12 15 18 9"></polyline></svg
                    ></span>
                  </button>
                </template>
                <template lwc:else>
                  <div class="point-body">
                    <span class="point-first"
                      >{point.first}<span class="visually-hidden"
                        >{comma}</span
                      ></span
                    >
                    <template lwc:if={point.hasSecond}>
                      <span class="point-second"
                        >{point.second}<span class="visually-hidden"
                          >{comma}</span
                        ></span
                      >
                    </template>
                    <span class="years"
                      ><span aria-hidden="true">{point.years}</span
                      ><span class="visually-hidden">{point.yearsSpoken}</span
                      ><template lwc:if={point.isCurrent}
                        ><span class="active-tag" aria-hidden="true"
                          >Active</span
                        ></template
                      ></span
                    >
                  </div>
                </template>
              </li>
            </template>
          </ol>
        </div>

        <div
          id="career-panel"
          class={linePanelClass}
          data-id="line-panel"
          hidden={linePanelHidden}
        >
          <template lwc:if={openPoint}>
            <p class="panel-head">
              <span class="panel-title">{openPoint.panelTitle}</span>
              <template lwc:if={openPoint.meta}>
                <span class="panel-meta">{openPoint.meta}</span>
              </template>
            </p>
            <ul class="highlights">
              <template for:each={openPoint.items} for:item="item">
                <li key={item.key}>{item.text}</li>
              </template>
            </ul>
            <template lwc:if={openPoint.hasVerify}>
              <p class="panel-verify">
                <a
                  class="verify-link"
                  href={openPoint.verifyHref}
                  target="_blank"
                  rel="noopener noreferrer"
                  data-id="panel-verify-link"
                  >Verify on Trailhead<span class="visually-hidden"
                    >{newTabNote}</span
                  ></a
                >
              </p>
            </template>
          </template>
        </div>

        <ol class="stack" data-id="stack" aria-labelledby="career-heading">
          <template for:each={stackPoints} for:item="point">
            <li
              key={point.key}
              class={point.pointClass}
              data-id="stack-point"
              data-key={point.key}
              data-type={point.type}
            >
              <span class="dot" aria-hidden="true"></span>
              <template lwc:if={point.hasPanel}>
                <button
                  type="button"
                  class="point-body point-button"
                  aria-expanded={point.expanded}
                  aria-controls={point.controls}
                  data-point-button="true"
                  data-list="stack"
                  data-key={point.key}
                  onclick={handlePointClick}
                >
                  <span class="point-first"
                    >{point.first}<span class="visually-hidden"
                      >{comma}</span
                    ></span
                  >
                  <template lwc:if={point.hasSecond}>
                    <span class="point-second"
                      >{point.second}<span class="visually-hidden"
                        >{comma}</span
                      ></span
                    >
                  </template>
                  <span class="years"
                    ><span aria-hidden="true">{point.years}</span
                    ><span class="visually-hidden">{point.yearsSpoken}</span
                    ><template lwc:if={point.isCurrent}
                      ><span class="active-tag" aria-hidden="true"
                        >Active</span
                      ></template
                    >
                    <svg
                      class="point-chevron"
                      aria-hidden="true"
                      width="12"
                      height="12"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <polyline points="6 9 12 15 18 9"></polyline></svg
                  ></span>
                </button>
                <div
                  id={point.stackPanelId}
                  class={point.stackPanelClass}
                  data-id="stack-panel"
                  hidden={point.stackPanelHidden}
                >
                  <ul class="highlights">
                    <template for:each={point.items} for:item="item">
                      <li key={item.key}>{item.text}</li>
                    </template>
                  </ul>
                  <template lwc:if={point.hasVerify}>
                    <p class="panel-verify">
                      <a
                        class="verify-link"
                        href={point.verifyHref}
                        target="_blank"
                        rel="noopener noreferrer"
                        data-id="panel-verify-link"
                        >Verify on Trailhead<span class="visually-hidden"
                          >{newTabNote}</span
                        ></a
                      >
                    </p>
                  </template>
                </div>
              </template>
              <template lwc:else>
                <div class="point-body">
                  <span class="point-first"
                    >{point.first}<span class="visually-hidden"
                      >{comma}</span
                    ></span
                  >
                  <template lwc:if={point.hasSecond}>
                    <span class="point-second"
                      >{point.second}<span class="visually-hidden"
                        >{comma}</span
                      ></span
                    >
                  </template>
                  <span class="years"
                    ><span aria-hidden="true">{point.years}</span
                    ><span class="visually-hidden">{point.yearsSpoken}</span
                    ><template lwc:if={point.isCurrent}
                      ><span class="active-tag" aria-hidden="true"
                        >Active</span
                      ></template
                    ></span
                  >
                </div>
              </template>
            </li>
          </template>
        </ol>

        <template lwc:if={showVerify}>
          <p class="career-foot">
            <a
              class="verify-link"
              href={verificationUrl}
              target="_blank"
              rel="noopener noreferrer"
              data-id="verify-link"
              >Verify on Trailhead<span class="visually-hidden"
                >{newTabNote}</span
              ></a
            >
          </p>
        </template>
      </section>
    </div>
  </template>
</template>
