<template>
  <template lwc:if={hasStops}>
    <div class={careerClass} data-id="career">
      <section class="section" aria-labelledby="career-heading">
        <div class="heading-row">
          <h2
            id="career-heading"
            class="section-heading"
            data-id="career-heading"
          >
            Work
          </h2>
          <c-data-source
            source-keys="ResumeController_TimelineRoles"
            class="card-source"
          ></c-data-source>
        </div>

        <div class="intro-row">
          <p class="intro">
            Open any employer to see each role. Several can be open at once.
          </p>
          <button
            type="button"
            class="btn btn-secondary"
            data-id="expand-all"
            onclick={handleExpandAll}
          >
            {expandAllLabel}
          </button>
        </div>

        <ol class="track" data-id="track" aria-labelledby="career-heading">
          <template for:each={trackStops} for:item="stop">
            <li
              key={stop.key}
              class={stop.stopClass}
              data-id="stop"
              data-key={stop.key}
            >
              <span class={stop.dotClass} aria-hidden="true"></span>
              <div class="stop-head">
                <span class="stop-employer" data-id="stop-employer"
                  >{stop.employer}</span
                >
                <span class="stop-span" data-id="stop-span">{stop.span}</span>
                <template lwc:if={stop.hasTitle}>
                  <span class="stop-title" data-id="stop-title"
                    >{stop.title}</span
                  >
                </template>
              </div>
              <button
                type="button"
                class="toggle"
                data-id="toggle"
                data-key={stop.key}
                aria-expanded={stop.expanded}
                aria-controls={stop.panelId}
                onclick={handleToggle}
              >
                {stop.countText} · {stop.toggleText}
              </button>
              <div id={stop.panelId} class={stop.panelClass} data-id="panel">
                <div class="panel-clip">
                  <template lwc:if={stop.isFold}>
                    <ul class="earlier">
                      <template for:each={stop.roles} for:item="role">
                        <li
                          key={role.key}
                          class="earlier-line"
                          data-id="earlier-role"
                        >
                          {role.line}
                        </li>
                      </template>
                    </ul>
                    <a
                      class="panel-link"
                      href={resumeHref}
                      data-id="fold-resume-link"
                      >See the full resume →</a
                    >
                  </template>
                  <template lwc:else>
                    <ul class="roles">
                      <template for:each={stop.roles} for:item="role">
                        <li key={role.key} class="role" data-id="role">
                          <span class="role-title" data-id="role-title"
                            >{role.title}</span
                          >
                          <span class="role-years" data-id="role-years"
                            >{role.yearsText}</span
                          >
                          <template lwc:if={role.hasHighlights}>
                            <ul class="highlights">
                              <template
                                for:each={role.highlights}
                                for:item="highlight"
                              >
                                <li
                                  key={highlight.id}
                                  class="highlight"
                                  data-id="highlight"
                                >
                                  {highlight.text}
                                </li>
                              </template>
                            </ul>
                          </template>
                        </li>
                      </template>
                    </ul>
                  </template>
                </div>
              </div>
            </li>
          </template>
        </ol>

        <div class="career-foot">
          <a class="btn btn-primary" href={resumeHref} data-id="resume-link"
            >See the full resume →</a
          >
        </div>
      </section>
    </div>
  </template>
</template>
