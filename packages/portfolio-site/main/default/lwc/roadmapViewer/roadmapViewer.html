<template>
  <section class="roadmap" aria-labelledby="roadmap-heading">
    <header class="roadmap-header">
      <h2 id="roadmap-heading" class="roadmap-title">Product Roadmap</h2>
      <div class="roadmap-meta">
        <c-view-source source-key="roadmapViewer"></c-view-source>
        <template lwc:if={statusBadge}>
          <span class={statusBadge.className} data-id="status-badge"
            >{statusBadge.label}</span
          >
        </template>
        <template lwc:if={ageText}>
          <span class={ageClass} data-id="age-label">{ageText}</span>
        </template>
        <label class="simulate-switch">
          <input
            type="checkbox"
            role="switch"
            class="simulate-input"
            data-id="simulate-switch"
            aria-describedby="simulate-hint"
            checked={simulate}
            onchange={handleSimulateChange}
          />
          <span class="simulate-label">Simulate an outage</span>
        </label>
      </div>
    </header>
    <p id="simulate-hint" class="simulate-hint" data-id="simulate-hint">
      {simulateHint}
    </p>

    <p class="status-note" data-id="status-note" aria-live="polite">
      {statusNote}
    </p>

    <template lwc:if={isLoading}>
      <p class="roadmap-message" data-id="loading">Loading the roadmap</p>
    </template>

    <template lwc:if={showBoard}>
      <template lwc:if={isPhone}>
        <div
          class="roadmap-tabs"
          role="tablist"
          aria-label="Roadmap status"
          data-id="tablist"
        >
          <template for:each={tabs} for:item="tab">
            <button
              key={tab.category}
              type="button"
              id={tab.tabId}
              class={tab.className}
              role="tab"
              aria-selected={tab.tabSelected}
              aria-controls={tab.panelId}
              tabindex={tab.tabIndex}
              data-category={tab.category}
              data-tab={tab.category}
              onclick={handleTabClick}
              onkeydown={handleTabKeydown}
            >
              {tab.tabText}
            </button>
          </template>
        </div>
      </template>
      <div class="roadmap-board">
        <template for:each={columns} for:item="column">
          <div
            key={column.category}
            id={column.panelId}
            class={column.columnClass}
            role={column.panelRole}
            aria-labelledby={column.panelLabelledBy}
            hidden={column.panelHidden}
            data-category={column.category}
          >
            <h3 class="column-title">
              {column.label}
              <span class="column-count">({column.count})</span>
            </h3>
            <ul class="card-list">
              <template for:each={column.cards} for:item="card">
                <li key={card.key} class={card.className} data-key={card.key}>
                  <div class="card-top">
                    <span class="card-key" data-id="key">{card.key}</span>
                    <template lwc:if={card.isEpic}>
                      <span class="epic-label" data-id="epic-label">Epic</span>
                    </template>
                    <template lwc:else>
                      <span class="card-type" data-id="type">{card.type}</span>
                    </template>
                  </div>
                  <p class="card-summary" data-id="summary">{card.summary}</p>
                  <template lwc:if={card.parentText}>
                    <p class="card-parent" data-id="epic-key">
                      {card.parentText}
                    </p>
                  </template>
                </li>
              </template>
            </ul>
            <template lwc:if={column.isCapped}>
              <ul
                class="card-list card-list-more"
                id={column.moreId}
                data-id="column-more"
                data-category={column.category}
              >
                <template for:each={column.hiddenCards} for:item="card">
                  <li key={card.key} class={card.className} data-key={card.key}>
                    <div class="card-top">
                      <span class="card-key" data-id="key">{card.key}</span>
                      <template lwc:if={card.isEpic}>
                        <span class="epic-label" data-id="epic-label"
                          >Epic</span
                        >
                      </template>
                      <template lwc:else>
                        <span class="card-type" data-id="type"
                          >{card.type}</span
                        >
                      </template>
                    </div>
                    <p class="card-summary" data-id="summary">{card.summary}</p>
                    <template lwc:if={card.parentText}>
                      <p class="card-parent" data-id="epic-key">
                        {card.parentText}
                      </p>
                    </template>
                  </li>
                </template>
              </ul>
              <button
                type="button"
                class="show-all"
                data-id="show-all"
                data-category={column.category}
                aria-expanded={column.toggleExpanded}
                aria-controls={column.moreId}
                onclick={handleToggle}
              >
                {column.toggleLabel}
              </button>
            </template>
            <template lwc:if={column.isEmpty}>
              <p class="column-empty">Nothing here right now.</p>
            </template>
          </div>
        </template>
      </div>
    </template>

    <template lwc:if={showEmpty}>
      <p class="roadmap-message" data-id="empty">{emptyText}</p>
    </template>

    <template lwc:if={showUnavailable}>
      <p class="roadmap-message" data-id="unavailable">
        Roadmap temporarily unavailable
      </p>
    </template>
  </section>
</template>
