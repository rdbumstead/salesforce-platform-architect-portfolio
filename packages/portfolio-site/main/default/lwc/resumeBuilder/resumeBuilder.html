<template>
  <lightning-card
    title="Resume Generator"
    icon-name="doctype:pdf"
    class="builder-card"
  >
    <template lwc:if={actionsInHeader}>
      <div slot="actions" class="card-actions">
        <c-view-source source-key="resumeBuilder"></c-view-source>
        <c-data-source
          source-keys="ResumeController_Roles,ResumeController_Skills,ResumeController_Certifications,ResumeController_Education,ResumeController_Highlights"
        ></c-data-source>
      </div>
    </template>
    <div class="builder-body">
      <template lwc:if={actionsInBody}>
        <div class="card-actions card-actions_body">
          <c-view-source source-key="resumeBuilder"></c-view-source>
          <c-data-source
            source-keys="ResumeController_Roles,ResumeController_Skills,ResumeController_Certifications,ResumeController_Education,ResumeController_Highlights"
          ></c-data-source>
        </div>
      </template>
      <div class="builder-grid">
        <div class="config-column">
          <div class="config-panel">
            <h2 class="config-title">Configuration</h2>

            <div class="nc-field persona-field slds-m-bottom_medium">
              <label class="nc-label" for="persona-picker">Tailor for</label>
              <select
                id="persona-picker"
                name="persona"
                class="nc-control persona-picker"
                onchange={handlePersonaChange}
              >
                <template for:each={personaChoices} for:item="option">
                  <option
                    key={option.value}
                    value={option.value}
                    selected={option.selected}
                  >
                    {option.label}
                  </option>
                </template>
              </select>
            </div>

            <div class="slds-form-element slds-m-bottom_medium">
              <lightning-input
                type="checkbox"
                label="Include header"
                checked={includeHeader}
                onchange={handleToggle}
                data-field="includeHeader"
              ></lightning-input>
              <lightning-input
                type="checkbox"
                label="Include skills"
                checked={includeSkills}
                onchange={handleToggle}
                data-field="includeSkills"
              ></lightning-input>
            </div>

            <div class="actions">
              <button
                type="button"
                class="nc-button download-pdf"
                onclick={handleDownload}
                disabled={exportDisabled}
              >
                {downloadLabel}
              </button>
              <button
                type="button"
                class="nc-button nc-button_secondary copy-ats"
                onclick={handleCopyText}
                disabled={exportDisabled}
              >
                Copy ATS text
              </button>
            </div>

            <div aria-live="polite" class="slds-m-top_small">
              <p lwc:if={exportMessage} class="export-message text-success">
                {exportMessage}
              </p>
              <p lwc:if={exportError} class="export-error text-error">
                {exportError}
              </p>
            </div>
          </div>
        </div>

        <div class="preview-column">
          <div class="preview-paper" style={paperStyle} aria-busy={isLoading}>
            <template lwc:if={isLoading}>
              <div
                class="loading-state slds-is-relative slds-p-around_xx-large"
              >
                <lightning-spinner
                  alternative-text="Loading resume"
                  size="small"
                ></lightning-spinner>
              </div>
            </template>

            <template lwc:if={hasError}>
              <div class="error-state paper-error" role="alert">
                <p>The resume could not be loaded.</p>
                <p>{errorMessage}</p>
              </div>
            </template>

            <template lwc:if={isEmpty}>
              <p class="empty-state paper-muted">
                No resume content is available for this persona yet.
              </p>
            </template>

            <template lwc:if={hasContent}>
              <template lwc:if={model.hasHeader}>
                <header class="preview-header">
                  <h2 class="resume-name">{model.header.name}</h2>
                  <p class="resume-title">{model.header.title}</p>
                  <ul class="resume-links">
                    <template for:each={model.header.links} for:item="link">
                      <li key={link.key} class="resume-link">
                        <a
                          href={link.url}
                          target="_blank"
                          rel="noopener noreferrer"
                          >{link.label}</a
                        >
                      </li>
                    </template>
                  </ul>
                  <p
                    lwc:if={model.header.careerObjective}
                    class="resume-objective"
                  >
                    {model.header.careerObjective}
                  </p>
                </header>
              </template>

              <template for:each={model.sections} for:item="section">
                <section key={section.key} class={section.className}>
                  <h3 class="section-title">{section.title}</h3>

                  <template lwc:if={section.isExperience}>
                    <template for:each={model.employers} for:item="group">
                      <div key={group.key} class="resume-employer">
                        <div lwc:if={group.isStacked} class="role-row">
                          <strong class="role-heading employer-heading"
                            >{group.employer}</strong
                          >
                          <span class="role-dates">{group.spanText}</span>
                        </div>
                        <template for:each={group.roles} for:item="role">
                          <div key={role.key} class="resume-role">
                            <div class="role-row">
                              <template lwc:if={group.isStacked}>
                                <strong class="role-heading role-title"
                                  >{role.title}</strong
                                >
                              </template>
                              <template lwc:else>
                                <strong class="role-heading"
                                  >{role.heading}</strong
                                >
                              </template>
                              <span class="role-dates">{role.datesText}</span>
                            </div>
                            <ul
                              lwc:if={role.highlights.length}
                              class="role-list"
                            >
                              <template
                                for:each={role.highlights}
                                for:item="highlight"
                              >
                                <li key={highlight.key} class="role-highlight">
                                  {highlight.text}
                                </li>
                              </template>
                            </ul>
                          </div>
                        </template>
                      </div>
                    </template>
                    <p lwc:if={model.hasEarlierRoles} class="earlier-roles">
                      <strong class="item-label"
                        >{model.earlierRoles.labelText}</strong
                      >{model.earlierRoles.text}
                    </p>
                  </template>

                  <template lwc:if={section.isSkills}>
                    <template for:each={model.skillGroups} for:item="group">
                      <p key={group.key} class="skill-group">
                        <strong lwc:if={group.labelText} class="item-label"
                          >{group.labelText}</strong
                        >{group.skillsText}
                      </p>
                    </template>
                  </template>

                  <template lwc:if={section.isCertifications}>
                    <template
                      for:each={model.certificationGroups}
                      for:item="group"
                    >
                      <div key={group.key} class="certification-group">
                        <p lwc:if={group.hasIssuer} class="issuer-label">
                          {group.issuer}
                        </p>
                        <ul class="current-certifications plain-list">
                          <template
                            for:each={group.certifications}
                            for:item="cert"
                          >
                            <li key={cert.key} class="certification">
                              {cert.text}
                            </li>
                          </template>
                        </ul>
                      </div>
                    </template>
                    <p lwc:if={model.hasVerificationLink} class="verify">
                      <a
                        class="verify-link"
                        href={model.verificationUrl}
                        target="_blank"
                        rel="noopener noreferrer"
                        >{model.verifyLabel}<span class="slds-assistive-text">
                          (opens in a new tab)</span
                        ></a
                      >
                    </p>
                    <template lwc:if={model.hasRetiredCertifications}>
                      <h4 class="retired-title">{model.retiredLabel}</h4>
                      <ul class="retired-certifications plain-list">
                        <template
                          for:each={model.retiredCertifications}
                          for:item="cert"
                        >
                          <li key={cert.key} class="retired-certification">
                            {cert.text}
                          </li>
                        </template>
                      </ul>
                    </template>
                  </template>

                  <template lwc:if={section.isEducation}>
                    <ul class="plain-list">
                      <template for:each={model.education} for:item="edu">
                        <li key={edu.key} class="education">{edu.text}</li>
                      </template>
                    </ul>
                  </template>
                </section>
              </template>
            </template>
          </div>
        </div>
      </div>
    </div>
  </lightning-card>
</template>
