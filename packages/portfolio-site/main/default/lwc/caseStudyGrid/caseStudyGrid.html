<template>
  <template lwc:if={hasCards}>
    <div class="case-studies">
      <section class="section" aria-labelledby="case-studies-heading">
        <h2
          id="case-studies-heading"
          class="section-heading heading"
          data-id="case-heading"
          tabindex="-1"
        >
          Case studies
        </h2>
        <div class="heading-row tools" data-id="tools">
          <c-view-source source-key="caseStudyGrid"></c-view-source>
          <c-data-source
            source-keys="ProjectCardController_HomeCaseStudies"
            class="card-source"
          ></c-data-source>
        </div>
        <p class="section-intro" data-id="framing">
          Client work, personal builds and this site.
        </p>
        <ul class="cards featured" data-id="cards">
          <template for:each={featuredCards} for:item="card">
            <li key={card.key} class="card" data-id="card" data-tier="featured">
              <article class="card-body">
                <div class="card-text">
                  <template lwc:if={card.hasHeadline}>
                    <p class="metric" data-id="metric">
                      <span class="metric-kicker">Outcome&nbsp;</span>
                      <span class="metric-number">{card.headlineMetric}</span>
                      <span class="metric-label">{card.headlineLabel}</span>
                    </p>
                  </template>
                  <h3 class="card-title">{card.title}</h3>
                  <template lwc:if={card.clientLine}>
                    <p class="client" data-id="client">{card.clientLine}</p>
                  </template>
                  <template lwc:if={card.myPart}>
                    <p class="line" data-id="my-part">
                      <span class="line-label">My part&nbsp;</span>
                      <span class="line-text">{card.myPart}</span>
                    </p>
                  </template>
                  <template lwc:if={card.contextLine}>
                    <p class="line" data-id="context">
                      <span class="line-label">Context&nbsp;</span>
                      <span class="line-text">{card.contextLine}</span>
                    </p>
                  </template>
                  <template lwc:if={card.decisionLine}>
                    <p class="line" data-id="decision">
                      <span class="line-label">Decision&nbsp;</span>
                      <span class="line-text">{card.decisionLine}</span>
                    </p>
                  </template>
                  <div class="card-action">
                    <a
                      class="card-link"
                      href={card.href}
                      aria-label={card.buttonLabel}
                      data-id="card-button"
                      data-name={card.title}
                      data-position={card.position}
                      onclick={handleLinkClick}
                      >Read the case study <span aria-hidden="true">→</span></a
                    >
                  </div>
                </div>
                <template lwc:if={card.figureKey}>
                  <div
                    class="card-figure"
                    data-id="figure"
                    data-figure-key={card.figureKey}
                  ></div>
                </template>
              </article>
            </li>
          </template>
        </ul>
        <template lwc:if={hasMore}>
          <h3 class="more-heading" data-id="more-heading">More work</h3>
          <ul class="cards more" data-id="more-cards">
            <template for:each={moreCards} for:item="card">
              <li key={card.key} class="row" data-id="card" data-tier="more">
                <article class="row-body">
                  <template lwc:if={card.hasHeadline}>
                    <p class="row-metric" data-id="metric">
                      <span class="metric-number">{card.headlineMetric}</span>
                      <span class="metric-label">{card.headlineLabel}</span>
                    </p>
                  </template>
                  <h4 class="row-title">{card.title}</h4>
                  <template lwc:if={card.myPart}>
                    <p class="line" data-id="my-part">
                      <span class="line-label">My part&nbsp;</span>
                      <span class="line-text">{card.myPart}</span>
                    </p>
                  </template>
                  <div class="card-action">
                    <a
                      class="card-link"
                      href={card.href}
                      aria-label={card.buttonLabel}
                      data-id="card-button"
                      data-name={card.title}
                      data-position={card.position}
                      onclick={handleLinkClick}
                      >Read the case study <span aria-hidden="true">→</span></a
                    >
                  </div>
                </article>
              </li>
            </template>
          </ul>
        </template>
        <p class="confidential" data-id="confidential">
          Client work stays private. The pictures show the design, never client
          names or data.
        </p>
      </section>
    </div>
  </template>
</template>
