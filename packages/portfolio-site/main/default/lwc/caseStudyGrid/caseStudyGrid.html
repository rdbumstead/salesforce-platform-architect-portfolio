<template>
  <template lwc:if={hasCards}>
    <div class="case-studies">
      <section class="section" aria-labelledby="case-studies-heading">
        <h2
          id="case-studies-heading"
          class="section-heading"
          data-id="case-heading"
          tabindex="-1"
        >
          Case studies
        </h2>
        <p class="section-intro">
          Client names are left out. Pick one for the problem, the call I made
          and how it turned out.
        </p>
        <ul class="cards" data-id="cards">
          <template for:each={cards} for:item="card">
            <li key={card.key} class="card" data-id="card">
              <article class="card-body">
                <template lwc:if={card.hasHeadline}>
                  <p class="metric" data-id="metric">
                    <span class="metric-number">{card.headlineMetric}</span>
                    <span class="metric-label">{card.headlineLabel}</span>
                  </p>
                </template>
                <template lwc:else>
                  <p
                    class="metric metric-spacer"
                    data-id="metric-spacer"
                    aria-hidden="true"
                  >
                    <span class="metric-number">&nbsp;</span>
                    <span class="metric-label">&nbsp;</span>
                  </p>
                </template>
                <h3 class="card-title">
                  <a
                    class="card-link"
                    href={card.href}
                    data-id="card-link"
                    data-name={card.title}
                    onclick={handleLinkClick}
                    >{card.title}</a
                  >
                </h3>
                <template lwc:if={card.clientLine}>
                  <p class="client" data-id="client">{card.clientLine}</p>
                </template>
                <span class="card-go" aria-hidden="true">→</span>
              </article>
            </li>
          </template>
        </ul>
      </section>
    </div>
  </template>
</template>
