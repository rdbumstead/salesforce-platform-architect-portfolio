<template>
  <template lwc:if={showEmptyNotice}>
    <section class="wall wall-empty" aria-label="Reviews">
      <p class="no-reviews" data-id="no-reviews">
        There are no reviews yet. Yours can be the first, and the form is just
        below.
      </p>
    </section>
  </template>
  <template lwc:if={hasItems}>
    <section class="wall" aria-labelledby="wall-heading">
      <div class="title-row heading-row">
        <h2 id="wall-heading" class="section-heading wall-title">
          What people say
        </h2>
        <c-data-source
          source-keys="TestimonialController_Approved"
          class="card-source heading-badge-end"
        ></c-data-source>
      </div>
      <div
        class="filter nc-toggle-group"
        role="group"
        aria-label="Show testimonials"
      >
        <button
          type="button"
          class="filter-button nc-toggle"
          aria-pressed={allPressed}
          data-filter="all"
          data-id="filter-all"
          onclick={handleFilter}
        >
          All
        </button>
        <button
          type="button"
          class="filter-button nc-toggle"
          aria-pressed={professionalPressed}
          data-filter="professional"
          data-id="filter-professional"
          onclick={handleFilter}
        >
          Professional
        </button>
      </div>
      <p class="count" aria-live="polite" data-id="count">{countText}</p>
      <template lwc:if={hasVisible}>
        <ul class="cards">
          <template for:each={visibleItems} for:item="item">
            <li key={item.key} class={item.cardClass} data-id="card">
              <figure class="quote">
                <blockquote class="sentence">
                  <p>{item.sentence}</p>
                  <template lwc:if={item.note}>
                    <p class="note">{item.note}</p>
                  </template>
                </blockquote>
                <figcaption class="byline">
                  <span class="author">{item.authorName}</span>
                  <template lwc:if={item.byline}>
                    <span class="detail">{item.byline}</span>
                  </template>
                  <span class="tone pill">{item.toneLabel}</span>
                </figcaption>
              </figure>
            </li>
          </template>
        </ul>
      </template>
      <template lwc:else>
        <p class="empty" data-id="empty">
          No professional testimonials yet. Choose All to see every one.
        </p>
      </template>
    </section>
  </template>
</template>
