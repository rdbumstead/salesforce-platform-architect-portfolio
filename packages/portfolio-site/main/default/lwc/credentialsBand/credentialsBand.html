<template>
  <template lwc:if={hasContent}>
    <div class="band">
      <section class="section" aria-label="Education and certifications">
        <div class="columns">
          <div class="column" data-id="education-column">
            <div class="heading-row">
              <h2 class="section-heading" data-id="education-heading">
                Education
              </h2>
            </div>
            <ul class="tiles">
              <template for:each={degrees} for:item="degree">
                <li key={degree.key} class="tile" data-id="degree-tile">
                  <span class="media circle" aria-hidden="true">
                    <svg
                      class="cap"
                      viewBox="0 0 24 24"
                      width="40"
                      height="40"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.6"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      focusable="false"
                    >
                      <path d="M2 9l10-5 10 5-10 5z"></path>
                      <path
                        d="M6 11.5v4.5c0 1.4 2.7 3 6 3s6-1.6 6-3v-4.5"
                      ></path>
                      <path d="M22 9v6"></path>
                    </svg>
                  </span>
                  <span class="tile-text" data-id="degree-text"
                    >{degree.text}</span
                  >
                  <span class="tile-caption" data-id="degree-caption"
                    >{degree.caption}</span
                  >
                </li>
              </template>
            </ul>
          </div>

          <div class="column divided" data-id="certification-column">
            <div class="heading-row">
              <h2 class="section-heading" data-id="certification-heading">
                Certifications
              </h2>
              <c-data-source
                source-keys="ResumeController_Education,ResumeController_Certifications"
                hide-counts
                class="card-source"
              ></c-data-source>
              <template lwc:if={hasVerify}>
                <a
                  class="btn btn-primary"
                  data-id="verify"
                  href={verificationUrl}
                  target="_blank"
                  rel="noopener noreferrer"
                  >Verify on Trailhead &#8599;</a
                >
              </template>
            </div>
            <ul class="tiles">
              <template for:each={certTiles} for:item="tile">
                <li key={tile.key} class="tile" data-id="cert-tile">
                  <template lwc:if={tile.hasImage}>
                    <img
                      class="badge"
                      data-id="badge"
                      data-key={tile.key}
                      src={tile.src}
                      alt={tile.full}
                      width="86"
                      height="84"
                      loading="lazy"
                      decoding="async"
                      onerror={handleImageError}
                    />
                  </template>
                  <template lwc:else>
                    <span
                      class="media circle"
                      data-id="fallback"
                      aria-hidden="true"
                      >{tile.initials}</span
                    >
                  </template>
                  <span class="tile-text" data-id="cert-text">{tile.text}</span>
                  <span class="tile-caption" data-id="cert-caption"
                    >{tile.caption}</span
                  >
                </li>
              </template>
            </ul>
          </div>
        </div>
      </section>
    </div>
  </template>
</template>
