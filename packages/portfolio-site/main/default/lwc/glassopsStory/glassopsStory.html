      <h2 id="context-heading" class="story-heading section-heading">
        Context
      </h2>
      <p>
        A Salesforce release pipeline usually answers one question: did the
        deploy succeed. It rarely answers the ones an auditor or a tired release
        manager asks later. Was this the change that was reviewed? Was it tested
        against the org it went to? Who approved it? Did the org end up holding
        what we meant to ship?
      </p>
      <p>
        On most teams those answers live in a CI log, a chat thread and
        somebody's memory. The checks themselves are shell steps copied from one
        workflow file to the next, and each copy drifts. A deploy to the wrong
        org or a deploy of a change nobody validated is one bad variable away.
      </p>
      <p>
        I wanted the release path for this site to be something I could defend
        line by line. So I built GlassOps, an open source command line tool
        (Apache 2.0) that is the release pipeline itself. It works out what
        changed, checks it, records a signed decision about whether it may ship,
        deploys only under that decision, and then reads the org back to confirm
        the result.
      </p>

    <section

      <h2 id="decision-heading" class="story-heading section-heading">
        Decision
      </h2>
      <p>
        The model came from Terraform. Plan the change, check the plan against
        policy, then apply exactly the plan that was checked. Infrastructure
        teams have worked that way for years, and I wanted the same discipline
        for Salesforce releases.
      </p>
      <p>
        The core call was to make the decision a file. Each step is its own
        command: plan, validate, gate, deploy, verify, report. The gate step
        runs the policy rules and writes a signed permit (PERMIT in the docs)
        that names the target org, the commit, the plan and the config. The
        deploy step refuses to touch an org without a valid permit for exactly
        that change. A deny is signed and kept too, so the record shows what was
        blocked and why.
      </p>
      <p>
        The second call was to fail closed. Missing evidence is never a pass. If
        a rule needs a fact that is not there, or a tool breaks while gathering
        it, the answer is no. Before any step touches an org, a guard compares
        the org the login reached with the org the config names, so a wrong
        credential stops the run before it can do anything.
      </p>
      <p>
        The third call was to make the safe path the fast one. Validate runs the
        tests once in a check only run against production. The gate binds that
        validation into the permit, and deploy then quick deploys the already
        validated change. The tests run once, and what ships is the thing that
        was tested. After the deploy, verify reads the org back and compares it
        with the plan.
      </p>
      <p data-id="go-reasons">
        I wrote it in Go. It is the language most cloud tooling is written in,
        and the tools GlassOps works with for policy and signing are Go projects
        too. It is type safe, and its standard library is strong. It also
        compiles to one binary for any platform with no runtime to install,
        which keeps the tool independent of any one CI system and leaves room to
        add providers beyond Salesforce.
      </p>
    </section>
