<template>
  <section class="numbers" aria-labelledby="numbers-heading">
    <p class="eyebrow">Counted from records</p>
    <div class="title-row">
      <h2 class="heading" id="numbers-heading">By the numbers</h2>
      <c-data-source
        source-keys="PortfolioStatsController_Approved,PortfolioStatsController_Waiting,PortfolioStatsController_UsageCounters,PortfolioStatsController_DeployRuns,PortfolioStatsController_LatestDeploy,PortfolioStatsController_IssuedTokens"
        hide-counts
        class="card-source"
      ></c-data-source>
    </div>

    <template lwc:if={isLoading}>
      <p class="note" role="status">Loading the counts.</p>
      <ul class="stats stats-pending" aria-hidden="true" data-placeholder>
        <template for:each={placeholderTiles} for:item="tile">
          <li class="stat" key={tile.key}>
            <p class="value">{tile.valueText}</p>
            <p class="label">{tile.label}</p>
            <p class="detail">{tile.detail}</p>
            <template lwc:if={tile.hasLine}>
              <p class="plain-line">{tile.line}</p>
            </template>
          </li>
        </template>
      </ul>
    </template>
    <template lwc:elseif={hasError}>
      <p class="note" role="status">The counts could not be loaded.</p>
    </template>
    <template lwc:elseif={hasStats}>
      <ul class="stats">
        <template for:each={tiles} for:item="tile">
          <li class="stat" key={tile.key} data-stat={tile.key}>
            <template lwc:if={tile.hasValue}>
              <p class="value">
                <span class={finalClass}>{tile.valueText}</span>
                <template lwc:if={isCounting}>
                  <span class="value-live" aria-hidden="true"
                    >{tile.liveText}</span
                  >
                </template>
              </p>
            </template>
            <template lwc:else>
              <p class="message">{tile.message}</p>
            </template>
            <p class="label">{tile.label}</p>
            <template lwc:if={tile.hasDetail}>
              <p class="detail">{tile.detail}</p>
            </template>
            <template lwc:if={tile.hasLine}>
              <p class="plain-line">{tile.line}</p>
            </template>
          </li>
        </template>
      </ul>

      <details class="covers" data-covers>
        <summary class="covers-summary">What the tests cover</summary>
        <div class="covers-body">
          <p class="covers-intro">
            These groups are counted from the test files in the repository on
            {countedOn}. The Apex total above is what Salesforce reported after
            the newest deploy, so the two can differ.
          </p>
          <h3 class="covers-heading">
            Apex tests, {apexGroupsTotal} in the repository
          </h3>
          <ul class="groups" data-groups="apex">
            <template for:each={apexGroups} for:item="group">
              <li class="group" key={group.key}>
                <span class="group-name">{group.name}</span>
                <span class="group-count">{group.tests}</span>
              </li>
            </template>
          </ul>
          <h3 class="covers-heading">
            Jest tests, {jestGroupsTotal} in the repository
          </h3>
          <ul class="groups" data-groups="jest">
            <template for:each={jestGroups} for:item="group">
              <li class="group" key={group.key}>
                <span class="group-name">{group.name}</span>
                <span class="group-count">{group.tests}</span>
              </li>
            </template>
          </ul>
        </div>
      </details>

      <template lwc:if={hasApproved}>
        <div class="table-scroll">
          <table class="vibe-table">
            <caption>
              Testimonials by vibe
            </caption>
            <thead>
              <tr>
                <th scope="col">Vibe</th>
                <th scope="col" class="num">Approved</th>
              </tr>
            </thead>
            <tbody>
              <template for:each={vibeRows} for:item="row">
                <tr key={row.key} data-vibe={row.vibe}>
                  <th scope="row">{row.vibe}</th>
                  <td class="num">{row.approved}</td>
                </tr>
              </template>
            </tbody>
            <tfoot>
              <tr>
                <th scope="row">Total</th>
                <td class="num" data-total="approved">{approvedTotal}</td>
              </tr>
            </tfoot>
          </table>
        </div>
      </template>

      <p class="note">
        Each number is counted from Salesforce records. No record, name or
        message is sent to this page.
      </p>
    </template>
  </section>
</template>
