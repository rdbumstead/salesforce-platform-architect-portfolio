<template>
  <footer class="footer">
    <span class="copyright"
      >&copy; {currentYear} Ryan Bumstead. Built on Salesforce LWR.</span
    >

    <span class="metrics" data-id="metrics">
      <span class="metric deploy">
        <span class="status-dot" aria-hidden="true"></span>
        <span>deploy</span>
        <template lwc:if={badgeFailed}>
          <a
            class="target badge-fallback"
            data-id="badge-fallback"
            href={actionsUrl}
            target="_blank"
            rel="noopener noreferrer"
            >Production deploy status</a
          >
        </template>
        <template lwc:else>
          <a
            class="target badge-link"
            href={actionsUrl}
            target="_blank"
            rel="noopener noreferrer"
          >
            <img
              class="badge"
              data-id="badge"
              src={badgeUrl}
              alt="Production deploy status"
              height="20"
              onerror={handleBadgeError}
            />
          </a>
        </template>
      </span>

      <template lwc:if={graphqlLabel}>
        <span class="metric" data-id="graphql">{graphqlLabel}</span>
      </template>
      <template lwc:if={probeConstructor}>
        <lwc:component
          lwc:is={probeConstructor}
          data-id="graphql-probe"
          onprobe={handleProbe}
        ></lwc:component>
      </template>

      <template lwc:if={snapshotLoaded}>
        <template for:each={providerRows} for:item="row">
          <span key={row.key} class="metric" data-id="provider"
            >{row.label}</span
          >
        </template>
        <template for:each={integrationRows} for:item="row">
          <span key={row.key} class="metric" data-id="integration"
            >{row.label}</span
          >
        </template>
        <span
          class="metric target ai-requests"
          data-id="ai-requests"
          tabindex="0"
          onmouseenter={handleQuotaVisibility}
          onfocus={handleQuotaVisibility}
          >AI requests today: {aiRequestsToday}</span
        >
        <template for:each={quotaRows} for:item="row">
          <span key={row.key} class="metric" data-id="quota">{row.label}</span>
        </template>
        <template for:each={limitRows} for:item="row">
          <span key={row.key} class="metric" data-id="limit">{row.label}</span>
        </template>
      </template>
      <template lwc:elseif={snapshotFailed}>
        <span class="metric" data-id="snapshot-error">status unavailable</span>
      </template>
    </span>

    <span class="links">
      <a class="target" data-id="contact" href={contactUrl}>Contact</a>
      <template lwc:if={gitHubUrl}>
        <a
          class="target"
          data-id="github"
          href={gitHubUrl}
          target="_blank"
          rel="noopener noreferrer"
          >GitHub</a
        >
      </template>
      <template lwc:if={linkedInUrl}>
        <a
          class="target"
          data-id="linkedin"
          href={linkedInUrl}
          target="_blank"
          rel="noopener noreferrer"
          >LinkedIn</a
        >
      </template>
      <button
        type="button"
        class="target back-to-top"
        data-id="back-to-top"
        onclick={handleBackToTop}
      >
        Back to top <span aria-hidden="true">&uarr;</span>
      </button>
    </span>
  </footer>
</template>
