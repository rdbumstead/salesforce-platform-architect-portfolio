<template>
  <footer class="footer">
    <div class="footer__inner">
      <span class="copyright"
        >&copy; {currentYear} Ryan Bumstead. Built on Salesforce LWR.</span
      >

      <div class="metrics-head">
        <p class="metrics-caption" data-id="metrics-caption">
          Live readings from Salesforce and its integrations
        </p>
        <c-view-source source-key="footer"></c-view-source>
        <c-analytics-events></c-analytics-events>
        <c-view-source source-key="siteAnalytics"></c-view-source>
      </div>
      <div class="metrics" data-id="metrics">
        <div class="metric-group" data-group="ci">
          <span class="group-label" id="footer-group-ci">CI</span>
          <ul class="group-list" aria-labelledby="footer-group-ci">
            <template for:each={badgeRows} for:item="badge">
              <li key={badge.key} class="metric ci-badge" data-id="ci-badge">
                <template lwc:if={badge.failed}>
                  <a
                    class="target badge-fallback"
                    data-id={badge.fallbackId}
                    href={badge.href}
                    target="_blank"
                    rel="noopener noreferrer"
                    >{badge.label}</a
                  >
                </template>
                <template lwc:else>
                  <a
                    class="target badge-link"
                    href={badge.href}
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    <img
                      class="badge"
                      data-id={badge.imageId}
                      data-key={badge.key}
                      src={badge.src}
                      alt={badge.label}
                      height="20"
                      onerror={handleBadgeError}
                    />
                  </a>
                </template>
              </li>
            </template>
          </ul>
        </div>
        <template lwc:if={showPlatform}>
          <div class="metric-group" data-group="platform">
            <span class="group-label" id="footer-group-platform">Platform</span>
            <ul class="group-list" aria-labelledby="footer-group-platform">
              <template lwc:if={graphqlLabel}>
                <li class="metric" data-id="graphql">{graphqlLabel}</li>
              </template>
              <template lwc:if={snapshotFailed}>
                <li class="metric" data-id="snapshot-error">
                  status unavailable
                </li>
              </template>
            </ul>
          </div>
        </template>
        <template lwc:if={probeConstructor}>
          <lwc:component
            lwc:is={probeConstructor}
            class="graphql-probe"
            data-id="graphql-probe"
            onprobe={handleProbe}
          ></lwc:component>
        </template>

        <template lwc:if={snapshotLoaded}>
          <template lwc:if={showIntegrations}>
            <div class="metric-group" data-group="integrations">
              <span class="group-label" id="footer-group-integrations"
                >Integrations</span
              >
              <ul
                class="group-list"
                aria-labelledby="footer-group-integrations"
              >
                <template for:each={providerRows} for:item="row">
                  <li key={row.key} class="metric" data-id="provider">
                    {row.label}
                  </li>
                </template>
                <template for:each={integrationRows} for:item="row">
                  <li key={row.key} class="metric" data-id="integration">
                    {row.label}
                  </li>
                </template>
              </ul>
            </div>
          </template>
          <div
            class="metric-group"
            data-group="quotas"
            onkeydown={handleStorageKeydown}
          >
            <span class="group-label" id="footer-group-quotas"
              >Quotas and limits</span
            >
            <ul class="group-list" aria-labelledby="footer-group-quotas">
              <li class="metric">
                <span
                  class="target ai-requests"
                  data-id="ai-requests"
                  onmouseenter={handleQuotaVisibility}
                  >AI requests today: {aiRequestsToday}</span
                >
              </li>
              <template for:each={quotaRows} for:item="row">
                <li key={row.key} class="metric" data-id="quota">
                  {row.label}
                </li>
              </template>
              <template lwc:if={storageLine}>
                <li class="metric" data-id="storage">
                  Storage:
                  <button
                    type="button"
                    class="target storage-toggle"
                    data-id="storage-toggle"
                    aria-expanded={storageExpanded}
                    aria-controls="footer-storage-panel"
                    onclick={handleStorageToggle}
                  >
                    {storageLine}
                  </button>
                </li>
              </template>
              <template for:each={limitRows} for:item="row">
                <li key={row.key} class="metric" data-id="limit">
                  {row.label}
                </li>
              </template>
            </ul>
            <template lwc:if={storageLine}>
              <div
                class="storage-panel"
                id="footer-storage-panel"
                data-id="storage-panel"
                hidden={storagePanelHidden}
              >
                <p class="storage-title">Data by area</p>
                <ul class="storage-list">
                  <template for:each={storageDataRows} for:item="row">
                    <li key={row.key} data-id="storage-data">{row.label}</li>
                  </template>
                </ul>
                <template lwc:if={hasStorageFiles}>
                  <p class="storage-title">Files by kind</p>
                  <ul class="storage-list">
                    <template for:each={storageFileRows} for:item="row">
                      <li key={row.key} data-id="storage-file">{row.label}</li>
                    </template>
                  </ul>
                </template>
                <template lwc:if={hasStorageTraffic}>
                  <p class="storage-title">Site traffic</p>
                  <ul class="storage-list">
                    <template for:each={storageTrafficRows} for:item="row">
                      <li key={row.key} data-id="storage-traffic">
                        {row.label}
                      </li>
                    </template>
                  </ul>
                </template>
                <p class="storage-note" data-id="storage-note">
                  {storageNote} {storageUpdated}
                </p>
              </div>
            </template>
          </div>
        </template>
      </div>

      <span class="links">
        <a class="target" data-id="contact" href={contactUrl}>Contact</a>
        <a class="target" data-id="docs" href={docsUrl}>Docs</a>
        <template lwc:if={gitHubUrl}>
          <a
            class="target"
            data-id="github"
            href={gitHubUrl}
            target="_blank"
            rel="noopener noreferrer"
            >GitHub</a
          >
        </template>
        <template lwc:if={linkedInUrl}>
          <a
            class="target"
            data-id="linkedin"
            href={linkedInUrl}
            target="_blank"
            rel="noopener noreferrer"
            >LinkedIn</a
          >
        </template>
        <button
          type="button"
          class="target back-to-top"
          data-id="back-to-top"
          onclick={handleBackToTop}
        >
          Back to top <span aria-hidden="true">&uarr;</span>
        </button>
      </span>
    </div>
  </footer>
</template>
