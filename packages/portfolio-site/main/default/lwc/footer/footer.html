<template>
  <footer class="footer">
    <div class="footer__inner">
      <span class="copyright"
        >&copy; {currentYear} Ryan Bumstead. {builtOn}</span
      >

      <div class="metrics-head">
        <p class="metrics-caption" data-id="metrics-caption">{captionText}</p>
        <template lwc:if={recordedLabel}>
          <p class="metrics-caption" data-id="recorded-label">
            {recordedLabel}
          </p>
        </template>
        <c-view-source source-key="footer"></c-view-source>
        <c-analytics-events></c-analytics-events>
        <c-view-source
          source-key="siteAnalytics"
          label="View analytics source"
        ></c-view-source>
      </div>
      <div class="metrics" data-id="metrics" onkeydown={handleKeydown}>
        <div class="chips" data-id="chips">
          <button
            type="button"
            class={ciChipClass}
            data-id="chip-ci"
            data-key="ci"
            id="footer-chip-ci"
            aria-expanded={ciExpanded}
            aria-controls="footer-panel-ci"
            onclick={handleChipClick}
          >
            <span class="group-label">CI</span>
            <span class="group-status" data-id="status-ci">{ciStatus}</span>
            <span class="chip-chevron" aria-hidden="true"></span>
          </button>
          <template lwc:if={showPlatform}>
            <button
              type="button"
              class={platformChipClass}
              data-id="chip-platform"
              data-key="platform"
              id="footer-chip-platform"
              aria-expanded={platformExpanded}
              aria-controls="footer-panel-platform"
              onclick={handleChipClick}
            >
              <span class="group-label">Platform</span>
              <span class="group-status" data-id="status-platform"
                >{platformStatus}</span
              >
              <span class="chip-chevron" aria-hidden="true"></span>
            </button>
          </template>
          <template lwc:if={snapshotLoaded}>
            <template lwc:if={showIntegrations}>
              <button
                type="button"
                class={integrationsChipClass}
                data-id="chip-integrations"
                data-key="integrations"
                id="footer-chip-integrations"
                aria-expanded={integrationsExpanded}
                aria-controls="footer-panel-integrations"
                onclick={handleChipClick}
              >
                <span class="group-label">Integrations</span>
                <span class="group-status" data-id="status-integrations"
                  >{integrationsStatus}</span
                >
                <span class="chip-chevron" aria-hidden="true"></span>
              </button>
            </template>
            <button
              type="button"
              class={quotasChipClass}
              data-id="chip-quotas"
              data-key="quotas"
              id="footer-chip-quotas"
              aria-expanded={quotasExpanded}
              aria-controls="footer-panel-quotas"
              onclick={handleChipClick}
            >
              <span class="group-label">Daily quotas</span>
              <span class="group-status" data-id="status-quotas"
                >{quotasStatus}</span
              >
              <span class="chip-chevron" aria-hidden="true"></span>
            </button>
            <template lwc:if={storageLine}>
              <button
                type="button"
                class={storageChipClass}
                data-id="chip-storage"
                data-key="storage"
                id="footer-chip-storage"
                aria-expanded={storageGroupExpanded}
                aria-controls="footer-panel-storage"
                onclick={handleChipClick}
              >
                <span class="group-label">Storage</span>
                <span class="group-status" data-id="status-storage"
                  >{storageStatus}</span
                >
                <span class="chip-chevron" aria-hidden="true"></span>
              </button>
            </template>
            <button
              type="button"
              class={limitsChipClass}
              data-id="chip-limits"
              data-key="limits"
              id="footer-chip-limits"
              aria-expanded={limitsExpanded}
              aria-controls="footer-panel-limits"
              onclick={handleChipClick}
            >
              <span class="group-label">Request limits</span>
              <span class="group-status" data-id="status-limits"
                >{limitsStatus}</span
              >
              <span class="chip-chevron" aria-hidden="true"></span>
            </button>
          </template>
        </div>

        <div class="panel" data-id="panel">
          <template lwc:if={ciOpen}>
            <div
              class="metric-group"
              data-group="ci"
              id="footer-panel-ci"
              role="region"
              aria-labelledby="footer-chip-ci"
            >
              <ul class="group-list" aria-labelledby="footer-chip-ci">
                <template for:each={badgeRows} for:item="badge">
                  <li
                    key={badge.key}
                    class="metric ci-badge"
                    data-id="ci-badge"
                  >
                    <template lwc:if={badge.failed}>
                      <a
                        class="target badge-fallback"
                        data-id={badge.fallbackId}
                        href={badge.href}
                        target="_blank"
                        rel="noopener noreferrer"
                        >{badge.label}</a
                      >
                    </template>
                    <template lwc:else>
                      <a
                        class="target badge-link"
                        href={badge.href}
                        target="_blank"
                        rel="noopener noreferrer"
                      >
                        <img
                          class="badge"
                          data-id={badge.imageId}
                          data-key={badge.key}
                          src={badge.src}
                          alt={badge.label}
                          height="20"
                          onerror={handleBadgeError}
                        />
                      </a>
                    </template>
                  </li>
                </template>
              </ul>
            </div>
          </template>
          <template lwc:if={platformOpen}>
            <div
              class="metric-group"
              data-group="platform"
              id="footer-panel-platform"
              role="region"
              aria-labelledby="footer-chip-platform"
            >
              <ul class="group-list" aria-labelledby="footer-chip-platform">
                <template lwc:if={graphqlLabel}>
                  <li class="metric" data-id="graphql">{graphqlLabel}</li>
                </template>
                <template lwc:if={snapshotFailed}>
                  <li class="metric" data-id="snapshot-error">
                    status unavailable
                  </li>
                </template>
              </ul>
            </div>
          </template>
          <template lwc:if={integrationsOpen}>
            <div
              class="metric-group"
              data-group="integrations"
              id="footer-panel-integrations"
              role="region"
              aria-labelledby="footer-chip-integrations"
            >
              <ul class="group-list" aria-labelledby="footer-chip-integrations">
                <template for:each={providerRows} for:item="row">
                  <li key={row.key} class="metric" data-id="provider">
                    {row.label}
                  </li>
                </template>
                <template for:each={integrationRows} for:item="row">
                  <li key={row.key} class="metric" data-id="integration">
                    {row.label}
                  </li>
                </template>
              </ul>
            </div>
          </template>
          <template lwc:if={quotasOpen}>
            <div
              class="metric-group"
              data-group="quotas"
              id="footer-panel-quotas"
              role="region"
              aria-labelledby="footer-chip-quotas"
            >
              <ul class="group-list" aria-labelledby="footer-chip-quotas">
                <template lwc:if={showAiRequests}>
                  <li class="metric">
                    <span
                      class="target ai-requests"
                      data-id="ai-requests"
                      onmouseenter={handleQuotaVisibility}
                      >AI requests today: {aiRequestsToday}</span
                    >
                  </li>
                </template>
                <template for:each={quotaRows} for:item="row">
                  <li key={row.key} class="metric" data-id="quota">
                    {row.label}
                  </li>
                </template>
              </ul>
            </div>
          </template>
          <template lwc:if={storageGroupOpen}>
            <div
              class="metric-group"
              data-group="storage"
              id="footer-panel-storage"
              role="region"
              aria-labelledby="footer-chip-storage"
            >
              <ul class="group-list" aria-labelledby="footer-chip-storage">
                <li class="metric" data-id="storage">
                  <button
                    type="button"
                    class="target storage-toggle"
                    data-id="storage-toggle"
                    aria-expanded={storageExpanded}
                    aria-controls="footer-storage-panel"
                    onclick={handleStorageToggle}
                  >
                    {storageLine}
                  </button>
                </li>
              </ul>
              <div
                class="storage-panel"
                id="footer-storage-panel"
                data-id="storage-panel"
                hidden={storagePanelHidden}
              >
                <p class="storage-title">Data by area</p>
                <ul class="storage-list">
                  <template for:each={storageDataRows} for:item="row">
                    <li key={row.key} data-id="storage-data">{row.label}</li>
                  </template>
                </ul>
                <template lwc:if={hasStorageFiles}>
                  <p class="storage-title">Files by kind</p>
                  <ul class="storage-list">
                    <template for:each={storageFileRows} for:item="row">
                      <li key={row.key} data-id="storage-file">{row.label}</li>
                    </template>
                  </ul>
                </template>
                <template lwc:if={hasStorageTraffic}>
                  <p class="storage-title">Site traffic</p>
                  <ul class="storage-list">
                    <template for:each={storageTrafficRows} for:item="row">
                      <li key={row.key} data-id="storage-traffic">
                        {row.label}
                      </li>
                    </template>
                  </ul>
                </template>
                <p class="storage-note" data-id="storage-note">
                  {storageNote} {storageUpdated}
                </p>
              </div>
            </div>
          </template>
          <template lwc:if={limitsOpen}>
            <div
              class="metric-group"
              data-group="limits"
              id="footer-panel-limits"
              role="region"
              aria-labelledby="footer-chip-limits"
            >
              <ul class="group-list" aria-labelledby="footer-chip-limits">
                <template for:each={limitRows} for:item="row">
                  <li key={row.key} class="metric" data-id="limit">
                    {row.label}
                  </li>
                </template>
              </ul>
            </div>
          </template>
        </div>
        <template lwc:if={probeConstructor}>
          <lwc:component
            lwc:is={probeConstructor}
            class="graphql-probe"
            data-id="graphql-probe"
            onprobe={handleProbe}
          ></lwc:component>
        </template>
      </div>

      <span class="links">
        <a class="target" data-id="contact" href={contactUrl}>Contact</a>
        <a class="target" data-id="docs" href={docsUrl}>Docs</a>
        <template lwc:if={gitHubUrl}>
          <a
            class="target"
            data-id="github"
            href={gitHubUrl}
            target="_blank"
            rel="noopener noreferrer"
            >GitHub</a
          >
        </template>
        <template lwc:if={linkedInUrl}>
          <a
            class="target"
            data-id="linkedin"
            href={linkedInUrl}
            target="_blank"
            rel="noopener noreferrer"
            >LinkedIn</a
          >
        </template>
        <button
          type="button"
          class="target back-to-top"
          data-id="back-to-top"
          onclick={handleBackToTop}
        >
          Back to top <span aria-hidden="true">&uarr;</span>
        </button>
      </span>
    </div>
  </footer>
</template>
