<template>
  <section class="contact-call" aria-labelledby="contact-call-heading">
    <div class="contact-call__panel">
      <div class="contact-call__copy">
        <h2 id="contact-call-heading" class="contact-call__heading">
          {heading}
        </h2>
        <p class="contact-call__text">{text}</p>
        <template lwc:if={hasNote}>
          <p class="contact-call__note" data-id="contact-note">{note}</p>
        </template>
      </div>
      <a class="contact-call__button" href={href} data-id="contact-link"
        >{linkLabel}</a
      >
    </div>
  </section>
</template>
