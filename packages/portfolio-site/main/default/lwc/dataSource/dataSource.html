<template>
  <div class="marker" onkeydown={handleKeydown} onfocusout={handleFocusOut}>
    <button
      type="button"
      class="marker-button"
      aria-expanded={expanded}
      aria-label={buttonLabel}
      onclick={handleToggle}
    >
      <span class="dot" aria-hidden="true"></span>
      <span class="marker-label" aria-hidden="true">{wording.markerLabel}</span>
      <span lwc:if={hasSummary} class="marker-counts" aria-hidden="true"
        >{summary}</span
      >
    </button>
    <div
      lwc:if={isOpen}
      class="panel"
      role="group"
      aria-label={wording.panelHeading}
    >
      <h2 class="panel-heading">{wording.panelHeading}</h2>
      <p class="panel-text">{wording.explanation}</p>
      <template lwc:if={hasRows}>
        <h3 class="sources-heading">{wording.sourcesHeading}</h3>
        <ul class="sources">
          <template for:each={rows} for:item="row">
            <li key={row.key} class="source" data-object={row.objectName}>
              <span class="source-text">{row.text}</span>
            </li>
          </template>
        </ul>
      </template>
      <button
        lwc:if={hasModelObjects}
        type="button"
        class="model-button"
        aria-haspopup="dialog"
        onclick={handleOpenModel}
      >
        {wording.sectionModelButton}
      </button>
      <p class="panel-footer">
        <a class="model-link" href={modelPath}>{wording.modelLinkText}</a>
        <button type="button" class="close-button" onclick={handleClose}>
          {wording.closeButton}
        </button>
      </p>
    </div>
  </div>
  <dialog
    lwc:if={isModelOpen}
    class="dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="data-source-model-heading"
    onkeydown={handleModelKeydown}
    onfocusout={handleModelFocusOut}
    oncancel={handleModelCancel}
    onclick={handleModelClick}
  >
    <div class="dialog-body">
      <header class="dialog-header">
        <h2 id="data-source-model-heading" class="dialog-heading" tabindex="-1">
          {wording.sectionModelHeading}
        </h2>
        <button
          type="button"
          class="model-close-button"
          onclick={handleCloseModel}
        >
          {wording.closeButton}
        </button>
      </header>
      <div class="dialog-scroll">
        <c-schema-visualizer objects={modelObjects}></c-schema-visualizer>
      </div>
    </div>
  </dialog>
</template>
