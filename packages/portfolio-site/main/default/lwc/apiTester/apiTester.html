<template>
  <lightning-card title="Try a request" icon-name="utility:apex">
    <c-view-source slot="actions" source-key="apiTester"></c-view-source>
    <div class="slds-p-around_medium console-container">
      <section class="invoke-section">
        <h2 class="slds-text-heading_small slds-m-bottom_small">
          Call the API
        </h2>
        <div class="control-row control-row_invoke">
          <div class="nc-field row-field">
            <label class="nc-label row-label" for="endpoint">Endpoint</label>
            <select
              id="endpoint"
              name="endpoint"
              class="nc-control row-control endpoint-picker"
              onchange={handleEndpointChange}
            >
              <template for:each={endpointOptions} for:item="option">
                <option
                  key={option.value}
                  value={option.value}
                  selected={option.selected}
                >
                  {option.label}
                </option>
              </template>
            </select>
          </div>
          <button
            type="button"
            class="nc-button row-action execute-button"
            onclick={handleExecute}
            disabled={isExecuteDisabled}
            data-tour-anchor="C"
          >
            Execute GET
          </button>
        </div>

        <p lwc:if={catalogError} class="catalog-error text-error" role="alert">
          {catalogError}
        </p>

        <div class="param-section slds-m-top_medium">
          <template lwc:if={isPhone}>
            <h3 class="disclosure-heading">
              <button
                type="button"
                class="disclosure"
                data-section="filters"
                aria-expanded={filtersExpanded}
                aria-controls="filters-panel"
                onclick={handleSectionToggle}
              >
                {filtersTitle}
              </button>
            </h3>
          </template>
          <template lwc:else>
            <h3 class="slds-text-title_caps">Query parameters</h3>
          </template>
          <div id="filters-panel" class="section-panel" hidden={filtersHidden}>
            <template lwc:if={hasParamControls}>
              <div class="param-grid">
                <template for:each={paramControls} for:item="control">
                  <div key={control.key} class="param-control">
                    <template lwc:if={control.isPills}>
                      <fieldset class="pill-group" data-param={control.name}>
                        <legend class="param-label">{control.name}</legend>
                        <div class="pill-row">
                          <template for:each={control.pills} for:item="pill">
                            <button
                              key={pill.key}
                              type="button"
                              class={pill.className}
                              aria-pressed={pill.pressed}
                              data-name={control.name}
                              data-value={pill.value}
                              onclick={handlePillClick}
                            >
                              {pill.value}
                            </button>
                          </template>
                        </div>
                      </fieldset>
                    </template>
                    <template lwc:if={control.isSelect}>
                      <label class="param-field">
                        <span class="param-label">{control.name}</span>
                        <span lwc:if={control.selectHint} class="param-hint"
                          >{control.selectHint}</span
                        >
                        <select
                          class="nc-control param-select"
                          data-name={control.name}
                          onchange={handleParamInput}
                        >
                          <template
                            for:each={control.options}
                            for:item="option"
                          >
                            <option
                              key={option.key}
                              value={option.value}
                              selected={option.selected}
                            >
                              {option.label}
                            </option>
                          </template>
                        </select>
                      </label>
                    </template>
                    <template lwc:if={control.isNumber}>
                      <label class="param-field">
                        <span class="param-label">{control.name}</span>
                        <span class="param-hint">({control.hint})</span>
                        <input
                          type="number"
                          class="nc-control param-input"
                          inputmode="numeric"
                          min={control.min}
                          max={control.max}
                          value={control.value}
                          data-name={control.name}
                          onchange={handleParamInput}
                        />
                      </label>
                    </template>
                    <template lwc:if={control.isText}>
                      <label class="param-field">
                        <span class="param-label">{control.name}</span>
                        <span class="param-hint">{control.hint}</span>
                        <input
                          type="text"
                          class="nc-control param-input"
                          value={control.value}
                          data-name={control.name}
                          onchange={handleParamInput}
                        />
                      </label>
                    </template>
                  </div>
                </template>
              </div>
            </template>
            <template lwc:else>
              <p class="param-none">This path takes no query parameters.</p>
            </template>

            <template lwc:if={hasChosenPills}>
              <ul class="chosen-pills" aria-label="Chosen parameters">
                <template for:each={chosenPills} for:item="pill">
                  <li key={pill.key} class="chosen-pill">
                    <code class="chosen-text">{pill.text}</code>
                    <button
                      type="button"
                      class="remove-pill"
                      aria-label={pill.removeLabel}
                      data-name={pill.name}
                      onclick={handleRemovePill}
                    >
                      Remove
                    </button>
                  </li>
                </template>
              </ul>
            </template>
          </div>

          <template lwc:if={isPhone}>
            <h3 class="disclosure-heading">
              <button
                type="button"
                class="disclosure"
                data-section="advanced"
                aria-expanded={advancedExpanded}
                aria-controls="advanced-panel"
                onclick={handleSectionToggle}
              >
                Advanced
              </button>
            </h3>
          </template>
          <div
            id="advanced-panel"
            class="section-panel"
            hidden={advancedHidden}
          >
            <div class="nc-field">
              <label class="nc-label" for="query-text"
                >Advanced: query parameters as text (optional)</label
              >
              <input
                id="query-text"
                type="text"
                class="nc-control query-input"
                placeholder="limit=10&amp;offset=0"
                autocomplete="off"
                spellcheck="false"
                value={queryText}
                oninput={handleQueryChange}
                onchange={handleQueryChange}
              />
            </div>
          </div>
          <p class="query-preview" aria-live="polite">
            Query string: <code class="query-string">{queryPreview}</code>
          </p>
        </div>

        <div aria-live="polite" class="slds-m-top_medium">
          <template lwc:if={isLoading}>
            <div class="loading-state" data-id="sending">
              <p class="sending-text">Sending…</p>
              <div class="progress" aria-hidden="true">
                <div class="progress-bar"></div>
              </div>
            </div>
          </template>

          <div
            lwc:if={showEmptyPanel}
            class="response-empty"
            data-id="response-empty"
          >
            <p class="response-empty-text">
              Press Execute GET to see the status, headers and body here.
            </p>
          </div>

          <p lwc:if={invokeError} class="invoke-error text-error" role="alert">
            {invokeError}
          </p>

          <template lwc:if={hasResult}>
            <dl
              class="slds-list_horizontal slds-wrap result-summary result-fade"
            >
              <dt class="slds-item_label field-label">Status</dt>
              <dd class="slds-item_detail">
                <span class={statusClass}>{statusText}</span>
              </dd>
              <dt class="slds-item_label field-label">Latency</dt>
              <dd class="slds-item_detail latency-value">{latencyText}</dd>
            </dl>

            <template lwc:if={isPhone}>
              <h3 class="disclosure-heading">
                <button
                  type="button"
                  class="disclosure"
                  data-section="response"
                  aria-expanded={responseExpanded}
                  aria-controls="response-panel"
                  onclick={handleSectionToggle}
                >
                  Response details
                </button>
              </h3>
            </template>
            <div
              id="response-panel"
              class="section-panel"
              hidden={responseHidden}
            >
              <h3 class="slds-text-title_caps slds-m-top_small">Headers</h3>
              <dl class="slds-list_horizontal slds-wrap header-panel">
                <template for:each={headerRows} for:item="row">
                  <dt
                    key={row.labelKey}
                    class="slds-item_label field-label header-name"
                  >
                    {row.name}
                  </dt>
                  <dd
                    key={row.valueKey}
                    class="slds-item_detail header-value"
                    data-header={row.name}
                  >
                    {row.value}
                  </dd>
                </template>
              </dl>

              <h3 class="slds-text-title_caps slds-m-top_small">Body</h3>
              <div class="view-toggle" role="group" aria-label="Body view">
                <button
                  type="button"
                  class={rawViewClass}
                  data-view="raw"
                  aria-pressed={rawPressed}
                  onclick={handleViewClick}
                >
                  Raw JSON
                </button>
                <button
                  type="button"
                  class={renderedViewClass}
                  data-view="rendered"
                  aria-pressed={renderedPressed}
                  onclick={handleViewClick}
                >
                  Rendered
                </button>
              </div>
              <template lwc:if={isRawView}>
                <div
                  class="result-box"
                  tabindex="0"
                  role="region"
                  aria-label="Response body"
                >
                  <pre class="json-viewer response-body language-json"><code
                    class="response-code"
                    lwc:dom="manual"
                  ></code></pre>
                </div>
              </template>
              <template lwc:else>
                <div class="rendered-view" data-id="rendered-view">
                  <template lwc:if={hasRenderedFields}>
                    <template for:each={renderedFields} for:item="field">
                      <section key={field.key} class="rendered-field">
                        <h4 class="rendered-path">{field.path}</h4>
                        <pre class="rendered-text" tabindex="0">
{field.text}</pre
                        >
                      </section>
                    </template>
                  </template>
                  <template lwc:else>
                    <p class="rendered-empty" data-id="rendered-empty">
                      This response has no long text fields. Raw JSON shows all
                      of it.
                    </p>
                  </template>
                </div>
              </template>

              <template lwc:if={hasNextPage}>
                <button
                  type="button"
                  class="next-page-button"
                  onclick={handleNextPage}
                >
                  Next page
                </button>
              </template>

              <section class="schema-check slds-m-top_small">
                <h3 class="slds-text-title_caps">Response against the spec</h3>
                <p class="schema-summary">{schemaCheck.summary}</p>
                <template lwc:if={hasSchemaLists}>
                  <div class="schema-lists">
                    <template for:each={schemaCheck.lists} for:item="list">
                      <div
                        key={list.key}
                        class="schema-list"
                        data-list={list.key}
                      >
                        <h4 class="schema-list-title">{list.title}</h4>
                        <template lwc:if={list.isEmpty}>
                          <p class="schema-none">None</p>
                        </template>
                        <template lwc:else>
                          <ul>
                            <template for:each={list.items} for:item="item">
                              <li key={item.key}><code>{item.text}</code></li>
                            </template>
                          </ul>
                        </template>
                      </div>
                    </template>
                  </div>
                </template>
              </section>
            </div>
          </template>
        </div>
      </section>

      <section class="token-section slds-m-top_large">
        <template lwc:if={isPhone}>
          <h2 class="disclosure-heading">
            <button
              type="button"
              class="disclosure"
              data-section="token"
              aria-expanded={tokenExpanded}
              aria-controls="token-panel"
              onclick={handleSectionToggle}
            >
              Request an evaluator token
            </button>
          </h2>
        </template>
        <template lwc:else>
          <h2 class="slds-text-heading_small slds-m-bottom_small">
            Request an evaluator token
          </h2>
        </template>
        <div id="token-panel" class="section-panel" hidden={tokenHidden}>
          <div class="control-row control-row_token">
            <div class="nc-field row-field row-field_email">
              <label class="nc-label row-label" for="token-email">Email</label>
              <input
                id="token-email"
                type="email"
                class="nc-control row-control token-email"
                autocomplete="email"
                inputmode="email"
                maxlength={maxEmail}
                aria-invalid={emailInvalid}
                aria-describedby="token-email-error"
                value={email}
                oninput={handleTokenInput}
                onchange={handleEmailCommit}
                data-field="email"
              />
              <template lwc:if={emailError}>
                <p
                  id="token-email-error"
                  class="nc-error row-message token-email-error"
                >
                  {emailError}
                </p>
              </template>
            </div>
            <div class="nc-field row-field row-field_purpose">
              <label class="nc-label row-label" for="token-purpose"
                >Purpose</label
              >
              <input
                id="token-purpose"
                type="text"
                class="nc-control row-control token-purpose"
                maxlength={maxPurpose}
                value={purpose}
                oninput={handleTokenInput}
                onchange={handleTokenInput}
                data-field="purpose"
              />
            </div>
            <button
              type="button"
              class="nc-button row-action token-button"
              onclick={handleRequestToken}
              disabled={isTokenDisabled}
            >
              Request token
            </button>
          </div>

          <div aria-live="polite" class="slds-m-top_medium">
            <template lwc:if={isRequestingToken}>
              <div class="slds-is-relative slds-p-around_large">
                <lightning-spinner
                  alternative-text="Requesting a token"
                  size="small"
                ></lightning-spinner>
              </div>
            </template>

            <p lwc:if={tokenError} class="token-error text-error" role="alert">
              {tokenError}
            </p>

            <template lwc:if={hasTokenResult}>
              <template lwc:if={tokenIssued}>
                <p class="token-issued text-success">
                  Token issued. It is shown once. Every evaluator token shares
                  one session, which ends after 30 minutes without use.
                </p>
                <dl class="slds-list_horizontal slds-wrap token-fields">
                  <template for:each={tokenFields} for:item="field">
                    <dt
                      key={field.labelKey}
                      class="slds-item_label field-label"
                    >
                      {field.name}
                    </dt>
                    <dd
                      key={field.valueKey}
                      class="slds-item_detail token-value"
                      data-field={field.name}
                    >
                      {field.value}
                    </dd>
                  </template>
                </dl>
              </template>
              <template lwc:else>
                <dl
                  class="slds-list_horizontal slds-wrap token-refusal"
                  role="alert"
                >
                  <template for:each={tokenRefusalFields} for:item="field">
                    <dt
                      key={field.labelKey}
                      class="slds-item_label field-label"
                    >
                      {field.name}
                    </dt>
                    <dd
                      key={field.valueKey}
                      class="slds-item_detail refusal-value"
                      data-field={field.name}
                    >
                      {field.value}
                    </dd>
                  </template>
                </dl>
              </template>
            </template>
          </div>

          <section class="quickstart" aria-labelledby="quickstart-heading">
            <h3 id="quickstart-heading" class="quickstart-heading">
              Use the API from your own tools
            </h3>
            <ol class="setup-steps">
              <li>Download the Postman collection and import it.</li>
              <li>
                Run its first request, Get an evaluator token, or paste the
                token from this page into the accessToken variable.
              </li>
              <li>Send any request. Each one uses the token for you.</li>
            </ol>
            <div class="quickstart-actions">
              <a
                class="nc-button collection-download"
                href={collectionUrl}
                download={collectionFileName}
                onclick={handleCollectionDownload}
                >Download the Postman collection</a
              >
              <template lwc:if={hasPostmanRun}>
                <a
                  class="nc-button nc-button_secondary postman-run"
                  href={postmanRunUrl}
                  target="_blank"
                  rel="noopener noreferrer"
                  onclick={handlePostmanRun}
                  >Run in Postman</a
                >
              </template>
            </div>

            <h4 class="curl-heading">Or try it with curl</h4>
            <template for:each={curlExamples} for:item="example">
              <div key={example.key} class="curl-example">
                <div class="curl-head">
                  <p class="curl-title">{example.title}</p>
                  <button
                    type="button"
                    class="nc-button nc-button_secondary copy-button"
                    data-example={example.key}
                    aria-label={example.copyLabel}
                    onclick={handleCopyCurl}
                  >
                    Copy
                  </button>
                </div>
                <pre
                  class="curl-block"
                  tabindex="0"
                  role="region"
                  aria-label={example.title}
                  data-example={example.key}
                ><code class="curl-code">{example.text}</code></pre>
              </div>
            </template>
            <p class="copy-status" role="status" aria-live="polite">
              {copyStatus}
            </p>
            <p class="curl-note">{curlNote}</p>
            <ul class="status-notes">
              <template for:each={statusNotes} for:item="note">
                <li key={note.code}>
                  <code class="status-code">{note.code}</code> {note.text}
                </li>
              </template>
            </ul>
          </section>
        </div>
      </section>
    </div>
  </lightning-card>
</template>
