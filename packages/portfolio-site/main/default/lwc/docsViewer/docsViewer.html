<template>
  <div class="docs">
    <div
      class="docs-announcer"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    >
      {announcement}
    </div>
    <template lwc:if={showList}>
      <h1 class="docs-title" tabindex="-1">Architecture docs</h1>
      <p class="docs-lead">
        How this site is designed and why. Start with the Executive Overview.
      </p>
      <template lwc:if={hasDocs}>
        <template for:each={groups} for:item="group">
          <section key={group.key} class="doc-group" data-group={group.key}>
            <template lwc:if={group.isOpenGroup}>
              <h2 class="doc-group-title">{group.label}</h2>
              <ul class="doc-list" aria-label={group.label}>
                <template for:each={group.items} for:item="item">
                  <li key={item.key} class="doc-list-item">
                    <a
                      class="doc-list-link"
                      href={item.href}
                      aria-label={item.label}
                    >
                      <span class="doc-badge">{item.badge}</span>
                      <span class="doc-name">{item.title}</span>
                    </a>
                  </li>
                </template>
              </ul>
            </template>
            <template lwc:else>
              <details
                class="doc-group-details"
                data-group={group.key}
                open={group.isExpanded}
                ontoggle={handleGroupToggle}
              >
                <summary class="doc-group-summary">
                  <span class="doc-group-title">{group.label}</span>
                  <span class="doc-group-count">{group.countLabel}</span>
                </summary>
                <ul
                  lwc:if={group.isExpanded}
                  class="doc-list"
                  aria-label={group.label}
                >
                  <template for:each={group.items} for:item="item">
                    <li key={item.key} class="doc-list-item">
                      <a
                        class="doc-list-link"
                        href={item.href}
                        aria-label={item.label}
                      >
                        <span class="doc-badge">{item.badge}</span>
                        <span class="doc-name">{item.title}</span>
                      </a>
                    </li>
                  </template>
                </ul>
              </details>
            </template>
          </section>
        </template>
      </template>
      <template lwc:elseif={listEmpty}>
        <p class="docs-note">No documents are available yet.</p>
      </template>
      <template lwc:else>
        <p class="docs-note" role="status">Loading the documents.</p>
      </template>
    </template>

    <template lwc:if={showDoc}>
      <a class="back-link" href={listHref}>Back to all docs</a>
      <template lwc:if={showDocMissing}>
        <h1 class="docs-title" tabindex="-1">Document not found</h1>
        <p class="docs-note">
          That document is not on this site. The list has every one that is.
        </p>
      </template>
      <template lwc:elseif={showRenderError}>
        <h1 class="docs-title" tabindex="-1">
          This document could not be shown
        </h1>
        <p class="docs-note">
          The page could not load its reader. Try again, or read it on GitHub.
        </p>
        <template lwc:if={githubUrl}>
          <a class="doc-link" href={githubUrl} rel="noopener noreferrer"
            >Open the document on GitHub</a
          >
        </template>
      </template>
      <template lwc:else>
        <template lwc:if={isLoading}>
          <p class="docs-note" role="status">Loading the document.</p>
        </template>
        <template lwc:if={pageTitle}>
          <h1 class="docs-title doc-title" tabindex="-1">{pageTitle}</h1>
        </template>
        <template lwc:if={doc}>
          <p class="doc-meta">
            <template lwc:if={fetchedLabel}>
              <span>From the repository, read {fetchedLabel}.</span>
            </template>
            <template lwc:if={githubUrl}>
              <a class="doc-link" href={githubUrl} rel="noopener noreferrer"
                >View on GitHub</a
              >
            </template>
          </p>
          <template lwc:if={isTruncated}>
            <p class="docs-note">
              This document is longer than the page holds. The full text is on
              GitHub.
            </p>
          </template>
          <template lwc:if={hasToc}>
            <details class="toc" open={tocOpen} ontoggle={handleTocToggle}>
              <summary class="toc-summary">Contents</summary>
              <nav lwc:if={tocOpen} class="toc-nav" aria-label="Contents">
                <ul class="toc-list">
                  <template for:each={tocItems} for:item="item">
                    <li key={item.id} class={item.className}>
                      <a
                        class="toc-link"
                        href={item.href}
                        data-id={item.id}
                        onclick={handleTocClick}
                        >{item.text}</a
                      >
                    </li>
                  </template>
                </ul>
              </nav>
            </details>
          </template>
          <div
            class="doc-body"
            lwc:dom="manual"
            onclick={handleBodyClick}
          ></div>
        </template>
      </template>
    </template>
  </div>
</template>
