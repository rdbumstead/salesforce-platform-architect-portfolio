<template>
  <div class="docs">
    <div
      class="docs-announcer"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    >
      {announcement}
    </div>
    <template lwc:if={showList}>
      <h1 class="docs-title" tabindex="-1">Architecture docs</h1>
      <p class="docs-lead">
        How this site is designed and why. Start with the Executive Overview.
      </p>
      <div class="docs-build">
        <c-site-build-section></c-site-build-section>
      </div>
      <template lwc:if={hasDocs}>
        <template for:each={groups} for:item="group">
          <section key={group.key} class="doc-group" data-group={group.key}>
            <template lwc:if={group.isOpenGroup}>
              <h2 class="doc-group-title section-heading section-heading-panel">
                {group.label}
              </h2>
              <ul class="doc-list" aria-label={group.label}>
                <template for:each={group.items} for:item="item">
                  <li key={item.key} class="doc-list-item">
                    <a class="doc-list-link" href={item.href}>
                      <span class="doc-badge">{item.badge}</span>
                      <span class="doc-name">{item.title}</span>
                      <template lwc:if={item.hasMeta}>
                        <span class="doc-status">{item.status}</span>
                        <span class="doc-date">{item.date}</span>
                      </template>
                    </a>
                  </li>
                </template>
              </ul>
            </template>
            <template lwc:else>
              <details
                class="doc-group-details"
                data-group={group.key}
                open={group.isExpanded}
                ontoggle={handleGroupToggle}
              >
                <summary class="doc-group-summary">
                  <span class="doc-group-title">{group.label}</span>
                  <span class="doc-group-count">{group.countLabel}</span>
                </summary>
                <ul
                  lwc:if={group.isExpanded}
                  class="doc-list"
                  aria-label={group.label}
                >
                  <template for:each={group.items} for:item="item">
                    <li key={item.key} class="doc-list-item">
                      <a class="doc-list-link" href={item.href}>
                        <span class="doc-badge">{item.badge}</span>
                        <span class="doc-name">{item.title}</span>
                        <template lwc:if={item.hasMeta}>
                          <span class="doc-status">{item.status}</span>
                          <span class="doc-date">{item.date}</span>
                        </template>
                      </a>
                    </li>
                  </template>
                </ul>
              </details>
              <a
                lwc:if={group.isDecisions}
                class="nc-button nc-button_secondary decisions-link"
                href={decisionsUrl}
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Open the decisions folder on GitHub, opens in a new tab"
                data-id="all-decisions"
                >Open the decisions folder on GitHub</a
              >
            </template>
          </section>
        </template>
      </template>
      <template lwc:elseif={listEmpty}>
        <p class="docs-note">No documents are available yet.</p>
      </template>
      <template lwc:else>
        <p class="docs-note" role="status">Loading the documents.</p>
      </template>
    </template>

    <template lwc:if={showDoc}>
      <a class="back-link" href={listHref}>Back to all docs</a>
      <template lwc:if={showDocMissing}>
        <h1 class="docs-title" tabindex="-1">Document not found</h1>
        <p class="docs-note">
          That document is not on this site. The list has every one that is.
        </p>
      </template>
      <template lwc:elseif={showRenderError}>
        <h1 class="docs-title" tabindex="-1">
          This document could not be shown
        </h1>
        <p class="docs-note">
          The page could not load its reader. Try again, or read it on GitHub.
        </p>
        <template lwc:if={githubUrl}>
          <a class="doc-link" href={githubUrl} rel="noopener noreferrer"
            >Open the document on GitHub</a
          >
        </template>
      </template>
      <template lwc:else>
        <template lwc:if={isLoading}>
          <p class="docs-note" role="status">Loading the document.</p>
        </template>
        <template lwc:if={pageTitle}>
          <h1 class="docs-title doc-title" tabindex="-1">{pageTitle}</h1>
        </template>
        <template lwc:if={doc}>
          <p class="doc-meta">
            <template lwc:if={fetchedLabel}>
              <span>From the repository, read {fetchedLabel}.</span>
            </template>
            <template lwc:if={githubUrl}>
              <a class="doc-link" href={githubUrl} rel="noopener noreferrer"
                >View on GitHub</a
              >
            </template>
          </p>
          <template lwc:if={isTruncated}>
            <p class="docs-note">
              This document is longer than the page holds. The full text is on
              GitHub.
            </p>
          </template>
          <div class="doc-layout">
            <template lwc:if={hasToc}>
              <details class="toc" open={tocOpen} ontoggle={handleTocToggle}>
                <summary class="toc-summary">Contents</summary>
                <nav lwc:if={tocOpen} class="toc-nav" aria-label="Contents">
                  <ul class="toc-list">
                    <template for:each={tocItems} for:item="item">
                      <li key={item.id} class={item.className}>
                        <a
                          class="toc-link"
                          href={item.href}
                          data-id={item.id}
                          onclick={handleTocClick}
                          >{item.text}</a
                        >
                      </li>
                    </template>
                  </ul>
                </nav>
              </details>
            </template>
            <div
              class="doc-body"
              lwc:dom="manual"
              onclick={handleBodyClick}
            ></div>
          </div>
          <nav class="doc-end" aria-label="After this document">
            <a class="doc-end-back" href={listHref}>Back to all docs</a>
            <a
              lwc:if={hasNextDoc}
              class="doc-end-next"
              href={nextHref}
              data-id="next-doc"
            >
              <span class="doc-end-hint">Next document</span>
              <span class="doc-end-title">{nextTitle}</span>
            </a>
          </nav>
        </template>
      </template>
    </template>
    <template lwc:if={dialogOpen}>
      <dialog
        class="dd-dialog"
        role="dialog"
        aria-modal="true"
        aria-label={dialogLabel}
        onkeydown={handleDialogKeydown}
        onclick={handleBackdropClick}
        onclose={handleDialogNativeClose}
      >
        <div class="dd-panel">
          <div class="dd-bar">
            <p class="dd-title">{dialogLabel}</p>
            <div class="dd-tools">
              <button
                type="button"
                class="dd-button"
                data-id="zoom-out"
                aria-label="Zoom out"
                onclick={handleZoomOut}
              >
                &minus;
              </button>
              <span class="dd-zoom" role="status">{dialogZoomLabel}</span>
              <button
                type="button"
                class="dd-button"
                data-id="zoom-in"
                aria-label="Zoom in"
                onclick={handleZoomIn}
              >
                +
              </button>
              <button
                type="button"
                class="dd-button dd-text"
                data-id="actual-size"
                onclick={handleActualSize}
              >
                Actual size
              </button>
              <button
                type="button"
                class="dd-button dd-text"
                data-id="fit-width"
                onclick={handleFitWidth}
              >
                Fit width
              </button>
              <button
                type="button"
                class="dd-button dd-text dd-close"
                data-id="close"
                onclick={handleDialogClose}
              >
                Close
              </button>
            </div>
          </div>
          <div
            class="dd-scroll"
            tabindex="0"
            role="region"
            aria-label="Diagram, scrolls in both directions"
          >
            <img
              class="dd-img"
              src={dialogSrc}
              alt={dialogAlt}
              style={dialogImgStyle}
            />
          </div>
        </div>
      </dialog>
    </template>
  </div>
</template>
