<template>
  <lightning-card title="AI Cover Letter Generator" icon-name="custom:custom15">
    <c-view-source
      slot="actions"
      source-key="coverLetterGenerator"
    ></c-view-source>
    <c-data-source
      slot="actions"
      source-keys="PortfolioGroundingService_Projects,PortfolioGroundingService_Highlights,PortfolioGroundingService_SkillLinks"
      hide-counts
      class="card-source"
    ></c-data-source>
    <div class="slds-p-around_medium generator">
      <p class="intro">Fill in the company and the job, then press Generate.</p>

      <div class="slds-grid slds-wrap slds-gutters">
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
          <div class="nc-field">
            <p class="field-label" aria-hidden="true">
              Company Name<span
                class="required-marker"
                data-id="required-companyName"
                >*</span
              >
            </p>
            <label class="nc-label nc-visually-hidden" for="company-name"
              >Company Name</label
            >
            <input
              id="company-name"
              type="text"
              class="nc-control company-input"
              value={companyName}
              maxlength={maxCompanyLength}
              required
              autocomplete="organization"
              oninput={handleInputChange}
              data-field="companyName"
              aria-describedby="company-count"
            />
            <p
              id="company-count"
              class={companyLimit.className}
              data-id="company-count"
            >
              {companyLimit.text}
            </p>
          </div>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
          <div class="nc-field">
            <p class="field-label" aria-hidden="true">
              Job Title<span class="required-marker" data-id="required-jobTitle"
                >*</span
              >
            </p>
            <label class="nc-label nc-visually-hidden" for="job-title"
              >Job Title</label
            >
            <input
              id="job-title"
              type="text"
              class="nc-control title-input"
              value={jobTitle}
              maxlength={maxTitleLength}
              required
              autocomplete="organization-title"
              oninput={handleInputChange}
              data-field="jobTitle"
              aria-describedby="title-count"
            />
            <p
              id="title-count"
              class={titleLimit.className}
              data-id="title-count"
            >
              {titleLimit.text}
            </p>
          </div>
        </div>
      </div>

      <div class="nc-field slds-m-top_medium">
        <label class="nc-label description-label" for="job-description"
          >Job Description / Key Requirements</label
        >
        <textarea
          id="job-description"
          class="nc-control description-input"
          rows="6"
          maxlength={maxDescriptionLength}
          oninput={handleInputChange}
          onpaste={handleDescriptionPaste}
          data-field="jobDescription"
          aria-describedby="description-count"
          data-tour-anchor
        ></textarea>
        <p
          id="description-count"
          class={descriptionLimit.className}
          data-id="description-count"
        >
          {descriptionLimit.text}
        </p>
        <p class="description-cut" aria-live="polite" data-id="description-cut">
          {descriptionCutText}
        </p>
      </div>

      <div class="slds-m-top_medium slds-text-align_right">
        <button
          type="button"
          class="generate-button"
          onclick={handleGenerate}
          disabled={isGenerateDisabled}
        >
          Generate
        </button>
      </div>
      <p class="wait-note" data-id="wait-note">
        A letter can take about a minute. If the models are busy, you get a
        template letter instead, and the panel below says which.
      </p>

      <div class="loading-state slds-m-top_medium">
        <template lwc:if={isLoading}>
          <p class="elapsed" data-id="elapsed" aria-hidden="true">
            {elapsedText}
          </p>
        </template>
        <div class="status-region" aria-live="polite" data-id="status-region">
          <template lwc:if={isLoading}>
            <p class="loading-text" data-id="status-line">{statusLine}</p>
          </template>
        </div>
      </div>

      <div
        lwc:if={isLoading}
        class="letter-sheet skeleton"
        style={sheetStyle}
        data-id="skeleton"
        aria-hidden="true"
      >
        <div lwc:if={letterHeader} class="letter-header">
          <p lwc:if={letterHeader.name} class="letter-header-name">
            {letterHeader.name}
          </p>
          <p lwc:if={letterHeader.title} class="letter-header-title">
            {letterHeader.title}
          </p>
          <ul lwc:if={letterHeader.hasLinks} class="letter-header-links">
            <template for:each={letterHeader.links} for:item="link">
              <li key={link.key} class="letter-header-link">
                <span class="letter-header-text">{link.label}</span>
              </li>
            </template>
          </ul>
        </div>
        <div class="letter skeleton-body">
          <span class="skeleton-line skeleton-line_short"></span>
          <span class="skeleton-gap"></span>
          <span class="skeleton-line"></span>
          <span class="skeleton-line"></span>
          <span class="skeleton-line skeleton-line_medium"></span>
          <span class="skeleton-gap"></span>
          <span class="skeleton-line"></span>
          <span class="skeleton-line"></span>
          <span class="skeleton-line"></span>
          <span class="skeleton-line skeleton-line_medium"></span>
          <span class="skeleton-gap"></span>
          <span class="skeleton-line"></span>
          <span class="skeleton-line skeleton-line_short"></span>
        </div>
      </div>

      <div class="slds-m-top_medium">
        <p lwc:if={error} class="error-text" role="alert">{error}</p>

        <template lwc:if={hasResult}>
          <div class="result result-fade" data-id="result">
            <p class="provider-line">
              <span class="provider-caption">Written by</span>
              <span class="provider-badge" data-id="provider-badge"
                >{providerLabel}</span
              >
              <span class="word-count" data-id="word-count"
                >{wordCountText}</span
              >
            </p>
            <p
              lwc:if={isLocalTemplate}
              class="fallback-note"
              data-id="fallback-note"
            >
              {fallbackReason}
            </p>
            <div class="letter-actions" data-id="letter-actions">
              <button
                type="button"
                class="nc-button download-letter"
                onclick={handleDownload}
                disabled={exportDisabled}
              >
                {downloadLabel}
              </button>
              <button
                type="button"
                class="nc-button nc-button_secondary copy-letter"
                onclick={handleCopyText}
                disabled={exportDisabled}
              >
                Copy text
              </button>
            </div>
            <div
              class="export-status"
              aria-live="polite"
              data-id="export-status"
            >
              <p lwc:if={exportMessage} class="export-message">
                {exportMessage}
              </p>
              <p lwc:if={exportError} class="export-error">{exportError}</p>
            </div>
            <article
              class="letter-sheet"
              style={sheetStyle}
              data-id="letter-sheet"
              aria-label="Cover letter"
            >
              <header
                lwc:if={letterHeader}
                class="letter-header"
                data-id="letter-header"
              >
                <p lwc:if={letterHeader.name} class="letter-header-name">
                  {letterHeader.name}
                </p>
                <p lwc:if={letterHeader.title} class="letter-header-title">
                  {letterHeader.title}
                </p>
                <ul
                  lwc:if={letterHeader.hasLinks}
                  class="letter-header-links"
                  aria-label="Profile links"
                >
                  <template for:each={letterHeader.links} for:item="link">
                    <li key={link.key} class="letter-header-link">
                      <a
                        href={link.url}
                        target="_blank"
                        rel="noopener noreferrer"
                        >{link.label}</a
                      >
                    </li>
                  </template>
                </ul>
              </header>
              <div class="letter" data-id="letter">{result.content}</div>
            </article>

            <div class="slds-m-top_small">
              <button
                type="button"
                class="work-toggle"
                aria-expanded={workExpanded}
                aria-controls="work-panel"
                onclick={toggleWork}
              >
                {showWorkLabel}
              </button>
            </div>

            <template lwc:if={showWork}>
              <section class="work-panel" id="work-panel" data-id="work-panel">
                <h3 class="work-heading">Show your work</h3>
                <dl class="work-list">
                  <dt>Provider</dt>
                  <dd data-id="work-provider">{result.provider}</dd>
                  <dt>Model</dt>
                  <dd data-id="work-model">{result.model}</dd>
                  <dt>Fallback used</dt>
                  <dd data-id="work-fallback">{fallbackText}</dd>
                  <dt>Round trip</dt>
                  <dd data-id="work-latency">{latencyText}</dd>
                  <dt>Generation</dt>
                  <dd data-id="work-generation">{generationText}</dd>
                </dl>
                <template lwc:if={hasAttempts}>
                  <h4 class="work-subheading">Attempts</h4>
                  <ol class="attempt-list">
                    <template for:each={attemptRows} for:item="row">
                      <li key={row.key} class="attempt-row">{row.text}</li>
                    </template>
                  </ol>
                </template>
                <h4 class="work-subheading">Prompt sent</h4>
                <template lwc:if={hasPrompt}>
                  <pre class="prompt" data-id="prompt">
{result.promptShown}</pre
                  >
                </template>
                <template lwc:else>
                  <p class="no-prompt" data-id="no-prompt">
                    The local template does not use a prompt.
                  </p>
                </template>
              </section>
            </template>
          </div>
        </template>
      </div>
    </div>
  </lightning-card>
</template>
