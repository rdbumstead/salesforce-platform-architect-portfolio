<template>
  <lightning-card title={title} icon-name="utility:code">
    <div class="viewer-body slds-p-around_medium slds-is-relative">
      <template lwc:if={isLoading}>
        <lightning-spinner
          alternative-text="Loading syntax highlighting"
          size="small"
        ></lightning-spinner>
      </template>
      <div class="code-container">
        <pre class={languageClass}><code
            class="code-block"
            lwc:dom="manual"
          ></code></pre>
      </div>
      <div class="slds-m-top_small">
        <lightning-button
          variant="brand"
          label="Copy to clipboard"
          icon-name="utility:copy"
          onclick={handleCopy}
          class="copy-code"
        ></lightning-button>
        <p aria-live="polite" class="copy-message slds-m-top_x-small">
          {copyMessage}
        </p>
      </div>
    </div>
  </lightning-card>
</template>
