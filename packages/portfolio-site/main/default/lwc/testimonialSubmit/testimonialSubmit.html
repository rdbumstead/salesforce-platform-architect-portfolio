<template>
  <section class="testimonial" aria-labelledby="testimonial-heading">
    <h2 id="testimonial-heading" class="testimonial-title">Leave a Review</h2>

    <template lwc:if={isSent}>
      <div class="thanks" data-id="success" tabindex="-1">
        <p class="thanks-title">{successTitle}</p>
        <p class="thanks-detail">{successMessage}</p>
      </div>
    </template>

    <template lwc:if={showForm}>
      <p class="testimonial-intro">
        Every review is read before it appears on the site.
      </p>

      <form class="testimonial-form" onsubmit={handleSubmit} novalidate>
        <div class="field">
          <label class="field-label" for="authorName">Your name</label>
          <input
            id="authorName"
            class="field-input"
            name="authorName"
            type="text"
            required
            autocomplete="name"
            maxlength={maxNameLength}
            aria-invalid={authorNameInvalid}
            aria-describedby="authorName-count authorName-error"
            value={form.authorName}
            oninput={handleInput}
          />
          <p
            id="authorName-count"
            class={nameLimit.className}
            data-id="authorName-count"
          >
            {nameLimit.text}
          </p>
          <template lwc:if={authorNameError}>
            <p
              id="authorName-error"
              class="field-error"
              data-id="authorName-error"
            >
              {authorNameError}
            </p>
          </template>
        </div>

        <div class="field">
          <label class="field-label" for="authorTitle"
            >Your title (optional)</label
          >
          <input
            id="authorTitle"
            class="field-input"
            name="authorTitle"
            type="text"
            autocomplete="organization-title"
            maxlength={maxTitleLength}
            aria-invalid={authorTitleInvalid}
            aria-describedby="authorTitle-count authorTitle-error"
            value={form.authorTitle}
            oninput={handleInput}
          />
          <p
            id="authorTitle-count"
            class={titleLimit.className}
            data-id="authorTitle-count"
          >
            {titleLimit.text}
          </p>
          <template lwc:if={authorTitleError}>
            <p
              id="authorTitle-error"
              class="field-error"
              data-id="authorTitle-error"
            >
              {authorTitleError}
            </p>
          </template>
        </div>

        <div class="field vibe-field">
          <span class="field-label" id="vibe-label">{vibeLabel}</span>
          <button
            type="button"
            class="vibe-toggle"
            role="switch"
            aria-checked={vibeChecked}
            aria-labelledby="vibe-label"
            aria-describedby="vibe-hint"
            onclick={handleVibeToggle}
            data-id="vibe-toggle"
          >
            <span class="vibe-track" aria-hidden="true"
              ><span class="vibe-thumb"></span
            ></span>
            <span class="vibe-value" aria-hidden="true">{vibeValue}</span>
          </button>
          <p id="vibe-hint" class="field-hint">{vibeHint}</p>
          <p class="visually-hidden" aria-live="polite" data-id="vibe-status">
            {vibeAnnouncement}
          </p>
        </div>

        <div class="field mode-field" role="group" aria-labelledby="mode-label">
          <span class="field-label" id="mode-label"
            >How would you like to write it?</span
          >
          <div class="mode-options">
            <button
              type="button"
              class="mode-option"
              data-mode="builder"
              data-id="mode-builder"
              aria-pressed={builderPressed}
              onclick={handleModeChange}
            >
              Build a sentence
            </button>
            <button
              type="button"
              class="mode-option"
              data-mode="own"
              data-id="mode-own"
              aria-pressed={ownPressed}
              onclick={handleModeChange}
            >
              Write my own
            </button>
          </div>
        </div>

        <template lwc:if={isOwnWords}>
          <div class="field" data-id="own-words">
            <label class="field-label" for="relationship-own"
              >How do you know Ryan?</label
            >
            <select
              id="relationship-own"
              class="field-input"
              name="relationship"
              required
              aria-invalid={relationshipInvalid}
              aria-describedby="relationship-own-error"
              onchange={handleInput}
            >
              <option value="" selected={noRelationship}>
                Choose a relationship
              </option>
              <template for:each={relationshipOptions} for:item="option">
                <option
                  key={option.value}
                  value={option.value}
                  selected={option.selected}
                >
                  {option.label}
                </option>
              </template>
            </select>
            <template lwc:if={relationshipError}>
              <p
                id="relationship-own-error"
                class="field-error"
                data-id="relationship-error"
              >
                {relationshipError}
              </p>
            </template>
          </div>
          <div class="field">
            <label class="field-label" for="ownWords">Your review</label>
            <textarea
              id="ownWords"
              class="field-input field-textarea"
              name="ownWords"
              rows="4"
              required
              maxlength={maxOwnWordsLength}
              aria-invalid={ownWordsInvalid}
              aria-describedby="ownWords-count ownWords-error"
              oninput={handleInput}
            ></textarea>
            <p
              id="ownWords-count"
              class={ownWordsLimit.className}
              data-id="ownWords-count"
            >
              {ownWordsLimit.text}
            </p>
            <template lwc:if={ownWordsError}>
              <p
                id="ownWords-error"
                class="field-error"
                data-id="ownWords-error"
              >
                {ownWordsError}
              </p>
            </template>
          </div>
        </template>

        <template lwc:else>
          <template lwc:if={loadError}>
            <p class="message message-error" role="alert" data-id="load-error">
              {loadError}
            </p>
          </template>

          <fieldset class="sentence" data-id="sentence">
            <legend class="field-label sentence-legend">
              Your sentence: I'm a [relationship], and Ryan [strength]. The
              result? [outcome]
            </legend>
            <div class="blank">
              <label class="blank-label" for="relationship">I'm a</label>
              <select
                id="relationship"
                class="field-input blank-input"
                name="relationship"
                required
                aria-invalid={relationshipInvalid}
                aria-describedby="relationship-error"
                onchange={handleInput}
              >
                <option value="" selected={noRelationship}>
                  Choose a relationship
                </option>
                <template for:each={relationshipOptions} for:item="option">
                  <option
                    key={option.value}
                    value={option.value}
                    selected={option.selected}
                  >
                    {option.label}
                  </option>
                </template>
              </select>
              <template lwc:if={relationshipError}>
                <p
                  id="relationship-error"
                  class="field-error blank-error"
                  data-id="relationship-error"
                >
                  {relationshipError}
                </p>
              </template>
            </div>
            <div class="blank">
              <label class="blank-label" for="strength">and Ryan</label>
              <select
                id="strength"
                class="field-input blank-input"
                name="strength"
                required
                aria-invalid={strengthInvalid}
                aria-describedby="strength-error"
                onchange={handleInput}
              >
                <option value="" selected={noStrength}>
                  Choose a strength
                </option>
                <template for:each={strengthOptions} for:item="option">
                  <option
                    key={option.value}
                    value={option.value}
                    selected={option.selected}
                  >
                    {option.label}
                  </option>
                </template>
              </select>
              <template lwc:if={strengthError}>
                <p
                  id="strength-error"
                  class="field-error blank-error"
                  data-id="strength-error"
                >
                  {strengthError}
                </p>
              </template>
            </div>
            <div class="blank">
              <label class="blank-label" for="outcome">The result?</label>
              <select
                id="outcome"
                class="field-input blank-input"
                name="outcome"
                required
                aria-invalid={outcomeInvalid}
                aria-describedby="outcome-error"
                onchange={handleInput}
              >
                <option value="" selected={noOutcome}>Choose a result</option>
                <template for:each={outcomeOptions} for:item="option">
                  <option
                    key={option.value}
                    value={option.value}
                    selected={option.selected}
                  >
                    {option.label}
                  </option>
                </template>
              </select>
              <template lwc:if={outcomeError}>
                <p
                  id="outcome-error"
                  class="field-error blank-error"
                  data-id="outcome-error"
                >
                  {outcomeError}
                </p>
              </template>
            </div>
            <p class="preview" aria-live="polite" data-id="preview">
              {previewText}
            </p>
          </fieldset>

          <div class="field">
            <label class="field-label" for="note"
              >Anything to add? (optional)</label
            >
            <textarea
              id="note"
              class="field-input field-textarea"
              name="note"
              rows="3"
              maxlength={maxNoteLength}
              aria-invalid={noteInvalid}
              aria-describedby="note-count note-error"
              oninput={handleInput}
            ></textarea>
            <p id="note-count" class={noteLimit.className} data-id="note-count">
              {noteLimit.text}
            </p>
            <template lwc:if={noteError}>
              <p id="note-error" class="field-error" data-id="note-error">
                {noteError}
              </p>
            </template>
          </div>
        </template>

        <div class="trap" aria-hidden="true">
          <label for="website">Leave this field empty</label>
          <input
            id="website"
            name="website"
            type="text"
            aria-label="Leave this field empty"
            tabindex="-1"
            autocomplete="off"
            value={form.website}
            oninput={handleInput}
          />
        </div>

        <div class="actions">
          <button
            type="submit"
            class="submit-button"
            disabled={isSubmitDisabled}
            data-id="submit"
          >
            {submitLabel}
          </button>
        </div>

        <div aria-live="polite">
          <template lwc:if={serverError}>
            <p class="message message-error" role="alert" data-id="error">
              {serverError}
            </p>
          </template>
        </div>
      </form>
    </template>
  </section>
</template>
