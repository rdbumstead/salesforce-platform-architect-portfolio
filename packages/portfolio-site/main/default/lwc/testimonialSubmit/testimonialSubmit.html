<template>
  <section class="testimonial" aria-labelledby="testimonial-heading">
    <h2 id="testimonial-heading" class="testimonial-title">Leave a Review</h2>
    <p class="testimonial-intro">
      Every review is read before it appears on the site.
    </p>

    <form class="testimonial-form" onsubmit={handleSubmit} novalidate>
      <div class="field">
        <label class="field-label" for="authorName">Your name</label>
        <input
          id="authorName"
          class="field-input"
          name="authorName"
          type="text"
          required
          autocomplete="name"
          maxlength={maxNameLength}
          value={form.authorName}
          oninput={handleInput}
        />
      </div>

      <div class="field">
        <label class="field-label" for="authorTitle"
          >Your title (optional)</label
        >
        <input
          id="authorTitle"
          class="field-input"
          name="authorTitle"
          type="text"
          autocomplete="organization-title"
          maxlength={maxTitleLength}
          value={form.authorTitle}
          oninput={handleInput}
        />
      </div>

      <div class="field vibe-field">
        <span class="field-label" id="vibe-label">Vibe</span>
        <button
          type="button"
          class="vibe-toggle"
          role="switch"
          aria-checked={vibeChecked}
          aria-labelledby="vibe-label vibe-value"
          aria-describedby="vibe-hint"
          onclick={handleVibeToggle}
          data-id="vibe-toggle"
        >
          <span class="vibe-track" aria-hidden="true"
            ><span class="vibe-thumb"></span
          ></span>
          <span class="vibe-value" id="vibe-value">{vibeLabel}</span>
        </button>
        <p id="vibe-hint" class="field-hint">{vibeHint}</p>
      </div>

      <template lwc:if={loadError}>
        <p class="message message-error" role="alert" data-id="load-error">
          {loadError}
        </p>
      </template>

      <fieldset class="sentence" data-id="sentence">
        <legend class="field-label sentence-legend">
          Your sentence: I'm a [relationship], and Ryan [strength]. The result?
          [outcome]
        </legend>
        <div class="blank">
          <label class="blank-label" for="relationship">I'm a</label>
          <select
            id="relationship"
            class="field-input blank-input"
            name="relationship"
            required
            onchange={handleInput}
          >
            <option value="" selected={noRelationship}>
              Choose a relationship
            </option>
            <template for:each={relationshipOptions} for:item="option">
              <option
                key={option.value}
                value={option.value}
                selected={option.selected}
              >
                {option.label}
              </option>
            </template>
          </select>
        </div>
        <div class="blank">
          <label class="blank-label" for="strength">and Ryan</label>
          <select
            id="strength"
            class="field-input blank-input"
            name="strength"
            required
            onchange={handleInput}
          >
            <option value="" selected={noStrength}>Choose a strength</option>
            <template for:each={strengthOptions} for:item="option">
              <option
                key={option.value}
                value={option.value}
                selected={option.selected}
              >
                {option.label}
              </option>
            </template>
          </select>
        </div>
        <div class="blank">
          <label class="blank-label" for="outcome">The result?</label>
          <select
            id="outcome"
            class="field-input blank-input"
            name="outcome"
            required
            onchange={handleInput}
          >
            <option value="" selected={noOutcome}>Choose a result</option>
            <template for:each={outcomeOptions} for:item="option">
              <option
                key={option.value}
                value={option.value}
                selected={option.selected}
              >
                {option.label}
              </option>
            </template>
          </select>
        </div>
        <p class="preview" aria-live="polite" data-id="preview">
          {previewText}
        </p>
      </fieldset>

      <div class="field">
        <label class="field-label" for="note"
          >Anything to add? (optional)</label
        >
        <textarea
          id="note"
          class="field-input field-textarea"
          name="note"
          rows="3"
          maxlength={maxNoteLength}
          aria-describedby="note-count"
          oninput={handleInput}
        ></textarea>
        <p id="note-count" class="field-hint">{noteCount}</p>
      </div>

      <div class="trap" aria-hidden="true">
        <label for="website">Leave this field empty</label>
        <input
          id="website"
          name="website"
          type="text"
          tabindex="-1"
          autocomplete="off"
          value={form.website}
          oninput={handleInput}
        />
      </div>

      <div class="actions">
        <button
          type="submit"
          class="submit-button"
          disabled={isSubmitDisabled}
          data-id="submit"
        >
          {submitLabel}
        </button>
      </div>

      <div aria-live="polite">
        <template lwc:if={successMessage}>
          <p class="message message-success" data-id="success">
            {successMessage}
          </p>
        </template>
        <template lwc:if={serverError}>
          <p class="message message-error" role="alert" data-id="error">
            {serverError}
          </p>
        </template>
      </div>
    </form>
  </section>
</template>
