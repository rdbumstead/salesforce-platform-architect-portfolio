<template>
  <section class="matrix" aria-label="Decision matrix">
    <div class="card-header">
      <h3 class="card-title">Decision matrix</h3>
      <c-view-source source-key="decisionMatrix"></c-view-source>
    </div>
    <template lwc:if={isLoading}>
      <p class="matrix-note">Loading the decision matrix.</p>
    </template>
    <template lwc:if={error}>
      <p class="matrix-note matrix-error" role="alert">
        The decision matrix could not load. Try again later.
      </p>
    </template>
    <template lwc:if={hasMatrix}>
      <template lwc:if={showPlaceholderBanner}>
        <p class="placeholder-banner" data-id="placeholder-banner">
          {bannerText}
        </p>
      </template>
      <p class="matrix-help">
        Move a weight from 0 (ignored) to 10 (decisive). Open a score to read
        why it was given. A total is each weight times its score, added up per
        option. The leading option is tinted.
      </p>
      <div class="table-scroll">
        <table class="matrix-table" role="table">
          <caption>
            Weighted scores for three platform options, one row per criterion
          </caption>
          <thead role="rowgroup">
            <tr role="row">
              <th scope="col" role="columnheader">Criterion</th>
              <th scope="col" role="columnheader">Weight</th>
              <template for:each={columns} for:item="col">
                <th
                  scope="col"
                  role="columnheader"
                  key={col.key}
                  class={col.className}
                >
                  <span class="option-label">{col.label}</span>
                  <span class="option-summary">{col.summary}</span>
                  <span class={col.tagClassName}>Leading</span>
                </th>
              </template>
            </tr>
          </thead>
          <tbody role="rowgroup">
            <template for:each={rows} for:item="row">
              <tr key={row.key} role="row" class="criterion-row">
                <th scope="row" role="rowheader" class="criterion">
                  <span class="criterion-label">{row.label}</span>
                  <span class="criterion-description">{row.description}</span>
                </th>
                <td class="weight-cell" role="cell" data-label="Weight">
                  <label class="weight-label">
                    <span class="assistive-text">{row.sliderLabel}</span>
                    <input
                      class="weight-slider"
                      type="range"
                      min="0"
                      max="10"
                      step="1"
                      value={row.weight}
                      aria-valuetext={row.valueText}
                      data-criterion={row.key}
                      data-tour-anchor={row.tourAnchor}
                      oninput={handleWeightInput}
                      onchange={handleWeightChange}
                    />
                  </label>
                  <span class="weight-value" aria-hidden="true"
                    >{row.weight}</span
                  >
                </td>
                <template for:each={row.cells} for:item="cell">
                  <td
                    key={cell.key}
                    class="score-cell"
                    role="cell"
                    data-label={cell.optionLabel}
                  >
                    <template lwc:if={cell.hasScore}>
                      <details class="score-details">
                        <summary
                          class="score-summary"
                          data-label={cell.optionLabel}
                          aria-label={cell.scoreLabel}
                        >
                          {cell.score}
                        </summary>
                        <p class="rationale">{cell.rationale}</p>
                        <p class="evidence">Source: {cell.evidence}</p>
                      </details>
                    </template>
                  </td>
                </template>
              </tr>
            </template>
          </tbody>
          <tfoot role="rowgroup">
            <tr role="row" class="total-row">
              <th scope="row" role="rowheader">Weighted total</th>
              <td role="cell" class="total-spacer"></td>
              <template for:each={totalCells} for:item="cell">
                <td
                  key={cell.key}
                  class={cell.className}
                  role="cell"
                  data-option={cell.key}
                  data-label={cell.optionLabel}
                >
                  {cell.total}
                </td>
              </template>
            </tr>
          </tfoot>
        </table>
      </div>
      <div class="matrix-results" aria-live="polite">
        <p class="ranking" data-id="ranking">
          <span class="result-label">Ranking:</span> {rankingText}
        </p>
        <p class="sensitivity" data-id="sensitivity">
          <span class="result-label">Sensitivity:</span> {sensitivityText}
        </p>
      </div>
      <button type="button" class="reset-button" onclick={handleReset}>
        Reset to the starting weights
      </button>
    </template>
  </section>
</template>
