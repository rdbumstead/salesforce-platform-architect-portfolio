<template>
  <div class="build">
    <section class="section" aria-labelledby="build-heading">
      <h2 id="build-heading" class="section-heading">How this site is built</h2>
      <p class="section-intro" data-id="intro">
        This site runs on a Salesforce org I designed, built and deploy myself.
        Each part below is live, so a technical reviewer can check the work
        instead of taking my word for it. Read&#32;
        <a
          class="inline-link"
          href={guestAccessHref}
          data-id="guest-access-link"
          >how a visitor's request reaches the data, and what limits it</a
        >.
      </p>
      <ul class="cards" data-id="pillar-list">
        <template for:each={pillars} for:item="pillar">
          <li
            key={pillar.key}
            class="card"
            data-id="pillar-card"
            data-key={pillar.key}
          >
            <article class="card-body">
              <template lwc:if={pillar.hasStat}>
                <p class="metric" data-id="pillar-stat">
                  <span class="metric-number">{pillar.statNumber}</span>
                  <span class="metric-label">{pillar.statLabel}</span>
                </p>
              </template>
              <template lwc:else>
                <p
                  class="metric metric-spacer"
                  data-id="metric-spacer"
                  aria-hidden="true"
                ></p>
              </template>
              <h3 class="card-title">
                <span class="letter" aria-hidden="true">{pillar.letter}</span
                ><span class="card-name">{pillar.name}</span>
              </h3>
              <p class="card-text">{pillar.summary}</p>
              <div class="card-action">
                <a
                  class="btn btn-secondary"
                  href={pillar.href}
                  aria-label={pillar.linkAriaLabel}
                  data-id="pillar-link"
                  >Open <span aria-hidden="true">→</span></a
                >
              </div>
            </article>
          </li>
        </template>
      </ul>
      <template lwc:if={hasComing}>
        <p class="coming-note" data-id="coming-note">{comingText}</p>
      </template>
    </section>
  </div>
</template>
