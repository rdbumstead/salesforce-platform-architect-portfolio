<template>
  <section class="contact" aria-labelledby="contact-heading">
    <div id="contact" class="contact-heading-wrap">
      <h2
        id="contact-heading"
        class="contact-title"
        tabindex="-1"
        data-id="heading"
      >
        {heading}
      </h2>
    </div>
    <template lwc:if={intro}>
      <p class="contact-intro">{intro}</p>
    </template>

    <div aria-live="polite" data-id="status">
      <template lwc:if={isSent}>
        <div class="message message-success" data-id="success" tabindex="-1">
          <p class="success-title">{successTitle}</p>
          <p>{successDetail}</p>
        </div>
      </template>
    </div>

    <template lwc:if={showForm}>
      <form class="contact-form" onsubmit={handleSubmit} novalidate>
        <div class="field-row">
          <div class="field">
            <label class="field-label" for="firstName">First name</label>
            <input
              id="firstName"
              class="field-input"
              name="firstName"
              type="text"
              required
              autocomplete="given-name"
              maxlength={maxFirstName}
              aria-invalid={firstNameInvalid}
              aria-describedby="firstName-error"
              value={form.firstName}
              oninput={handleInput}
            />
            <template lwc:if={firstNameError}>
              <p
                id="firstName-error"
                class="field-error"
                data-id="firstName-error"
              >
                {firstNameError}
              </p>
            </template>
          </div>
          <div class="field">
            <label class="field-label" for="lastName">Last name</label>
            <input
              id="lastName"
              class="field-input"
              name="lastName"
              type="text"
              required
              autocomplete="family-name"
              maxlength={maxLastName}
              aria-invalid={lastNameInvalid}
              aria-describedby="lastName-error"
              value={form.lastName}
              oninput={handleInput}
            />
            <template lwc:if={lastNameError}>
              <p
                id="lastName-error"
                class="field-error"
                data-id="lastName-error"
              >
                {lastNameError}
              </p>
            </template>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="email">Email</label>
          <input
            id="email"
            class="field-input"
            name="email"
            type="email"
            required
            aria-invalid={emailInvalid}
            aria-describedby="email-hint email-error"
            autocomplete="email"
            maxlength={maxEmail}
            value={form.email}
            oninput={handleInput}
          />
          <p id="email-hint" class="field-hint">
            Ryan replies to this address.
          </p>
          <template lwc:if={emailError}>
            <p id="email-error" class="field-error" data-id="email-error">
              {emailError}
            </p>
          </template>
        </div>

        <div class="field">
          <label class="field-label" for="company">Company (optional)</label>
          <input
            id="company"
            class="field-input"
            name="company"
            type="text"
            autocomplete="organization"
            maxlength={maxCompany}
            aria-invalid={companyInvalid}
            aria-describedby="company-error"
            value={form.company}
            oninput={handleInput}
          />
          <template lwc:if={companyError}>
            <p id="company-error" class="field-error" data-id="company-error">
              {companyError}
            </p>
          </template>
        </div>

        <div class="field">
          <label class="field-label" for="message">Message</label>
          <textarea
            id="message"
            class="field-input field-textarea"
            name="message"
            required
            rows="5"
            maxlength={maxMessage}
            aria-invalid={messageInvalid}
            aria-describedby="message-count message-error"
            oninput={handleInput}
          ></textarea>
          <p id="message-count" class="field-hint">{messageCount}</p>
          <template lwc:if={messageError}>
            <p id="message-error" class="field-error" data-id="message-error">
              {messageError}
            </p>
          </template>
        </div>

        <div class="trap" aria-hidden="true">
          <label for="website">Leave this field empty</label>
          <input
            id="website"
            name="website"
            type="text"
            aria-label="Leave this field empty"
            tabindex="-1"
            autocomplete="off"
            value={form.website}
            oninput={handleInput}
          />
        </div>

        <p class="privacy" data-id="privacy">{privacyNote}</p>

        <div class="actions">
          <button
            type="submit"
            class="submit-button"
            disabled={isSubmitDisabled}
            data-id="submit"
          >
            {submitLabel}
          </button>
        </div>

        <div aria-live="polite">
          <template lwc:if={serverError}>
            <p class="message message-error" role="alert" data-id="error">
              {serverError}
            </p>
          </template>
        </div>
      </form>
    </template>
  </section>
</template>
