<template>
  <section class="checklist" aria-labelledby="governance-heading">
    <p class="eyebrow">Pipeline governance</p>
    <h2 class="heading" id="governance-heading">Governance checklist</h2>

    <template lwc:if={isLoading}>
      <p class="visually-hidden" role="status" data-id="loading">
        Loading the latest pipeline runs.
      </p>
    </template>
    <template lwc:elseif={hasError}>
      <p class="note" role="status">
        The pipeline status could not be loaded. No item is shown as passed.
      </p>
    </template>

    <ul class="items">
      <template for:each={items} for:item="item">
        <li key={item.key} class="item" data-key={item.key}>
          <span class={item.stateClass} data-ticked={item.ticked}>
            {item.stateText}
          </span>
          <div class="body">
            <p class="label">{item.label}</p>
            <template lwc:if={item.hasRunLink}>
              <p class="evidence">
                <a
                  class="run-link"
                  href={item.run.url}
                  target="_blank"
                  rel="noopener noreferrer"
                  title={item.run.sha}
                  aria-label={item.run.linkLabel}
                  data-workflow={item.run.workflow}
                  onclick={handleRunClick}
                  >{item.run.shortSha}</a
                >
                <template lwc:if={item.hasRunTime}>
                  <time
                    class="time"
                    datetime={item.run.iso}
                    title={item.run.timeTitle}
                    >{item.run.time}</time
                  >
                </template>
              </p>
            </template>
            <template lwc:if={item.hasRunText}>
              <p class="evidence">
                <span class="sha" title={item.run.sha}
                  >{item.run.shortSha}</span
                >
                <template lwc:if={item.hasRunTime}>
                  <time
                    class="time"
                    datetime={item.run.iso}
                    title={item.run.timeTitle}
                    >{item.run.time}</time
                  >
                </template>
              </p>
            </template>
            <template lwc:if={item.hasCache}>
              <template for:each={item.cacheRows} for:item="cache">
                <p
                  key={cache.key}
                  class="evidence cache"
                  data-cache={cache.key}
                >
                  <span class="time">{cache.lead}</span>
                  <template lwc:if={cache.known}>
                    <time class="time" datetime={cache.iso} title={cache.title}
                      >{cache.text}</time
                    >
                  </template>
                  <template lwc:else>
                    <span class="time">none</span>
                  </template>
                </p>
              </template>
            </template>
          </div>
        </li>
      </template>
    </ul>

    <p class="note">
      Updated by a platform event from the pipeline. Refreshed when you open or
      return to this page.
    </p>
  </section>
</template>
